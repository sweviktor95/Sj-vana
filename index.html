function lessonView(cid,lid){
  const f=findLesson(cid,lid); if(!f) return home();
  const {mi,li,m,l}=f, c=COURSES.find(x=>x.id===cid), all=flatLessons(cid), idx=all.findIndex(x=>x.id===lid);
  const prev=all[idx-1], next=all[idx+1], lastInMod=li===m.ls.length-1;
  const checks=(l.c||[]).map(q=>({...q,order:shuffle(q.o.map((_,i)=>i)),pick:null}));
  function renderChecks(){
    return checks.map((q,qi)=>`<div class="check"><p class="q">${q.q}</p><div class="opts">${q.order.map((oi,k)=>{let cls='';if(q.pick!=null){if(oi===q.a)cls='right';else if(oi===q.pick)cls='wrong'}return `<button class="opt ${cls}" data-q="${qi}" data-oi="${oi}" ${q.pick!=null?'disabled':''}><span class="k">${'ABCD'[k]}</span><span>${q.o[oi]}</span></button>`}).join('')}</div>
    ${q.pick!=null?`<p class="ex ${q.pick===q.a?'good':'bad'}"><strong>${q.pick===q.a?'Rätt':'Inte riktigt'}</strong>${q.e}</p>`:''}</div>`).join('');
  }
  function paint(){
    const allAns=checks.every(q=>q.pick!=null), right=checks.filter(q=>q.pick===q.a).length;
    app.innerHTML=`<article class="card lesson">
     <div class="topbar"><span class="eyebrow">${c.name} · modul ${mi+1}: ${m.t}</span><button class="btn" id="toc">Kursinnehåll</button></div>
     <div class="track"><i style="width:${(idx)/all.length*100}%"></i></div>
     <h2>${l.t}</h2>
     <div class="lbody">${l.b}</div>
     ${l.sim?`<div class="simtip"><span class="eyebrow">Öva det här</span>${simCard(l.sim)}</div>`:''}
     ${checks.length?`<div class="checks"><span class="eyebrow">Kontrollfrågor</span>${renderChecks()}</div>`:''}
     ${allAns&&lastInMod&&m.sim?`<div class="simtip"><span class="eyebrow">Modulen klar: öva i simulatorn</span>${simCard(m.sim)}</div>`:''}
     <div class="controls lnav">${prev?`<button class="btn" id="prev">← Föregående</button>`:''}
       <button class="btn primary" id="done" ${allAns?'':'disabled'}>${next?'Klar, nästa lektion →':'Klar, tillbaka till kursen'}</button>
       ${allAns?`<span class="foot">${right} av ${checks.length} rätt${right<checks.length?'. Läs gärna igenom avsnittet igen.':''}</span>`:'<span class="foot">Svara på kontrollfrågorna för att gå vidare.</span>'}</div>
    </article>`;
    initWidgets(app);
    $('#toc').onclick=()=>go('kurs-'+cid);
    $('#prev')?.addEventListener('click',()=>go('lek-'+cid+'-'+prev.id));
    $('#done').onclick=()=>{prog[lid]=true;saveProg();go(next?'lek-'+cid+'-'+next.id:'kurs-'+cid)};
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const q=checks[+b.dataset.q];if(q.pick!=null)return;q.pick=+b.dataset.oi;const y=window.scrollY;paint();window.scrollTo({top:y})});
    app.querySelectorAll('[data-sim]').forEach(el=>el.onclick=()=>go(el.dataset.sim));
  }
  if(!checks.length){checks.length=0}
  paint();window.scrollTo({top:0});
}

const EXTRA_POOL=[

 {c:'forar',sec:2,q:'Motorn stannar efter en stund men startar igen efter en paus. Vad är en trolig orsak?',o:['Igensatt tankluftning, som ger undertryck i tanken','För kallt kylvatten','Fulladdat batteri','För stor propeller'],a:0,e:'Kontrollera tankluftningen. Andra vanliga bränslefel är vatten eller smuts i filtret och luft i dieselsystemet.'},
 {c:'forar',sec:2,q:'Var syns vatten i bränslet oftast?',o:['I bränslefiltrets vattenavskiljare','På oljestickan','I kylvattenstrålen','I ekolodet'],a:0,e:'Töm vattenavskiljaren och byt filter vid behov.'},
 {c:'forar',sec:2,q:'Vad kallas linorna som går snett mellan båten och bryggan?',o:['Springar','Fendrar','Skot','Fall'],a:0,e:'Springarna hindrar båten från att glida fram och tillbaka längs bryggan.'},
 {c:'forar',sec:2,q:'Vad kallas linan från fören in till bryggan?',o:['Förtamp','Aktertamp','Spring','Skot'],a:0,e:'Från aktern går aktertampen.'},
 {c:'forar',sec:1,q:'Vilka signalflaggor betyder nöd?',o:['N över C','Flagga A','Två röda flaggor','En vit flagga'],a:0,e:'N över C är en nödsignal. Flagga A betyder dykare i vattnet.'},
 {c:'kust',sec:2,q:'Vad är du skyldig att göra efter en kollision?',o:['Stanna, hjälpa de inblandade och uppge namn och båt','Bara anmäla till försäkringsbolaget','Lämna platsen om ingen skadats','Ingenting om du inte orsakade den'],a:0,e:'Sjölagen kräver detta av befälhavaren efter en sammanstötning.'},
 {c:'kust',sec:2,q:'Vem ansvarar för att båten är sjövärdig innan avgång?',o:['Befälhavaren','Varvet','Försäkringsbolaget','Transportstyrelsen'],a:0,e:'Det gäller även fritidsbåtar.'},
 {c:'kust',sec:2,q:'Du kommer till Sverige från Åland med varor ombord. Vad gäller?',o:['Tullregler kan gälla, eftersom Åland ligger utanför EU:s skatteområde','Inga regler gäller inom Norden','Bara om du har fler än 12 personer ombord','Bara för segelbåtar'],a:0,e:'Kontrollera Tullverkets regler för införsel.'},
 {c:'kust',sec:2,q:'Vad kan bli följden av att inte hjälpa någon i sjönöd när du kan?',o:['Straff enligt sjölagen','Ingenting','Bara en varning','Bara indraget förarintyg'],a:0,e:'Underlåtenhet att bistå vid sjönöd är straffbart.'},
 {c:'kust',sec:2,q:'Vad kräver fartygssäkerhetslagen av den som för båten?',o:['Tillräcklig syn och hörsel och kännedom om båten','Kustskepparintyg alltid','Ett års erfarenhet','Läkarintyg varje år'],a:0,e:'Den som för båten ska också se till att den är tillräckligt bemannad.'},
 {c:'kust',sec:2,q:'Vilka får preja (stoppa) din båt?',o:['Bland andra Kustbevakningen, polisen, Tullverket och Försvarsmakten','Bara hamnkaptenen','Vilken båt som helst','Ingen till sjöss'],a:0,e:'Följ alltid order från myndighetsfartyg.'},
 {c:'kust',sec:4,q:'Varför ska pejlkompassen användas en bit från motor och elektronik?',o:['Annars får den deviation','Den blir för varm','Den tappar batteri','Den visar fel fart'],a:0,e:'Järn och elektronik stör alla magnetkompasser.'},
 {c:'kust',sec:4,q:'Vad händer med deviationen när båten byter kurs?',o:['Den ändras','Den är alltid densamma','Den försvinner','Den blir alltid noll på nordliga kurser'],a:0,e:'Därför finns deviationstabellen, med värden för olika kurser.'},
 {c:'kust',sec:4,q:'Loggen visar 6 knop och GPS:en 7,5 knop fart över grund. Vad är troligast?',o:['Du har medström på ungefär 1,5 knop','Loggen är trasig','Du har motström','GPS:en visar fel'],a:0,e:'Loggen mäter farten genom vattnet, GPS:en farten över grund.'},

 {c:'kust',sec:6,q:'Vilket nummer ringer du med mobilen vid sjönöd?',o:['112','90 000','1177','113 13'],a:0,e:'Be om sjöräddningen. Med VHF anropar du på kanal 16.'},
 {c:'kust',sec:6,q:'Vad är bra att göra innan en längre kustfärd?',o:['Berätta för någon i land om rutt och beräknad ankomst','Stänga av VHF:en','Lämna flytvästarna hemma','Tömma bränsletanken'],a:0,e:'Då finns någon som kan larma om du inte kommer fram.'}

function examPools(cid,sec){
 const prim=[],secd=[],seen=new Set(),add=(arr,q)=>{if(!q||!q.o||seen.has(q.q))return;seen.add(q.q);arr.push(q)};
 (LESSONS[cid]||[]).forEach(m=>m.ls.forEach(l=>{if(LSEC[cid](l.id)===sec)(l.c||[]).forEach(q=>add(prim,q))}));
 COURSES.find(c=>c.id===cid).qs.forEach(q=>{if(QSEC[cid](q.q)===sec)add(prim,q)});
 EXTRA_POOL.filter(e=>e.c===cid&&e.sec===sec).forEach(e=>add(prim,e));
 if(cid==='kust'){LESSONS.forar.forEach(m=>m.ls.forEach(l=>{if(LSEC.kustF(l.id)===sec)(l.c||[]).forEach(q=>add(secd,q))}));COURSES.find(c=>c.id==='forar').qs.forEach(q=>{if(QSEC.kust(q.q)===sec)add(secd,q)});EXTRA_POOL.filter(e=>e.c==='forar'&&QSEC.kust(e.q)===sec).forEach(e=>add(secd,e))}
 return {prim,secd};
}
const partMax=p=>p.n+(p.draw||0)*(p.dp||1)+(p.chart?p.chart.reduce((a,b)=>a+b,0):0);
function buildExam(cid){const items=[];EXAMS[cid].parts.forEach((p,pi)=>{const {prim,secd}=examPools(cid,p.sec);let mcs=shuffle(prim).slice(0,p.n);if(mcs.length<p.n)mcs=mcs.concat(shuffle(secd).slice(0,p.n-mcs.length));
  const its=[];if(p.draw)shuffle(DRAWSC.filter(s=>s.lvl.includes(cid))).slice(0,p.draw).forEach(s=>its.push({pi,type:'draw',s,pts:p.dp}));
  mcs.forEach(q=>its.push({pi,type:'mc',q,pts:1,order:shuffle(q.o.map((_,i)=>i))}));
  if(p.chart){const keys=shuffle(GENSET[cid]);p.chart.forEach((pts,i)=>its.push({pi,type:'chart',t:genTask(cid,keys[i%keys.length]),pts}))}
  items.push(...its)});return items}
let EX=null;
function examIntro(cid){
 const cfg=EXAMS[cid],c=COURSES.find(x=>x.id===cid);if(!cfg)return courseView(cid);
 app.innerHTML=`<section class="card"><div class="topbar"><span class="eyebrow">Provläge · ${c.name}</span><button class="btn" id="back">Till kursen</button></div>
  <h2>Prov enligt NFB:s upplägg</h2><p style="margin:0">Provet är uppdelat i delar som rättas var för sig. Alla delar måste vara godkända. Du ser inga svar förrän du lämnat in.</p>
  <div class="tablewrap"><table class="ptable"><tr><th>Del</th><th>Frågor</th><th>Poäng</th><th>Godkänt från</th></tr>${cfg.parts.map(p=>`<tr><td>${p.t}</td><td>${p.n+(p.draw||0)+(p.chart?p.chart.length:0)}</td><td>${partMax(p)}</td><td>${p.pass}</td></tr>`).join('')}</table></div>
  <p style="margin:0">Tid: ${cfg.time} minuter.${cid==='forar'?' Väjningsuppgifterna i del 1 ger 2 poäng: 1 för rätt åtgärd och 1 för rätt regel.':' Väjningsuppgifterna i del 1 ger 1 poäng när både åtgärd och regel är rätt.'}</p>
  <div class="controls"><button class="btn primary" id="go">Starta provet</button>${best['exam-'+cid]?`<span class="foot">Senast: ${best['exam-'+cid]}</span>`:''}</div>
  <p class="foot" style="margin:0">Upplägget följer NFB:s exempelprov och frågefördelning. Frågorna och övningskortet är egna, inte NFB:s.</p></section>`;
 $('#back').onclick=()=>go('kurs-'+cid);$('#go').onclick=()=>examStart(cid);
}
function examStart(cid){EX={cid,items:buildExam(cid),i:0,ans:[],end:Date.now()+EXAMS[cid].time*60000};EX.tm=setInterval(examTick,1000);stopSim=()=>clearInterval(EX.tm);examItem();window.scrollTo({top:0})}
function examTick(){if(!EX)return;const left=EX.end-Date.now();if(left<=0){examFinish(true);return}const el=$('#timer');if(el){const m=Math.floor(left/60000),s=Math.floor(left/1000)%60;el.textContent=`Tid kvar ${m}:${String(s).padStart(2,'0')}`}}
function examItem(){
 const it=EX.items[EX.i],p=EXAMS[EX.cid].parts[it.pi],last=EX.i+1>=EX.items.length;
 app.innerHTML=`<section class="card"><div class="topbar"><span class="eyebrow">${p.t} · fråga ${EX.i+1} av ${EX.items.length}</span><span class="timer" id="timer"></span></div><div class="track"><i style="width:${EX.i/EX.items.length*100}%"></i></div><div id="item"></div>
  <div class="controls"><button class="btn primary" id="nx" disabled>${last?'Lämna in provet':'Nästa fråga'}</button><button class="btn" id="skip">Hoppa över</button><button class="btn" id="quitx">Avbryt provet</button></div></section>`;
 const el=$('#item'),en=()=>{$('#nx').disabled=false};
 if(it.type==='mc'){el.innerHTML=`<p class="q">${it.q.q}</p>${it.q.fig?`<div class="fig">${it.q.fig()}</div>`:''}<div class="opts">${it.order.map((oi,k)=>`<button class="opt" data-oi="${oi}"><span class="k">${'ABCD'[k]}</span><span>${it.q.o[oi]}</span></button>`).join('')}</div>`;
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{el.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');const pk=+b.dataset.oi;EX.ans[EX.i]={pick:pk,got:pk===it.q.a?1:0};en()})}
 if(it.type==='chart')chartTaskView(el,it.t,{exam:true,onDone:r=>{EX.ans[EX.i]={r,got:r.ok?it.pts:0};en()}});
 if(it.type==='draw')drawTaskView(el,it.s,{exam:true,onDone:r=>{EX.ans[EX.i]={r,got:it.pts===2?r.pts:(r.pts===2?1:0)};en()}});
 const adv=()=>{EX.i++;if(EX.i<EX.items.length){examItem();window.scrollTo({top:0})}else examFinish(false)};
 $('#nx').onclick=adv;$('#skip').onclick=()=>{if(!EX.ans[EX.i])EX.ans[EX.i]={got:0,skipped:true};adv()};
 let sure=false;$('#quitx').onclick=()=>{if(!sure){sure=true;$('#quitx').textContent='Klicka igen för att avbryta';return}clearInterval(EX.tm);const c=EX.cid;EX=null;go('kurs-'+c)};
 examTick();
}
function examFinish(timeout){
 clearInterval(EX.tm);const cfg=EXAMS[EX.cid],c=COURSES.find(x=>x.id===EX.cid);
 const res=cfg.parts.map((p,pi)=>{const its=EX.items.map((it,i)=>({it,a:EX.ans[i]})).filter(x=>x.it.pi===pi);const max=its.reduce((s,x)=>s+x.it.pts,0),got=its.reduce((s,x)=>s+(x.a?x.a.got:0),0),pass=max<partMax(p)?Math.ceil(p.pass*max/partMax(p)):p.pass;return {p,its,max,got,pass,ok:got>=pass}});
 const all=res.every(r=>r.ok);best['exam-'+EX.cid]=`${all?'Godkänd':'Underkänd'} ${new Date().toLocaleDateString('sv-SE')}`;saveBest();
 const rev=({it,a})=>{const ok=a&&a.got===it.pts,tag=`<span class="tag ${ok?'ok':'no'}">${ok?'Rätt':a&&a.got>0?'Delvis':'Fel'}${it.pts>1?` · ${a?a.got:0}/${it.pts} p`:''}</span>`;
  if(it.type==='mc')return `<li>${tag}<br>${it.q.q}<br>Ditt svar: ${a&&a.pick!=null?it.q.o[a.pick]:'inget'}<br>Rätt svar: <b>${it.q.o[it.q.a]}</b><br><span class="foot">${it.q.e}</span></li>`;
  if(it.type==='chart')return `<li>${tag}<br>${it.t.text}<br>Ditt svar: ${a&&a.r?a.r.given:'inget'}<br>Rätt svar: <b>${it.t.ans.show}</b><br><span class="foot">${it.t.ex}</span></li>`;
  return `<li>${tag}<br>${it.s.txt}<br>Ditt svar: ${a&&a.r?`${a.r.acts.map(x=>ACT_TXT[x]).join(' och ')}, ${RULES.find(x=>x[0]===a.r.rule)[1]}`:'inget'}<br>Rätt svar: <b>${it.s.okTxt}</b>, ${it.s.rule.map(n=>RULES.find(x=>x[0]===n)[1]).join(' eller ')}<br><span class="foot">${it.s.ex}</span></li>`};
 app.innerHTML=`<section class="card"><div class="topbar"><span class="eyebrow">Provläge · ${c.name} · resultat</span><button class="btn" id="back">Till kursen</button></div>
  ${timeout?'<p class="ex bad"><strong>Tiden tog slut</strong>Obesvarade frågor räknas som fel.</p>':''}
  <p class="ex ${all?'good':'bad'}"><strong>${all?'Godkänt prov':'Inte godkänt'}</strong>${all?'Alla delar är godkända.':`Du behöver öva mer på: ${res.filter(r=>!r.ok).map(r=>r.p.t.split(' – ')[1]).join(', ')}.`}</p>
  <div class="tablewrap"><table class="ptable"><tr><th>Del</th><th>Poäng</th><th>Godkänt från</th><th></th></tr>${res.map(r=>`<tr><td>${r.p.t}</td><td>${r.got} av ${r.max}</td><td>${r.pass}</td><td><span class="tag ${r.ok?'ok':'no'}">${r.ok?'Godkänd':'Underkänd'}</span></td></tr>`).join('')}</table></div>
  <div class="controls"><button class="btn primary" id="again">Gör ett nytt prov</button></div>
  ${res.map(r=>`<details class="extra"${r.ok?'':' open'}><summary>${r.p.t}: genomgång</summary><ul class="review">${r.its.map(rev).join('')}</ul></details>`).join('')}</section>`;
 const cid=EX.cid;EX=null;stopSim=null;$('#back').onclick=()=>go('kurs-'+cid);$('#again').onclick=()=>examStart(cid);window.scrollTo({top:0});
}
