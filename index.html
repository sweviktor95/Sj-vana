 {id:'f-0-2',t:'Mått på sjön: sjömil, knop och grader',b:`
<p>På sjön mäter man inte i kilometer och kilometer i timmen. Det beror på att sjökorten är byggda på jordens rutnät av latitud och longitud.</p>
<ul><li><b>Nautisk mil (sjömil, M):</b> 1 852 meter, ungefär 1,9 km. Det är precis en "minut" på jordens rutnät, vilket gör det lätt att mäta i sjökortet.</li>
<li><b>Knop:</b> en nautisk mil i timmen. 10 knop är alltså ungefär 18,5 km/h. En vanlig motorbåt i planingsfart går 20–30 knop, en segelbåt 5–7 knop.</li>
<li><b>Djup</b> anges i meter.</li>
<li><b>Riktningar</b> anges i grader, 0–360, medurs från norr.</li></ul>
<h3>Kompassrosen</h3>
<p>Tänk dig en klocka som ligger platt, med norr där tolvan sitter. Varvet runt är 360 grader och räknas medurs: <b>norr 000</b>, <b>ost 090</b>, <b>syd 180</b> och <b>väst 270</b>. Mitt emellan ligger nordost 045, sydost 135, sydväst 225 och nordväst 315.</p>
${roseWidget()}
<p>Dra i reglaget eller tryck på en knapp för att se kursen. Riktningar skrivs alltid med tre siffror, till exempel <b>045</b> och inte 45, så att ingen siffra kan missas eller läggas till.</p>
<p class="key"><b>Kom ihåg:</b> Grader ökar medurs. Svänger du höger blir kursen högre, svänger du vänster blir den lägre. Från 350 och 20 grader åt höger hamnar du på 010.</p>
<h3>Några ord du kommer att möta</h3><ul><li><b>Farled:</b> ett område på vattnet där det är uppmätt och tillräckligt djupt för att köra säkert. Farleden är utmärkt med sjömärken och inritad i sjökortet.</li>
<li><b>Sjömärke (prick, boj):</b> skyltarna längs farleden. De visar var det är djupt och var det är grunt.</li>
<li><b>Sjökort:</b> kartan för sjön. Den visar djup, grund, sjömärken och farleder.</li>
<li><b>Grund:</b> där det är så grunt att båten kan slå i botten.</li></ul>`,
 c:[{q:'Vilken kurs har du om du åker rakt mot sydost?',o:['135','045','225','315'],a:0,e:'Sydost ligger mitt emellan ost 090 och syd 180.'},
    {q:'Du har kurs 350 och svänger 20 grader åt höger. Vilken kurs får du?',o:['010','370','330','020'],a:0,e:'Efter 359 börjar det om på 000. 350 + 20 = 370, minus 360 = 010.'},
    {q:'Ungefär hur många kilometer är en nautisk mil?',o:['1,9 km','1 km','10 km','0,5 km'],a:0,e:'1 852 meter.'},
    {q:'Vad betyder 12 knop?',o:['12 nautiska mil per timme','12 km/h','12 meter per sekund','12 varv per minut'],a:0,e:'Ungefär 22 km/h.'},
    {q:'Vilken riktning är 270 grader?',o:['Väster','Öster','Söder','Norr'],a:0,e:'Norr 0, öster 90, söder 180, väster 270.'}]}
]},
{t:'Sjökortet',ls:[
 {id:'f-1-1',t:'Så läser du sjökortet',b:`
<p>Sjökortet är som en karta, men för det som finns <b>under</b> vattenytan. Det är det viktigaste hjälpmedlet du har, eftersom du inte kan se grunden.</p>
<h3>Det viktigaste i kortet</h3><ul><li><b>Djupsiffror</b> i meter. En "2" betyder ungefär 2 meter djupt. Din båt behöver alltid lite mer djup än den sticker ner (djupgåendet).</li>
<li><b>Djupkurvor:</b> linjer som binder ihop samma djup, t.ex. 3, 6 och 10 meter. Grunda områden är ofta ljusblå, djupt vatten vitt.</li>
<li><b>Stenar:</b> ett litet kryss (+) betyder en sten under vattnet. Var extra försiktig kring dem.</li>
<li><b>Sjömärken och fyrar</b> är utritade med små symboler.</li></ul>
<h3>Skala</h3><p>Skalan visar hur mycket kortet har förminskat verkligheten. 1:50 000 betyder att 1 cm i kortet är 500 meter i verkligheten. Ett kort med <b>stor skala</b> (t.ex. 1:10 000) visar ett litet område i detalj. Använd alltid det mest detaljerade kortet där du kör, eftersom små stenar kan saknas i översiktskort.</p>
<h3>Lita lagom</h3><p>Mycket i skärgården är uppmätt för länge sedan. Utanför farlederna kan det finnas grund som inte är utmärkta. Håll dig till farlederna när du är osäker.</p>
<p class="key"><b>Kom ihåg:</b> Alla symboler förklaras i häftet <b>Kort 1</b>. Ändringar i sjökorten publiceras av Sjöfartsverket i <b>Ufs</b> (Underrättelser för sjöfarande).</p>`,
 c:[{q:'Vad betyder ett litet + i sjökortet?',o:['En sten under vattenytan','Ett sjukhus','En hamn','En fyr'],a:0,e:'Undervattenssten. Håll avstånd.'},
    {q:'Kortet har skala 1:50 000. Hur långt är 2 cm i verkligheten?',o:['1 km','100 m','10 km','2 km'],a:0,e:'1 cm = 500 m.'},
    {q:'Varför ska du använda det mest detaljerade kortet?',o:['Små stenar och grund kan saknas i översiktskort','Det är billigare','Det har större text','Det krävs enligt lag'],a:0,e:'I översiktskort har man förenklat bort detaljer.'}]},
 {id:'f-1-2',t:'Plotter och elektroniska sjökort',b:`
<p>En <b>plotter</b> är en GPS med sjökort, ungefär som en bil-GPS. Den visar var du är och kan rita en rutt. Även appar i mobilen fungerar som plotter.</p>
<h3>Skillnaden mot en bil-GPS</h3><ul><li>Det finns inga vägar. Plottern vet inte alltid var det är säkert, bara var kortet säger att det är djupt.</li><li>Kortet blir inte noggrannare för att du zoomar in. Zoomar du in mycket ser det detaljerat ut, men en sten som aldrig mätts kommer inte fram. Det kallas <b>överzoomning</b>.</li><li>Positionen kan vara fel några meter, och kortet kan också vara fel. Tillsammans kan det bli tiotals meter.</li></ul>
<h3>Bra att kunna</h3><ul><li><b>North up:</b> norr alltid uppåt, som en vanlig karta. <b>Course up:</b> båtens färdriktning uppåt, lättare att jämföra med det du ser.</li><li><b>Nattläge:</b> dämpad skärm så att du inte blir bländad.</li><li><b>COG och SOG</b> visar hur båten faktiskt rör sig över botten. Se nedan.</li></ul>
<h3>COG och SOG</h3>
<p>Förkortningarna kommer från engelskan:</p>
<ul><li><b>COG = Course Over Ground</b>, kurs över grund. Den riktning båten faktiskt rör sig i över botten, i grader.</li>
<li><b>SOG = Speed Over Ground</b>, fart över grund. Hur fort båten faktiskt rör sig över botten, i knop.</li></ul>
<p>Båda räknas ut av GPS:en, som jämför var båten är nu med var den var nyss.</p>
<h3>Varför skiljer de sig från kompassen och loggen?</h3>
<p>Kompassen visar vart <b>fören pekar</b>, och loggen visar hur fort båten går <b>genom vattnet</b>. Men vattnet kan själv röra sig (ström), och vinden kan trycka båten åt sidan (avdrift). Då går båten inte exakt dit fören pekar.</p>
<div class="fig">${figCog()}</div>
<p>Exemplet: fören pekar rakt norrut, 000°, och loggen visar 6 knop. Samtidigt sätter en ström österut. Båten glider därför snett, och GPS:en visar <b>COG 024°</b> och <b>SOG 6,6 knop</b>. Det är den blå linjen du faktiskt följer över botten.</p>
<ul><li>Är COG lika med kompasskursen och SOG lika med loggen finns ingen ström eller avdrift att tala om.</li>
<li>Är SOG högre än loggen har du medström. Är den lägre har du motström.</li>
<li>Vill du hålla en viss linje över botten, till exempel mellan två grund, är det COG du ska titta på.</li></ul>
<p class="key"><b>Kom ihåg:</b> Kompass och logg beskriver båten i vattnet. COG och SOG beskriver båten över botten. I mycket låg fart hoppar COG och SOG, eftersom små GPS-fel blir stora i förhållande till sträckan.</p>
<h3>Det är COG och SOG som tar dig mellan öar och hamnar</h3>
<p>Tänk dig ett rullband på en flygplats. Du går i din vanliga takt, det är loggen. Men golvet under dig rör sig också, och det är det som avgör hur fort du kommer fram till gaten. På sjön är vattnet rullbandet och botten är flygplatsgolvet. Öar, hamnar och grund ligger still på botten, så det är <b>rörelsen över botten</b> som räknas när du ska någonstans.</p>
<h4>1. Restiden räknas med SOG</h4>
<p>Ska du till en hamn 12 M bort och loggen visar 6 knop verkar det ta 2 timmar. Har du 1,5 knop motström går du bara 4,5 knop över botten, och då tar det 2 timmar och 40 minuter. Bränsle, ankomsttid och hur mycket dagsljus du har kvar beror alltså på SOG, inte på loggen.</p>
${restidWidget()}
<p class="foot" style="margin:0">Dra i reglagen. Minus på strömmen betyder motström, plus betyder medström.</p>
<h4>2. Grunden bryr sig bara om COG</h4>
<div class="fig">${figCogGrund()}</div>
<p><b>Utan rättning:</b> du styr med fören rakt mot ön, men strömmen kommer från sidan. Båten glider snett, och COG (den röda linjen) går rakt mot grundet fast fören hela tiden pekar mot ön.</p>
<p><b>Med rättning:</b> du styr lite <b>upp mot strömmen</b>, alltså åt det håll strömmen kommer ifrån. Fören pekar då snett, men COG (den gröna linjen) går rakt mot ön och klarar grundet.</p>
<ul><li>Titta på COG-linjen i plottern. Den visar vart du faktiskt är på väg.</li><li>Pekar COG-linjen mot ett grund eller en udde ska du rätta kursen, även om fören pekar rätt.</li><li>Ju lägre fart du har, desto mer påverkar strömmen. En långsam båt kan driva ordentligt.</li></ul>
<p class="key"><b>Sammanfattning:</b> Kompass och logg säger vad båten gör i vattnet. COG och SOG säger vad som händer på riktigt mellan öarna: vart du kommer och när du är framme.</p>
<details class="extra"><summary>Överkurs: raster och vektor</summary><p>Rasterkort är inskannade papperskort. Vektorkort är byggda av lager med information som du kan klicka på. På vektorkort kan information döljas om du ställer in plottern fel.</p></details>`,
 c:[{q:'Det är 10 M till hamnen. Loggen visar 5 knop och du har 1 knop motström. Hur lång tid tar resan?',o:['2 h 30 min','2 h','1 h 40 min','3 h'],a:0,e:'SOG = 5 − 1 = 4 knop. 10 ÷ 4 = 2,5 h.'},
    {q:'Fören pekar mot en ö, men COG-linjen i plottern pekar mot ett grund bredvid. Vad gör du?',o:['Rättar kursen upp mot strömmen tills COG pekar fritt från grundet','Fortsätter, fören pekar ju mot ön','Ökar farten utan att ändra kurs','Stänger av plottern'],a:0,e:'Det är COG som visar vart du faktiskt är på väg.'},
    {q:'Vad står SOG för?',o:['Speed Over Ground, fart över grund','Speed Of Gear, motorns fart','Ström och grund','Signal On GPS'],a:0,e:'SOG är farten över botten. COG är kursen över botten.'},
    {q:'Kompassen visar 090 men plottern visar COG 100. Vad betyder det?',o:['Ström eller vind trycker båten så att den rör sig mot 100 över botten','Kompassen är trasig','Du kör baklänges','Plottern visar alltid 10 grader för mycket'],a:0,e:'Fören pekar mot 090, men båten glider snett och rör sig mot 100 över botten.'},
    {q:'Du zoomar in mycket i plottern. Vad gäller?',o:['Kortet blir inte noggrannare, även om det ser detaljerat ut','Du ser alla stenar','Positionen blir exaktare','Plottern varnar alltid för grund'],a:0,e:'Det kallas överzoomning.'},
    {q:'Vad visar COG?',o:['Hur båten faktiskt rör sig över botten','Hur fort motorn går','Vart fören pekar','Vindens riktning'],a:0,e:'Course over ground.'}]}
]},
{t:'Sjömärken',ls:[
 {id:'f-2-1',t:'Röda och gröna märken',b:`
<p>De röda och gröna prickarna visar <b>var farleden går</b>. Mellan dem är det säkert vatten, alltså tillräckligt djupt. Utanför dem kan det vara grunt.</p>
<div class="figrow">${lateral('bb')}${lateral('sb')}</div>
<h3>Regeln</h3><p>När du åker <b>in mot land, hamn eller en sjö</b> ska du ha:</p><ul><li><b>röda märken till vänster</b> (babord). De har ett platt toppmärke, en cylinder.</li><li><b>gröna märken till höger</b> (styrbord). De har ett spetsigt toppmärke, en kon.</li></ul>
<p>Åker du <b>ut mot havet</b> blir det tvärtom: rött till höger och grönt till vänster.</p>
<p>Det här kallas farledens riktning. Den går normalt inifrån havet och in mot land. I sjökortet finns ibland en pil som visar riktningen där det inte är självklart.</p>
<h3>På natten</h3><p>Många märken har en lampa. Röda märken blinkar rött och gröna blinkar grönt, så regeln är densamma. Exakt hur de blinkar lär du dig i kustskepparkursen.</p>
<p class="key"><b>Minnesregel:</b> På väg hem in mot land: rött till vänster.</p>`,
 c:[{q:'Du åker in mot hamnen. Var ska de röda märkena vara?',o:['Till vänster','Till höger','Rakt fram','Spelar ingen roll'],a:0,e:'Rött till vänster på väg in.'},
    {q:'Du åker ut från hamnen mot havet. Var ska de gröna märkena vara?',o:['Till vänster','Till höger','Bakom dig','Spelar ingen roll'],a:0,e:'Ut mot havet blir det spegelvänt.'},
    {q:'Vilket toppmärke har det gröna märket?',o:['En spetsig kon','En platt cylinder','Två klot','Ett kryss'],a:0,e:'Grönt = spets, rött = platt.'}]},
 {id:'f-2-2',t:'Kardinalmärken: gula och svarta',b:`
<p>Kardinalmärken sitter runt ett grund eller en annan fara. De visar <b>åt vilket väderstreck det djupa vattnet ligger</b>. En nordprick står norr om grundet och ska passeras på norra sidan, alltså norr om pricken.</p>
<div class="fig">${figCardinalChart()}</div>
<p>Bilden visar ett grund med alla fyra märkena runt sig. Ofta finns bara ett eller två av dem i verkligheten. Den streckade linjen visar en båt som passerar norr om nordpricken, ute på djupt vatten.</p>
<h3>Känna igen dem</h3><ul><li><b>Nordprick:</b> båda konerna pekar uppåt (mot norr på kartan).</li><li><b>Sydprick:</b> båda pekar nedåt (mot söder).</li><li><b>Ostprick:</b> konerna pekar ifrån varandra, en uppåt och en nedåt. Tillsammans liknar de ett <b>O</b>, om än lite fyrkantigt.</li><li><b>Västprick:</b> konerna pekar mot varandra, som ett timglas.</li></ul>
<p class="key"><b>Minnesregel för färgen: svart styr.</b> Det svarta sitter där konerna pekar.<br>
<b>Nord:</b> konerna pekar uppåt, svart överst.<br>
<b>Syd:</b> konerna pekar nedåt, svart längst ner.<br>
<b>Ost:</b> konerna pekar både upp och ner, svart både upptill och nedtill, precis som toppen och botten av ett O.<br>
<b>Väst:</b> konerna pekar in mot mitten, svart i mitten, som midjan på ett liggande W.</p>
<details class="extra"><summary>Överkurs: ljuset</summary><p>Kardinalmärken blinkar vitt och snabbt. Antalet blixtar följer en klocka: norr blinkar hela tiden, öster 3 blixtar (klockan 3), söder 6 plus en lång, väster 9. Det övas mer i kustskepparkursen.</p></details>`,
 c:[{q:'Du ser en sydprick. Var ska du passera?',o:['Söder om pricken','Norr om pricken','Väster om pricken','På vilken sida som helst'],a:0,e:'Djupt vatten ligger söder om den, grundet norr om.'},
    {q:'Var ligger grundet i förhållande till en ostprick?',o:['Väster om pricken','Öster om pricken','Norr om pricken','Under pricken'],a:0,e:'Pricken står öster om grundet. Det djupa vattnet ligger österut.'},
    {q:'Hur pekar konerna på en nordprick?',o:['Båda uppåt','Båda nedåt','Mot varandra','Ifrån varandra'],a:0,e:'Uppåt = norr.'}]},
 {id:'f-2-3',t:'Andra märken och skyltar',b:`
<div class="figrow">${isoDanger()}${safeWater()}${special()}</div>
<ul><li><b>Enstaka grund</b> (svart-rött-svart, två svarta klot): ett litet grund mitt i öppet vatten. Det finns djupt vatten runt om, men åk inte nära själva märket.</li>
<li><b>Mittledsmärke</b> (rött och vitt randigt, rött klot): betyder säkert vatten runt märket, ofta i farledens mitt eller där en farled börjar.</li>
<li><b>Specialmärke</b> (gult med kryss): visar något särskilt, t.ex. en kabel, ett badområde eller ett militärt område. Sjökortet berättar vad.</li></ul>
<h3>Fasta märken på land</h3><p>På öar och uddar står <b>kummel</b> (stenrösen eller målade byggda märken), <b>båkar</b> och <b>fyrar</b>. De syns i sjökortet och är bra att styra mot.</p>
<h3>Skyltar vid vattnet</h3><p>Precis som vägmärken. Röd ring med en siffra betyder högsta fart i knop. Andra skyltar visar t.ex. förbud mot svall, förbud mot ankring eller att det finns en kabel.</p>`,
 c:[{q:'Ett märke är rött och vitt randigt. Vad betyder det?',o:['Säkert vatten runt märket','Grund rakt under märket','Rött ska vara till vänster','Badområde'],a:0,e:'Mittledsmärke.'},
    {q:'En skylt vid stranden har en röd ring med siffran 5. Vad betyder det?',o:['Högsta fart 5 knop','5 meter djupt','Max 5 båtar','5 minuters parkering'],a:0,e:'Fart på sjön anges i knop.'}]}
]},
{t:'Instrumenten ombord',ls:[
 {id:'f-3-1',t:'Kompassen',b:`
<p>Kompassen visar vilket håll fören pekar åt, i grader. Den fungerar även när GPS:en slutar fungera.</p>
<h3>Varför kompassen inte visar exakt rätt</h3><ul><li><b>Missvisning:</b> kompassnålen pekar mot den magnetiska nordpolen, som inte ligger på samma ställe som den "riktiga" nordpolen på kartan. I Sverige är skillnaden några grader. Den står i sjökortets kompassros.</li>
<li><b>Deviation:</b> järn och elektronik i båten stör kompassen. Felet är olika stort beroende på åt vilket håll båten pekar. Det står i båtens <b>deviationstabell</b>.</li></ul>
<p>Hur du räknar med de här felen lär du dig i navigationsmodulen.</p>
<p>En <b>pejlkompass</b> är en liten handkompass som du siktar med mot ett föremål för att få dess riktning (bäring).</p>
<p class="key"><b>Kom ihåg:</b> Lägg aldrig mobil, nycklar eller verktyg nära kompassen. Det ger fel.</p>`,
 c:[{q:'Vad orsakar deviation?',o:['Järn och elektronik i den egna båten','Jordens magnetfält','Vågorna','Solen'],a:0,e:'Missvisning kommer från jordens magnetfält.'},
    {q:'Var hittar du missvisningen?',o:['I sjökortets kompassros','På kompassen','I loggen','På motorn'],a:0,e:'Kompassrosen är den tryckta kompassen i sjökortet.'}]},
 {id:'f-3-2',t:'Logg, ekolod och GPS',b:`
<ul><li><b>Loggen</b> är båtens hastighetsmätare. Den mäter farten genom vattnet. Om du åker med en ström går du fortare över botten än loggen visar.</li>
<li><b>Ekolodet</b> mäter djupet under båten med ljudpulser. Kontrollera om det visar djupet från vattenytan, från givaren eller från båtens botten.</li>
<li><b>GPS</b> (eller GNSS) räknar ut positionen från satelliter. Den ger också fart och kurs över botten. GPS:en kan störas, och då kan positionen hoppa.</li></ul>
<p class="key"><b>Kom ihåg:</b> Jämför alltid det instrumenten säger med det du ser omkring dig.</p>`,
 c:[{q:'Vad mäter loggen?',o:['Farten genom vattnet','Djupet','Positionen','Vindstyrkan'],a:0,e:'Ekolodet mäter djupet, GPS:en positionen.'}]}
]},
{t:'Navigation',sim:'sim-dagpraktik',ls:[
 {id:'f-4-1',t:'Var är jag? Latitud och longitud',b:`
<p>Jorden är indelad i ett rutnät. Varje plats har en adress i två delar:</p><ul><li><b>Latitud:</b> hur långt norr om ekvatorn du är. Luleå ligger på ungefär 65° nord.</li><li><b>Longitud:</b> hur långt öster om Greenwich i London du är. Luleå ligger på ungefär 22° öst.</li></ul>
<div class="fig">${figLatLon()}</div>
<p>Varje grad delas i 60 minuter. En position kan skrivas 65°36,4'N 022°11,3'E. Latituden skrivs alltid först.</p>
<h3>Det smarta med sjömilen</h3><p>En minut latitud är exakt en sjömil. Därför mäter du avstånd på sjökortets <b>vänstra eller högra kant</b> (latitudskalan) med en passare: lägg passaren mellan två punkter och flytta den till kanten, så kan du läsa av hur många minuter, alltså sjömil, det är.</p>
<p class="key"><b>Kom ihåg:</b> Mät aldrig avstånd på kortets över- eller underkant. Där är minuterna kortare.</p>`,
 c:[{q:'Var på sjökortet mäter du avstånd i sjömil?',o:['På vänster eller höger kant','På överkanten','På underkanten','Var som helst'],a:0,e:'En minut latitud = en sjömil.'},
    {q:'Vad skrivs först i en position?',o:['Latitud (nord/syd)','Longitud (öst/väst)','Djupet','Klockslaget'],a:0,e:'Till exempel 65°36\'N 022°11\'E.'}]},
 {id:'f-4-2',t:'Kurs och bäring',b:`
<div class="fig">${figRoseFull(45)}</div>
<ul><li><b>Kurs</b> är riktningen båten åker i, i grader. Kurs 045 betyder nordost.</li><li><b>Bäring</b> är riktningen från dig till något du ser, t.ex. en fyr.</li></ul>
<p>Riktningar skrivs alltid med tre siffror: 045, inte 45.</p>
<p>Kurser ritar du i sjökortet med en <b>kurslinjal</b> eller <b>transportör</b> som du lägger mot kartans nord-sydliga linjer.</p>
<h3>Vind och ström flyttar båten</h3><p>Vinden trycker båten åt sidan (<b>avdrift</b>), och strömmar i vattnet flyttar den också. Båten åker därför inte exakt dit fören pekar. Styr lite mot vinden för att hålla rätt kurs. Plotterns COG visar hur du faktiskt rör dig.</p>`,
 c:[{q:'Vilken kurs är sydväst?',o:['225','135','315','045'],a:0,e:'Söder 180 + 45 = 225.'},
    {q:'Vinden kommer från vänster. Åt vilket håll ska du styra lite extra för att hålla kursen?',o:['Lite åt vänster, mot vinden','Lite åt höger','Rakt','Det spelar ingen roll'],a:0,e:'Vinden trycker dig åt höger, så du styr upp mot den.'}]},
 {id:'f-4-3',t:'Räkna med kompassfelen',b:`
<p>Sjökortet visar <b>rättvisande</b> riktning (mot den riktiga nordpolen). Kompassen visar något annat på grund av missvisning och deviation. Därför behöver du räkna om.</p>
<div class="fig">${figConvert()}</div>
<p>Tre steg från kompassen till kortet:</p><ol><li><b>Kompasskurs</b> (KK): det kompassen visar.</li><li>Lägg till <b>deviationen</b>: då får du <b>magnetisk kurs</b> (MK).</li><li>Lägg till <b>missvisningen</b>: då får du <b>rättvisande kurs</b> (RK), den du ritar i kortet.</li></ol>
<p><b>Ost räknas plus och väst minus.</b> Går du åt andra hållet, från kortet till kompassen, byter du tecken.</p>
<h3>Exempel från kortet till kompassen</h3><p>Du ritar en kurs i kortet: 100 grader. Missvisningen är 6° ost och deviationen 2° väst.</p><p>100 − 6 = 94 (magnetisk). 94 + 2 = <b>96</b>. Du styr 096 på kompassen.</p>
<p class="key"><b>Tips:</b> Räkna alltid tillbaka för att kontrollera: 096 − 2 + 6 = 100. Rätt.</p>`,
 c:[{q:'Kompassen visar 050. Deviation 3° ost, missvisning 5° ost. Vad blir rättvisande kurs?',o:['058','042','052','048'],a:0,e:'050 + 3 + 5 = 058.'},
    {q:'Kortet visar 200. Missvisning 6° ost, ingen deviation. Vad styr du på kompassen?',o:['194','206','200','186'],a:0,e:'Från kortet till kompassen byter du tecken: 200 − 6.'}]},
 {id:'f-4-4',t:'Fart, tid och sträcka',b:`
<p>Det här är samma räkning som i bilen, fast i knop och sjömil.</p>
<div class="fig">${figFTD()}</div>
<ul><li>Sträcka = fart × tid</li><li>Fart = sträcka ÷ tid</li><li>Tid = sträcka ÷ fart</li></ul>
<p>Räkna tiden i timmar: 30 min = 0,5 h, 15 min = 0,25 h, 45 min = 0,75 h, 20 min ≈ 0,33 h.</p>
<h3>Exempel</h3><p>Du ska till en hamn 12 M bort och kör 8 knop. Tid = 12 ÷ 8 = 1,5 timmar = 1 timme 30 minuter.</p>
<p class="key"><b>Snabbknep:</b> På 6 minuter åker du en tiondel av farten. 20 knop = 2 M på 6 minuter.</p>`,
 c:[{q:'Du kör 8 knop i 30 minuter. Hur långt kommer du?',o:['4 M','8 M','2 M','16 M'],a:0,e:'8 × 0,5 = 4.'},
    {q:'Hur långt kommer du på 6 minuter i 15 knop?',o:['1,5 M','15 M','6 M','0,6 M'],a:0,e:'En tiondel av farten.'}]},
 {id:'f-4-5',t:'Hitta din position utan GPS',b:`
<div class="fig">${figEns()}</div>
<h3>Enslinje</h3><p>När två föremål står rakt bakom varandra, t.ex. två märken eller en sten och ett hus, ligger du på en rak linje genom dem. Den linjen kallas <b>enslinje</b>. Den är väldigt exakt, och särskilda ensmärken används för att leda båtar genom smala passager.</p>
<div class="fig">${figKryss()}</div>
<h3>Krysspejling</h3><ol><li>Leta upp två eller tre föremål du hittar i sjökortet, t.ex. en fyr och en udde.</li><li>Sikta på dem med pejlkompassen och skriv ner gradtalen.</li><li>Räkna om till rättvisande och rita linjerna i kortet.</li><li>Där linjerna korsar varandra är du.</li></ol>
<p>Välj föremål som ligger ungefär i rät vinkel (90 grader) från varandra, då blir krysset tydligt.</p>`,
 c:[{q:'Varför är enslinjer så exakta?',o:['Du ser direkt om föremålen står i linje, utan kompass','De är alltid upplysta','De finns i plottern','De mäts med radar'],a:0,e:'Kompassfel påverkar inte en enslinje.'},
    {q:'Vilken vinkel mellan två pejlade föremål ger tydligast kryss?',o:['Ungefär 90 grader','Ungefär 10 grader','Ungefär 180 grader','Vinkeln spelar ingen roll'],a:0,e:'Små vinklar ger stora fel.'}]},
 {id:'f-4-6',t:'Planera turen och köra i farled',b:`
<h3>Före turen</h3><ul><li>Kolla väderprognosen.</li><li>Titta i sjökortet: var ska du åka, hur långt är det och var finns grund?</li><li>Ta med bränsle så att det räcker med god marginal. Tumregel: en tredjedel dit, en tredjedel hem, en tredjedel i reserv.</li><li>Berätta för någon i land vart du ska och när du räknar med att komma fram.</li></ul>
<h3>I farleden</h3><ul><li>Följ märkena i ordning och håll koll på vilket du passerar.</li><li>Välj något tydligt att styra mot, en udde eller ett märke (<b>styrmärke</b>).</li><li>Utanför farlederna är det sämre uppmätt. Kör sakta och håll avstånd till grund.</li></ul>
<h3>Hög fart</h3><p>I 25 knop åker du nästan 1 sjömil på 2 minuter. Allt händer fort. Planera rutten i förväg, sakta ner i trånga passager och när sikten är dålig.</p>`,
 c:[{q:'Hur mycket bränsle ska du ha med?',o:['Med god marginal, t.ex. en tredjedel i reserv','Precis lagom för turen','Bara för halva turen','Det spelar ingen roll'],a:0,e:'Vind och ström kan öka förbrukningen.'}]},
 {id:'f-4-7',t:'Sjökortsarbete i praktiken',sim:'sim-sjokort',b:`
<p>På provet arbetar du i ett övningssjökort med passare och kurslinjal. Det här behöver du kunna:</p>
<ol><li><b>Mäta distans:</b> öppna passaren mellan två punkter. Flytta den till latitudskalan vid sidan av kortet, i höjd med där du mäter. Varje minut är 1 M och de små strecken 0,1 M.</li>
<li><b>Mäta kurs:</b> lägg kurslinjalen eller gradskivan mellan punkterna och läs av gradtalet mot kortets nord–sydliga linjer. Det är rättvisande kurs.</li>
<li><b>Räkna om till kompasskurs:</b> dra av ostlig missvisning och deviation, lägg till västlig.</li>
<li><b>Läsa av och sätta ut en position:</b> latituden läser du på skalan vid sidan, longituden på skalan upptill eller nedtill.</li>
<li><b>Krysspejla:</b> rätta pejlingarna till rättvisande, rita linjerna genom föremålen och sätt ut positionen där de korsar varandra.</li></ol>
<p>I Sjövana finns ett eget övningskort, Sjövik, med samma verktyg. Kortet är fiktivt men byggt som ett riktigt sjökort.</p>
<p class="key"><b>Tips:</b> Skriv upp varje mellansteg: uppmätt kurs, missvisning, deviation och svar. Då hittar du själv var ett fel uppstod.</p>`,
 c:[{q:'Var läser du av hur långt passaren är öppnad?',o:['På latitudskalan vid sidan, i höjd med där du mäter','På longitudskalan upptill','På kompassrosen','På djupsiffrorna'],a:0,e:'En minut latitud är en nautisk mil.'},
    {q:'Vilken sorts kurs får du när du mäter mot kortets nord–sydliga linjer?',o:['Rättvisande kurs','Kompasskurs','Magnetisk kurs','Kurs över grund'],a:0,e:'Kortet visar rättvisande riktningar. För att styra efter kompassen räknar du om.'}]}
]},
{t:'Regler på sjön',sim:'sim-vajning',ls:[
 {id:'f-5-1',t:'Sjövägsreglerna: grunderna',b:`
<p>Precis som trafikregler på land finns det regler på sjön. De heter <b>sjövägsreglerna</b> och gäller alla båtar, från kanot till stora fartyg.</p>
<h3>Viktiga ord</h3><ul><li><b>Maskindriven båt:</b> drivs av motor. En segelbåt som kör motor räknas också som maskindriven.</li><li><b>Segelbåt:</b> seglar utan motor.</li></ul>
<h3>Fyra grundregler</h3><ul><li><b>Håll utkik:</b> titta och lyssna hela tiden, åt alla håll.</li><li><b>Säker fart:</b> kör inte fortare än att du hinner stanna eller väja. Tänk på sikt, trafik, vind och djup.</li><li><b>Bedöm kollisionsrisk:</b> om en annan båt närmar sig och ser ut att ligga kvar i samma riktning sett från dig, är ni på väg mot varandra.</li><li><b>Väj tydligt:</b> gör stora, tidiga manövrer så att den andra förstår vad du gör.</li></ul>
<p class="key"><b>Testet:</b> Sikta på den andra båten mot något fast bakom den, t.ex. en kant på din båt. Står den kvar på samma ställe medan den kommer närmare är det kollisionskurs.</p>`,
 c:[{q:'En båt kommer närmare och står kvar på samma ställe sett från dig. Vad betyder det?',o:['Kollisionskurs','Ni passerar säkert','Den ligger stilla','Den åker ifrån dig'],a:0,e:'Agera i tid.'},
    {q:'En segelbåt kör motor. Vad räknas den som?',o:['Maskindriven båt','Segelbåt','Roddbåt','Inget särskilt'],a:0,e:'Motorn avgör.'}]},
 {id:'f-5-2',t:'Vem ska väja?',sim:'sim-ritvajning',b:`
<p>De här reglerna gäller när ni ser varandra.</p>
<ul><li><b>Möte:</b> två motorbåtar rakt mot varandra. <b>Båda svänger åt höger</b> (styrbord), som när två bilar möts.</li>
<li><b>Korsande kurser:</b> två motorbåtar på väg att korsa varandra. <b>Den som har den andra på sin högra sida ska väja</b>, helst genom att svänga och gå bakom den. Det liknar högerregeln i trafiken.</li>
<li><b>Omkörning:</b> den som kör om ska alltid hålla undan, oavsett båttyp.</li>
<li><b>Den som ska väja</b> gör det tidigt och tydligt. <b>Den som inte ska väja</b> håller sin kurs och fart, så att den andra vet vad som händer.</li></ul>
<h3>Motorbåt och segelbåt</h3><p>En motorbåt ska väja för en segelbåt som seglar. Det beror på att segelbåten är beroende av vinden och har svårare att manövrera. Motorbåten ska också väja för fiskebåtar som fiskar med nät eller trål, och för fartyg som inte kan manövrera.</p>
<details class="extra"><summary>Överkurs: två segelbåtar</summary><p>Har båda segelbåtarna vinden från olika sidor väjer den som har vinden från vänster (babord). Har båda vinden från samma sida väjer den som är närmast vinden.</p></details>`,
 c:[{q:'Två motorbåtar möts rakt mot varandra. Vad gör de?',o:['Båda svänger åt höger','Båda svänger åt vänster','Den största fortsätter rakt','Båda stannar'],a:0,e:'Båda girar åt höger och passerar med vänster sida mot varandra.'},
    {q:'En motorbåt kommer från din högra sida på korsande kurs. Du kör också motorbåt. Vad gör du?',o:['Du väjer, helst genom att gå bakom den','Du håller kurs och fart','Du ökar farten','Du svänger åt vänster framför den'],a:0,e:'Den som har den andra på sin högra sida väjer.'},
    {q:'Du kör motorbåt och möter en segelbåt som seglar. Vem väjer?',o:['Du','Segelbåten','Den som kommer från höger','Den minsta båten'],a:0,e:'Motorbåt väjer för segelbåt (utom när segelbåten kör om).'}]},
 {id:'f-5-3',t:'Smala farleder, stora fartyg och dimma',b:`
<h3>Smala farleder</h3><ul><li>Håll dig till <b>höger sida</b> av farleden.</li><li>Stora fartyg kan inte väja i en smal farled, eftersom de skulle gå på grund. Du måste hålla undan för dem.</li><li>Kör inte över farleden precis framför ett stort fartyg. De kan behöva flera hundra meter för att stanna.</li></ul>
<h3>Trafikseparering</h3><p>Där mycket stora fartyg går finns ibland "motorvägar" på sjön, med en fil i varje riktning. Undvik dem med fritidsbåt. Måste du korsa: gör det rakt över, så snabbt som möjligt.</p>
<h3>Dimma och dålig sikt</h3><ul><li>Sakta ner ordentligt.</li><li>Tänd lanternorna och använd mistluren.</li><li>Hör du en mistlur framifrån som du inte ser: sakta ner till lägsta fart och stanna vid behov.</li></ul>
<h3>Svenska specialregler</h3><ul><li><b>Blått blinkande ljus</b> på en båt (polis, kustbevakning, sjöräddning): lämna fri väg.</li><li><b>Dykflagga</b> (vit och blå): dykare i vattnet, håll avstånd och kör sakta.</li><li><b>Linfärja:</b> kör aldrig nära, linan kan ligga strax under ytan.</li></ul>`,
 c:[{q:'Ett stort fartyg kommer i en smal farled. Vad gör du?',o:['Håller undan, till höger i farleden','Kör över farleden framför det','Väntar på att det väjer','Stannar mitt i farleden'],a:0,e:'Stora fartyg kan inte väja där.'},
    {q:'Du hör en mistlur rakt framifrån i dimman. Vad gör du?',o:['Saktar ner till lägsta fart och stannar vid behov','Ökar farten','Svänger kraftigt åt vänster','Fortsätter som vanligt'],a:0,e:'Du vet inte vart den andra båten är på väg.'}]},
 {id:'f-5-4',t:'Båtarnas lampor (lanternor)',sim:'sim-lanternor',b:`
<p>På natten har båtar lampor som heter <b>lanternor</b>. De visar åt vilket håll en båt åker.</p>
<div class="fig">${figSectors()}</div>
<ul><li><b>Röd</b> lanterna på vänster sida (babord), <b>grön</b> på höger sida (styrbord).</li><li><b>Vit</b> lanterna i masten som lyser framåt (motorbåtar).</li><li><b>Vit</b> lanterna i aktern som lyser bakåt.</li></ul>
<div class="figrow">${nightView('power','head')}</div>
<h3>Vad ser du?</h3><ul><li><b>Rött och grönt samtidigt:</b> båten kommer rakt mot dig.</li><li><b>Bara rött:</b> du ser båtens vänstra sida.</li><li><b>Bara grönt:</b> du ser båtens högra sida.</li><li><b>Bara ett vitt ljus lågt:</b> du ser båten bakifrån.</li></ul>
<p>Lanternorna ska vara tända från solnedgång till soluppgång och när sikten är dålig. Små båtar under 7 meter som inte går fortare än 7 knop får ha bara en vit lampa som lyser runt om.</p>
<h3>Signaler på dagen</h3><div class="figrow">${dayShapes(['ball'])}</div><p>En båt som ligger för ankar visar ett svart klot.</p>`,
 c:[{q:'Du ser ett rött och ett grönt ljus bredvid varandra. Vad betyder det?',o:['Båten kommer rakt mot dig','Båten åker ifrån dig','Båten ligger för ankar','Det är en fyr'],a:0,e:'Du ser båda sidorna samtidigt.'},
    {q:'På vilken sida sitter den gröna lanternan?',o:['Höger (styrbord)','Vänster (babord)','I aktern','I masten'],a:0,e:'Grön = styrbord.'}]},
 {id:'f-5-5',t:'Ljudsignaler',b:`
<p>Båtar kan tala om vad de gör med signaler från mistluren eller signalhornet. En kort signal är ungefär 1 sekund, en lång 4–6 sekunder.</p>
<ul><li><b>1 kort:</b> jag svänger åt höger.</li><li><b>2 korta:</b> jag svänger åt vänster.</li><li><b>3 korta:</b> jag backar.</li><li><b>Minst 5 korta:</b> varning, jag förstår inte vad du gör.</li><li><b>1 lång:</b> ges innan en skymd kurva i en smal farled.</li></ul>
<h3>I dimma</h3><ul><li>En motorbåt som kör ger <b>1 lång</b> signal minst varannan minut.</li><li>En motorbåt som ligger stilla ger <b>2 långa</b>.</li></ul>
<p>Båtar under 12 meter behöver inte ha mistlur, men ska kunna ge en tydlig ljudsignal på annat sätt.</p>`,
 c:[{q:'Vad betyder två korta signaler?',o:['Jag svänger åt vänster','Jag svänger åt höger','Jag backar','Varning'],a:0,e:'1 kort höger, 2 korta vänster, 3 korta back.'},
    {q:'Ett stort fartyg ger fem korta signaler mot dig. Vad betyder det?',o:['Varning, det förstår inte vad du gör','Det svänger höger','Det backar','Hej'],a:0,e:'Gör tydligt vad du tänker göra, och håll undan.'}]},
 {id:'f-5-6',t:'Flaggor',b:`
<h3>Nationsflaggan</h3><p>Den svenska flaggan sitter i aktern på en svensk båt. Den hissas tidigast kl 08 (kl 09 under vinterhalvåret) och halas vid solnedgång, senast kl 21.</p>
<h3>Gästflagga</h3><p>När du besöker ett annat land med båten hissar du det landets flagga på <b>styrbords sida</b>, till exempel under styrbords spridare. Den svenska flaggan sitter kvar i aktern.</p>
<h3>Signalflaggor</h3><div class="figrow">${flagA()}${flagNC()}</div>
<ul><li><b>Flagga A</b> (vit och blå med klyka) betyder <b>dykare i vattnet</b>. Håll gott avstånd och kör sakta.</li><li><b>N över C</b> är en <b>nödsignal</b>: båten behöver hjälp.</li></ul>
<details class="extra"><summary>Överkurs: fler signalflaggor</summary><p>Det finns en flagga för varje bokstav i det internationella signalsystemet. Varje flagga har också en egen betydelse när den visas ensam. Flagga O betyder till exempel "man överbord".</p></details>`,
 c:[{q:'En båt visar en vit och blå flagga med klyka. Vad betyder det?',o:['Dykare i vattnet, håll avstånd och kör sakta','Båten fiskar','Båten är till salu','Båten ligger för ankar'],a:0,e:'Flagga A.'},
    {q:'Var sitter den svenska flaggan på en svensk fritidsbåt?',o:['I aktern','I fören','Under styrbords spridare','Under babords spridare'],a:0,e:'Under styrbords spridare sitter gästflaggan när du är i ett annat land.'},
    {q:'Du besöker Finland med båten. Var hissar du den finska flaggan?',o:['På styrbords sida, till exempel under styrbords spridare','I aktern i stället för den svenska','På babords sida','Man använder ingen gästflagga'],a:0,e:'Det kallas gästflagga och visar respekt för landet du besöker.'}]}
]},
{t:'Säkerhet och sjömanskap',sim:'sim-dagpraktik',ls:[
 {id:'f-6-1',t:'Innan du åker: motor och utrustning',b:`
<h3>Kolla motorn</h3><ul><li><b>Bränsle:</b> tillräckligt, med reserv.</li><li><b>Olja:</b> kolla nivån.</li><li><b>Kylvatten:</b> när motorn startat ska kylvatten komma ut. På utombordare syns en liten stråle vatten vid motorn.</li><li><b>Bensinmotor inne i båten:</b> kör fläkten i motorrummet några minuter innan du startar. Bensinånga är tyngre än luft, samlas i botten och kan explodera.</li></ul>
<h3>Bränslesystemet</h3><p>Bränslet går från tanken genom en slang, ett filter (ofta med vattenavskiljare) och en pump till motorn. Vanliga fel:</p><ul><li><b>Igensatt tankluftning:</b> det blir undertryck i tanken, och motorn stannar efter en stund.</li><li><b>Vatten eller smuts i bränslet:</b> syns i filtrets vattenavskiljare. Motorn hackar.</li><li><b>Luft i systemet</b> (diesel): motorn stannar och måste luftas.</li><li><b>Stängd bränslekran eller tom tank.</b></li></ul>
<h3>Ha med</h3><ul><li><b>Flytväst</b> till alla, i rätt storlek. Använd den.</li><li>Ankare med lina, paddel eller åror, öskar.</li><li>Brandsläckare, förbandslåda, ficklampa, kniv. En liten pulversläckare töms på ungefär 10 sekunder, så läs instruktionen innan du behöver den.</li><li>Laddad mobil i vattentätt fodral, gärna VHF-radio.</li><li><b>Dödmansgrepp:</b> en lina från tändningen till föraren. Om föraren ramlar ur stannar motorn.</li></ul>`,
 c:[{q:'Motorn stannar efter en stund men startar igen efter en paus. Vad är en trolig orsak?',o:['Igensatt tankluftning','För kallt kylvatten','Fulladdat batteri','För mycket olja'],a:0,e:'Undertrycket i tanken stoppar bränsleflödet.'},
    {q:'Varför ska du köra fläkten innan du startar en bensinmotor inne i båten?',o:['Bensinånga kan samlas i botten och explodera','För att kyla motorn','För att torka båten','Det behövs inte'],a:0,e:'Bensinånga är tyngre än luft.'},
    {q:'Vad gör dödmansgreppet?',o:['Stänger av motorn om föraren ramlar ur','Larmar polisen','Startar motorn','Mäter farten'],a:0,e:'Så att båten inte kör vidare utan förare.'}]},
 {id:'f-6-2',t:'Man överbord',b:`
<div class="fig">${figMob()}</div>
<ol><li><b>Ropa "man överbord!"</b> så alla vet.</li><li><b>Kasta något som flyter</b>, helst en livboj, nära personen.</li><li><b>En person pekar</b> på den i vattnet hela tiden. Det är lätt att tappa bort ett huvud bland vågorna.</li><li><b>Tryck på MOB-knappen</b> på plottern om du har en. Den sparar positionen.</li><li><b>Sväng åt samma håll som personen ramlade</b>, så att propellern svänger bort från personen.</li><li><b>Kör tillbaka sakta mot vinden</b> och lägg i friläge en bit innan, så att propellern står still när personen är nära.</li><li><b>Hjälp upp</b> personen med badstege eller lina. Ring 112 om ni inte klarar det.</li></ol>`,
 c:[{q:'Vad gör du allra först?',o:['Ropar "man överbord" och kastar något som flyter','Ringer 112','Ankrar','Stänger av radion'],a:0,e:'Sedan pekar någon på personen hela tiden.'},
    {q:'Varför ska propellern stå still nära personen?',o:['Den kan skada personen svårt','Den drar för mycket bränsle','Båten åker baklänges','Det gör inget'],a:0,e:'Lägg i friläge i god tid.'}]},
 {id:'f-6-3',t:'Kallt vatten, brännskador och sjösjuka',b:`
<h3>Kallt vatten: 1–10–1</h3><ul><li><b>1 minut:</b> chocken gör att du flämtar efter luft. Håll huvudet ovanför vattnet och försök lugna andningen.</li><li><b>10 minuter:</b> sedan börjar armar och ben bli stela. Ta dig upp eller håll i något nu.</li><li><b>1 timme:</b> ungefär så lång tid innan man blir medvetslös av kylan.</li></ul>
<h3>Hjälpa någon som är nedkyld</h3><p>Skydda mot vind och väta, byt till torra kläder, linda in i filt. Hantera en svårt nedkyld person varsamt och liggande. Ge aldrig alkohol och gnugga inte huden.</p>
<h3>Brännskador</h3><p>Kyl med ljummet vatten i ungefär 20 minuter. Ta av ringar och klockor. Täck med rent förband.</p>
<h3>Sjösjuka</h3><p>Titta mot horisonten, sitt mitt i båten och få frisk luft. Det hjälper ofta att få styra.</p>`,
 c:[{q:'Vad händer första minuten i kallt vatten?',o:['Man flämtar efter luft (köldchock)','Man blir medvetslös','Man fryser fast','Inget särskilt'],a:0,e:'1–10–1.'},
    {q:'Hur kyler du en brännskada?',o:['Ljummet vatten i ca 20 minuter','Is direkt på huden','Smör','Inte alls'],a:0,e:'Ljummet, inte iskallt.'}]},
 {id:'f-6-4',t:'Larma vid nöd',b:`
<p>Är någon i fara: <b>larma först</b>. Ring <b>112</b> och be om sjöräddningen, eller anropa på <b>VHF kanal 16</b>. Säg vem ni är, var ni är, vad som hänt och hur många ni är.</p>
<p>Larmet hamnar hos <b>JRCC</b>, Sjö- och flygräddningscentralen, som skickar hjälp. Ofta kommer frivilliga från Sjöräddningssällskapet.</p>
<h3>Nödsignaler</h3><ul><li>Rött bloss eller röd raket</li><li>Orange rök</li><li>Vinka långsamt med båda armarna uppåt och nedåt</li><li>MAYDAY på radion</li></ul>
<p>Nödsignaler får bara användas vid verklig fara.</p>
<p>De flesta som dör i båtolyckor i Sverige drunknar, ofta från små båtar och utan flytväst. Använd flytvästen.</p>`,
 c:[{q:'Vilket nummer ringer du vid nöd på sjön?',o:['112','90 000','1177','114 14'],a:0,e:'Be om sjöräddningen.'},
    {q:'Vilken av dessa är en nödsignal?',o:['Rött bloss','Grön lampa','Två korta signaler','Vita flaggor'],a:0,e:'Rött bloss, röd raket eller orange rök.'}]},
 {id:'f-6-5',t:'Köra, förtöja och ankra',b:`
<h3>Styra båten</h3><p>En båt har inga bromsar och svänger med aktern, inte med fören. Rodret fungerar bara när vatten strömmar förbi, så i mycket låg fart är båten svår att styra. Korta gaspådrag hjälper. Öva i lugnt väder på öppet vatten.</p>
<h3>Lägga till vid en brygga</h3><ul><li>Kom in sakta, med fendrar ute och linorna redo.</li><li>Ha en lina i fören (förtamp) och en i aktern (aktertamp).</li><li><b>Springar</b> är linor som går snett och hindrar båten från att glida fram och tillbaka. De kallas <b>förspring</b> och <b>akterspring</b> efter var på båten de sitter.</li><li>Hoppa inte i land. Kliv när båten ligger still. Håll fingrar och fötter borta mellan båt och brygga.</li></ul>
<h3>Ankra</h3><ul><li>Välj en skyddad vik med bra botten (lera eller sand) och utan kablar.</li><li>Släpp ut lina 3–5 gånger djupet.</li><li>Backa sakta så att ankaret gräver ner sig. Kolla mot land att båten inte driver.</li></ul>
<h3>Köra snålt (ecodriving)</h3><p>Kör antingen långsamt eller planande. Mittemellan, strax innan båten börjar plana, drar den mest bränsle och gör störst svallvågor.</p>`,
 c:[{q:'Hur mycket ankarlina ska du släppa ut?',o:['3–5 gånger djupet','Lika mycket som djupet','Halva djupet','Alltid 10 meter'],a:0,e:'Mer lina ger bättre fäste.'},
    {q:'Vad gör springarna?',o:['Hindrar båten från att glida fram och tillbaka','Håller fendrarna','Startar motorn','Mäter djupet'],a:0,e:'De går snett från båten till bryggan.'}]},
 {id:'f-6-6',t:'Stabilitet, brand och knopar',b:`
<h3>Stabilitet</h3><p>En liten båt kan välta om alla står upp eller sitter på samma sida. Sitt ner och fördela vikten. Båtens <b>CE-skylt</b> visar hur många personer och hur mycket last den tål.</p>
<h3>Brand</h3><p>Ha brandsläckare och brandfilt nära där du sitter. Lukta efter bensin och gasol innan du startar eller tänder.</p>
<h3>Knopar du ska kunna</h3><ul><li><b>Pålstek:</b> en fast ögla som inte glider. Bra att lägga runt en påle.</li><li><b>Dubbelt halvslag:</b> snabb knop runt en påle eller stolpe.</li><li><b>Dubbelt halvslag om egen part:</b> varv runt ringen först, sedan två halvslag. Håller bra och går att lossa även när linan är spänd.</li><li><b>Skotstek:</b> knyter ihop två linor, även olika tjocka.</li><li><b>Belägga på knap:</b> ett varv runt knapen, några åttor och ett halvslag.</li></ul>
<p class="key"><b>Tips:</b> Knopar lär man sig med händerna. Ta en bit rep och öva medan du läser.</p>`,
 c:[{q:'Vilken knop gör en fast ögla som inte glider?',o:['Pålstek','Skotstek','Dubbelt halvslag','Knop på knap'],a:0,e:'Pålsteket.'},
    {q:'Var ser du hur många personer båten tål?',o:['På CE-skylten','I sjökortet','På motorn','I sjölagen'],a:0,e:'CE-skylten.'}]}
]},
{t:'Miljö',ls:[
 {id:'f-7-1',t:'Allemansrätt och hänsyn',b:`
<p>Allemansrätten gäller även till sjöss. Du får ankra, gå i land och övernatta i naturen, så länge du inte stör eller förstör.</p><ul><li>Håll avstånd till hus och tomter.</li><li>Stanna högst något dygn på samma plats utan lov.</li><li>Elda bara där det är tillåtet.</li></ul>
<h3>Skyddade områden</h3><p>I fågel- och sälskyddsområden är det ofta förbjudet att gå i land eller åka in under delar av året, oftast under våren och sommaren när djuren får ungar. Områdena syns i sjökortet och har skyltar.</p>
<h3>Svall och buller</h3><p>Svallvågor skadar stränder, bryggor och andra båtar och kan välta kanoter. Sakta ner nära land, i smala sund och nära andra båtar.</p>`,
 c:[{q:'Varför kan det vara förbjudet att gå i land på vissa öar på våren?',o:['Fåglar eller sälar har ungar där','Det är privat mark alltid','Det är för kallt','Det är militärt'],a:0,e:'Fågel- och sälskyddsområden.'}]},
 {id:'f-7-2',t:'Avfall, olja och båtbotten',b:`
<ul><li><b>Toaletten:</b> det är förbjudet att tömma båttoaletten i sjön. Töm i en sugtömningsstation i hamnen.</li><li><b>Skräp:</b> ta med allt hem och sortera.</li><li><b>Bränsle:</b> tanka försiktigt och ha trasor till hands. Läcker olja ut ska det rapporteras.</li><li><b>Bottenfärg:</b> giftig bottenfärg skadar livet i havet och är förbjuden på många ställen, bland annat på ostkusten och i sjöar. Det finns alternativ som borsttvätt och båtlyft.</li></ul>`,
 c:[{q:'Får du tömma båttoaletten i sjön?',o:['Nej','Ja, långt ute','Ja, på natten','Ja, om det är lite'],a:0,e:'Använd sugtömning i hamnen.'}]}
]},
{t:'Väder och vattenstånd',ls:[
 {id:'f-8-1',t:'Läs vädret',b:`
<p>Kolla alltid väderprognosen innan du åker. SMHI har särskilda prognoser för sjön.</p>
<ul><li><b>Vinden</b> anges i meter per sekund (m/s). Över 8–10 m/s blir det ofta obekvämt i en liten båt.</li><li><b>Vindriktningen</b> anges varifrån det blåser. "Sydvästlig vind" kommer från sydväst.</li><li><b>Byar</b> är tillfälligt starkare vindstötar.</li><li><b>Lufttrycket</b> mäts i hektopascal. Sjunker det snabbt kommer ofta blåsigt väder.</li></ul>
<div class="fig">${figSjobris()}</div>
<p><b>Sjöbris:</b> soliga sommardagar värms land upp mer än vattnet. Varm luft stiger över land, och svalare luft drar in från sjön. Därför blåser det ofta mer på eftermiddagen och mojnar på kvällen.</p>
<p><b>Åska och bymoln:</b> höga, mörka moln kan ge plötsliga kraftiga vindbyar. Sök skydd i tid.</p>`,
 c:[{q:'Varifrån kommer en nordlig vind?',o:['Från norr','Mot norr','Från söder','Den snurrar'],a:0,e:'Vind anges varifrån den blåser.'},
    {q:'När blåser sjöbrisen oftast mest?',o:['På eftermiddagen','Tidigt på morgonen','Mitt i natten','Den är jämn hela dygnet'],a:0,e:'Då är land som varmast.'}]},
 {id:'f-8-2',t:'Dimma, vattenstånd och dåligt väder',b:`
<h3>Dimma</h3><p>Dimma kommer ofta på våren och försommaren när varm luft drar in över kallt vatten. Sikten kan försvinna på några minuter.</p>
<h3>Vattenstånd</h3><p>I Östersjön finns nästan inget tidvatten, men vattnet kan stiga och sjunka med väder. <b>Högtryck och vind från land</b> ger <b>lågt vatten</b>, och då är det grundare än sjökortet visar. SMHI har prognoser för vattenstånd.</p>
<h3>Om vädret blir dåligt</h3><ul><li>Sök skydd bakom öar i god tid.</li><li>Sakta ner och ta vågorna snett framifrån.</li><li>Alla har flytväst på och sitter ner.</li></ul>
<h3>Om det blir dimma</h3><ul><li>Sakta ner ordentligt.</li><li>Tänd lanternorna och använd ljudsignal.</li><li>Lyssna. Ankra hellre än att fortsätta om du är osäker.</li></ul>`,
 c:[{q:'Vilket väder ger lågt vatten i Östersjön?',o:['Högtryck och vind från land','Lågtryck och vind mot land','Regn','Dimma'],a:0,e:'Då är det grundare än kortet visar.'}]}
]},
{t:'Lagar',ls:[
 {id:'f-9-1',t:'Ansvar och sjöfylleri',b:`
<p>Den som kör båten kallas <b>befälhavare</b>, även i en liten båt. Befälhavaren ansvarar för:</p><ul><li>att båten är i gott skick och inte överlastad (<b>sjövärdig</b>)</li><li>att köra försiktigt och omdömesgillt (<b>gott sjömanskap</b>)</li><li>att hjälpa den som är i fara på sjön, om det går utan att utsätta sig själv för allvarlig fara</li><li>att stanna, hjälpa och lämna sitt namn efter en kollision</li></ul>
<h3>Alkohol</h3><p>Kör du en båt som är minst 10 meter lång eller kan gå minst 15 knop får du inte ha <b>0,2 promille</b> eller mer i blodet, samma som i bil. Från 1,0 promille räknas det som grovt sjöfylleri. Även i mindre båtar är det förbjudet att köra om du är så påverkad att du inte kan köra säkert.</p>`,
 c:[{q:'Vem är befälhavare i en liten motorbåt?',o:['Den som kör','Ägaren alltid','Den äldsta','Ingen'],a:0,e:'Ansvaret följer den som kör.'},
    {q:'Vad är promillegränsen för en båt som kan gå 30 knop?',o:['0,2 promille','0,5 promille','1,0 promille','Ingen gräns'],a:0,e:'Samma som för bil.'}]},
 {id:'f-9-2',t:'Fler regler att känna till',b:`
<ul><li><b>Var inte trött eller påverkad:</b> den som kör får inte vara så trött, sjuk eller påverkad av mediciner eller droger att säkerheten påverkas.</li><li><b>Förtöj inte vid sjömärken.</b> Det är förbjudet. Skadar du ett sjömärke ska du rapportera det.</li><li><b>Fler än 12 passagerare</b> gör båten till ett passagerarfartyg med helt andra krav.</li><li>Båten ska ha tillräckligt med folk ombord för turen, och den som kör ska se och höra tillräckligt bra.</li><li>Du ska känna till din egen båt, dess utrustning och hur den beter sig.</li></ul>`,
 c:[{q:'Får du förtöja vid en prick?',o:['Nej, det är förbjudet','Ja, en kort stund','Ja, om du sitter kvar i båten','Ja, på natten'],a:0,e:'Det kan skada märket och skymma det för andra.'}]}
]}
];

}
