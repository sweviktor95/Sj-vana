LESSONS.kust=[
{t:'Sjövägsreglerna på djupet',sim:'sim-vajning',ls:[
 {id:'k-1-1',t:'Definitioner och tillämpning (regel 1–3)',sim:'sim-ritvajning',b:`
<p>Kustskepparintyget kräver kunskap om <b>alla</b> regler i del A, B och D. Börja med definitionerna i regel 3, eftersom väjningsreglerna bygger på dem.</p>
<ul><li><b>Fartyg som fiskar:</b> fiskar med redskap som begränsar manöverförmågan (nät, trål, långrev). Inte den som trollingfiskar med spö.</li>
<li><b>Ej manöverfört:</b> kan på grund av exceptionella omständigheter inte manövrera enligt reglerna, t.ex. maskinhaveri eller roderfel.</li>
<li><b>Begränsad manöverförmåga:</b> arbetet i sig begränsar fartyget, t.ex. muddring, kabelarbete, bunkring till sjöss eller en svår bogsering.</li>
<li><b>Begränsat av sitt djupgående:</b> maskindrivet fartyg som på grund av djupgåendet i förhållande till djupet inte kan gira ur kursen.</li>
<li><b>Under gång:</b> inte till ankars, förtöjt eller grundstött.</li><li><b>I sikte av varandra:</b> det ena syns visuellt från det andra. Radarkontakt räknas inte.</li><li><b>Nedsatt sikt:</b> sikten är begränsad av t.ex. dimma, snöfall eller kraftigt regn.</li></ul>
<p><b>Regel 1</b> säger att reglerna gäller på öppna havet och alla förbindande vatten. Länder får ha särskilda regler för hamnar, floder och inre vatten, vilket Sverige har i Transportstyrelsens tilläggsregler.</p>
<p><b>Regel 2</b> säger att reglerna aldrig befriar från ansvar för bristande sjömanskap, och att man ibland måste avvika från dem för att undvika omedelbar fara.</p>`,
 c:[{q:'En båt trollingfiskar med spön. Räknas den som "fartyg som fiskar"?',o:['Nej, trollingspön begränsar inte manöverförmågan','Ja, all fiskebåt räknas','Ja, om den har fler än två spön','Bara i mörker'],a:0,e:'Det är redskap som begränsar manöverförmågan som avgör.'},
    {q:'Ett fartyg muddrar en farled. Vad räknas det som?',o:['Fartyg med begränsad manöverförmåga','Ej manöverfört','Begränsat av djupgående','Fartyg som fiskar'],a:0,e:'Arbetet begränsar manöverförmågan.'},
    {q:'Är två fartyg som bara ser varandra på radar "i sikte av varandra"?',o:['Nej','Ja','Bara om avståndet är under 1 M','Bara dagtid'],a:0,e:'Då gäller regel 19 för nedsatt sikt i stället för regel 11–18.'}]},
 {id:'k-1-2',t:'Ljus och signalfigurer: maskindrivna, segel och ankrade',sim:'sim-lanternor',b:`
<p>Regel 23, 25 och 30 ska du kunna i detalj.</p>
<h3>Regel 23: maskindrivna under gång</h3><ul><li>Topplanterna förut. Fartyg över 50 m har en andra, högre topplanterna längre akterut.</li><li>Sidolanternor och akterlanterna.</li><li>Under 12 m: vitt runtomlysande + sidolanternor får ersätta topp och akter.</li><li>Svävare (luftkuddefarkost): dessutom gult blinkande runtomlysande ljus.</li></ul>
<div class="figrow">${nightView('power50','stbd')}</div><p>Fartyg över 50 m: den aktre topplanternan sitter högre. Här är fören till höger.</p>
<h3>Regel 25: segelfartyg och roddbåtar</h3><ul><li>Sidolanternor och akterlanterna. Under 20 m får de sitta i en trefärgslanterna i masttoppen.</li><li>Får dessutom visa rött över grönt runtomlysande i masttoppen (inte tillsammans med trefärgslanternan).</li><li>Segelfartyg som samtidigt kör motor: dagtid en kon med spetsen nedåt.</li></ul>
<h3>Regel 30: till ankars och grundstött</h3><ul><li>Till ankars: ett vitt runtomlysande ljus förut (över 50 m två, det förliga högre). Dagtid ett svart klot.</li><li>Grundstött: ankarljusen plus <b>två röda runtomlysande lodrätt</b>. Dagtid <b>tre klot</b> lodrätt.</li><li>Fartyg under 7 m till ankars utanför farled och ankringsplatser behöver inte visa ljus.</li></ul>
<div class="figrow">${dayShapes(['ball','ball','ball'])}</div><p>Tre klot = grundstött fartyg.</p>`,
 c:[{q:'Du ser två vita topplanternor där den vänstra sitter lägre, och en röd sidolanterna. Åt vilket håll går fartyget?',o:['Åt vänster','Åt höger','Rakt mot dig','Det ligger stilla'],a:0,e:'Den förliga topplanternan sitter lägre, så fören är till vänster. Det röda ljuset (babordssidan) bekräftar det: går fartyget åt vänster ser du dess babordssida.'},
    {q:'Vad visar ett grundstött fartyg dagtid?',o:['Tre svarta klot lodrätt','Ett svart klot','Två svarta klot','En cylinder'],a:0,e:'Natt: ankarljus plus två röda runtomlysande.'},
    {q:'Vad får ett segelfartyg visa i masttoppen utöver sidolanternor och akterlanterna?',o:['Rött över grönt runtomlysande','Grönt över vitt','Vitt över rött','Två röda'],a:0,e:'Minnesregel: "rött över grönt, segling skönt".'}]},
 {id:'k-1-3',t:'Övriga ljus: bogsering, fiske, ej manöverfört, djupgående och lots',sim:'sim-lanternor',b:`
<p>Dessa ska du känna igen (kännedom). Lär dig mönstren, inte varje detalj.</p>
<ul><li><b>Bogsering (24):</b> två topplanternor lodrätt, tre om släpet är längre än 200 m. Gul bogseringslanterna över akterlanternan. Dagtid bikon om släpet är över 200 m.</li>
<li><b>Trålare (26):</b> grönt över vitt runtomlysande. Dagtid två koner med spetsarna mot varandra.</li><li><b>Annat fiske (26):</b> rött över vitt. Samma signalfigur.</li>
<li><b>Ej manöverfört (27):</b> två röda runtomlysande. Dagtid två klot.</li><li><b>Begränsad manöverförmåga (27):</b> röd-vit-röd. Dagtid klot-bikon-klot.</li>
<li><b>Begränsat av djupgående (28):</b> tre röda runtomlysande. Dagtid cylinder.</li><li><b>Lots i tjänst (29):</b> vitt över rött.</li></ul>
<div class="figrow">${nightView('trawl','head')}${nightView('ram','port')}</div>
<p>Till vänster en trålare som kommer emot dig, till höger ett fartyg med begränsad manöverförmåga som visar babordssidan.</p>
<p class="key"><b>Minnesregler:</b> "Grönt över vitt, trålar med mitt." "Rött över vitt, fiskar med nät." "Vit mössa, röd näsa, lotsen är på väg." "Röd-vit-röd, se upp, arbete."</p>`,
 c:[{q:'Tre röda runtomlysande ljus lodrätt. Vad är det?',o:['Fartyg begränsat av sitt djupgående','Ej manöverfört','Grundstött','Bogserare'],a:0,e:'Regel 28. Dagtid en cylinder.'},
    {q:'Vad betyder rött över vitt runtomlysande?',o:['Fiskefartyg som inte trålar','Trålare','Lots','Ankrat fartyg'],a:0,e:'Trålare är grönt över vitt.'}]},
 {id:'k-1-4',t:'Ljud- och ljussignaler i sin helhet',b:`
<p>Del D ska du kunna i detalj. Utöver det du lärde dig i förarintyget:</p>
<ul><li><b>Ljussignaler (34):</b> manöversignalerna kan kompletteras med ett vitt blinkande ljus: 1 blixt = styrbord, 2 = babord, 3 = back.</li>
<li><b>Nedsatt sikt (35):</b><ul><li>Maskindrivet med fart: 1 lång högst varannan minut.</li><li>Maskindrivet stilla: 2 långa.</li><li>Segel, fiskande, ej manöverfört, begränsad manöverförmåga, djupgående, bogserare: 1 lång + 2 korta.</li><li>Sista släpet i en bogsering (bemannat): 1 lång + 3 korta.</li><li>Till ankars: snabb klockringning ca 5 s varje minut. Får lägga till 1 kort, 1 lång, 1 kort för att varna närmande fartyg.</li><li>Grundstött: 3 tydliga klockslag, klockringning, 3 klockslag.</li><li>Lotsbåt får lägga till 4 korta.</li></ul></li>
<li><b>Väcka uppmärksamhet (36):</b> ljus eller ljud som inte kan förväxlas med signalerna i reglerna.</li>
<li><b>Nödsignaler (37 och bilaga 4):</b> ska du kunna (se modulen om säkerhet).</li></ul>`,
 c:[{q:'I dimma hör du en lång och två korta signaler. Vad kan det vara?',o:['Ett segelfartyg, fiskefartyg eller bogserare','Ett maskindrivet fartyg med fart','Ett ankrat fartyg','En lotsbåt'],a:0,e:'1 lång + 2 korta används av fartyg som har svårt att väja.'},
    {q:'Vilken signal ger ett ankrat fartyg i dimma?',o:['Snabb klockringning cirka 5 sekunder varje minut','En lång signal varannan minut','Två långa signaler','Tre korta signaler'],a:0,e:'Det får dessutom ge kort-lång-kort som varning.'}]},
 {id:'k-1-5',t:'Svenska tilläggsregler, prejning och militära områden',b:`
<p>Transportstyrelsens tilläggsregler (bilaga 2 till TSFS 2009:44) ska du kunna. Viktigast:</p>
<ul><li>På vissa inre vatten (t.ex. Göta älv, kanaler) gäller särskilda regler.</li><li>Fartyg i brådskande tjänsteutövning visar blått blinkande ljus.</li><li>Dykflagga och dykarbåtar ska passeras i låg fart och på avstånd.</li><li>Fartyg till ankars i farled: särskilda ljus och signalfigurer.</li><li>Linfärjor: håll undan, kör aldrig mellan land och en linfärja under gång.</li><li>I trånga farvatten ska mötande fartyg hålla till styrbord, och ett fartyg som går med strömmen kan ha företräde.</li></ul>
<h3>Prejning och visitering</h3><p>Kustbevakningen, polisen, Tullverket och Försvarsmakten kan preja (stoppa) fartyg. Följ deras order. Signalen <b>L</b> (med flagga, ljus eller ljud: kort-lång-kort-kort) betyder "stoppa ert fartyg omedelbart".</p>
<h3>Militära områden</h3><p>Vissa skyddsområden har tillträdesförbud eller begränsningar, och vid skjutövningar kan områden spärras. Information finns i Ufs, på Försvarsmaktens webbplats och via radio. Fotografering och dykning kan vara förbjudna i skyddsobjekt.</p>`,
 c:[{q:'Vad betyder signalen L (kort-lång-kort-kort) från ett myndighetsfartyg?',o:['Stoppa ert fartyg omedelbart','Följ efter mig','Jag girar åt babord','Fri passage'],a:0,e:'Följ alltid prejningsorder.'},
    {q:'Får du köra mellan land och en linfärja?',o:['Nej, linan kan ligga strax under ytan','Ja, om du kör sakta','Ja, dagtid','Bara med segelbåt'],a:0,e:'Håll undan och vänta tills färjan passerat.'}]}
]},
{t:'Sjörätt',ls:[
 {id:'k-2-1',t:'Lagarna du ska känna till',b:`
<ul><li><b>Sjölagen:</b> befälhavarens ansvar för sjövärdighet och framförande, skyldighet att bistå vid sjönöd, skyldigheter vid kollision, gott sjömanskap, sjöfylleri och straff.</li>
<li><b>Förordningen om befälhavares skyldigheter vid faror och sjönöd:</b> befälhavaren ska varna och rapportera faror för sjöfarten, t.ex. drivande föremål, släckta fyrar eller farligt väder, och hjälpa vid sjönöd.</li>
<li><b>Fartygssäkerhetslagen:</b> sjövärdighet, bemanning, passagerarfartyg (fler än 12 passagerare), syn och hörsel.</li><li><b>Sjötrafikförordningen:</b> gott sjömanskap, tjänstbarhet, förbud att förtöja vid sjömärken.</li>
<li><b>Sjömanslagen:</b> gäller anställda ombord, även på fritidsfartyg. Har du anställd besättning gäller arbetsrättsliga regler.</li></ul>
<h3>Utrikes resa</h3><p>Inom EU och Schengen behövs normalt ingen tullanmälan, men ta med pass eller id-kort. Från land utanför EU (t.ex. Norge med vissa varor) gäller tullregler och införselgränser. Ha båtens papper ombord: registrerings- eller ägarbevis, försäkringsbevis och dina behörighetsbevis. Kontrollera även karantänsregler för djur.</p>`,
 c:[{q:'Du ser en släckt fyr. Vad säger förordningen om befälhavares skyldigheter?',o:['Du ska rapportera faran','Ingenting, det gäller bara yrkessjöfart','Du ska tända den själv','Du ska ankra vid den'],a:0,e:'Varna andra sjöfarande och rapportera, t.ex. till JRCC eller via VHF.'},
    {q:'Gäller sjömanslagen på fritidsfartyg?',o:['Ja, för anställda ombord','Nej, aldrig','Bara för båtar över 24 m','Bara utomlands'],a:0,e:'Den gäller anställningsförhållandet, inte fartygstypen.'}]}
]},
{t:'Sjökort och fyrar',sim:'sim-fyr',ls:[
 {id:'k-3-1',t:'Sjökortets projektioner och korttyper',b:`
<p>Jorden är rund och kortet platt, så alla kort är kompromisser.</p><ul><li><b>Mercatorprojektion:</b> latituderna dras isär ju längre norrut, så att vinklar blir rätt. En rät linje på kortet är en kurs med konstant kompassriktning (loxodrom). Därför måste distans mätas på latitudskalan i höjd med där du mäter.</li>
<li><b>Gauss-projektion (transversal Mercator):</b> används i flera svenska båtsportkort och skärgårdskort. Bra noggrannhet inom ett smalt område.</li></ul>
<h3>Svenska korttyper</h3><ul><li><b>Översiktskort:</b> liten skala, för planering av långa sträckor.</li><li><b>Kustkort:</b> för kustnavigering utanför skärgården.</li><li><b>Skärgårdskort och båtsportkort:</b> stor skala, för navigering i skärgård.</li><li><b>Hamnkort och specialer:</b> mycket stor skala.</li></ul>
<p>Använd alltid kortet med störst skala där du navigerar. Kontrollera geodetiskt datum (i dag WGS 84 i svenska kort) så att GNSS-positionen stämmer med kortet.</p>
<h3>Publikationer</h3><p>Ufs (Underrättelser för sjöfarande) ges ut av Sjöfartsverket och finns på webben. Där finns rättelser, nya grund, ändrade fyrar och tillfälliga varningar. Seglingsbeskrivningar och hamnbeskrivningar kompletterar kortet.</p>`,
 c:[{q:'Varför måste du mäta distans på latitudskalan i höjd med området i ett mercatorkort?',o:['Skalan ändras med latituden','Longitudskalan är fel tryckt','Det är lättare att läsa','Det spelar ingen roll'],a:0,e:'I mercatorkortet blir latitudminuterna längre norrut.'},
    {q:'Var hittar du rättelser till sjökort och tillfälliga varningar?',o:['I Ufs','I Kort 1','I sjölagen','På kompassrosen'],a:0,e:'Underrättelser för sjöfarande.'}]},
 {id:'k-3-2',t:'Fyrkaraktärer',sim:'sim-fyr',b:`
<div class="fig">${figChars()}</div>
<ul><li><b>F</b> fast sken.</li><li><b>Fl</b> blixt: ljuset är kortare än mörkret.</li><li><b>LFl</b> lång blixt: minst 2 s.</li><li><b>Fl(3)</b> grupp om tre blixtar.</li><li><b>Oc</b> ockulterande: ljuset är längre än mörkret.</li><li><b>Iso</b> isofas: lika långt ljus som mörker.</li><li><b>Q</b> snabbt blixtrande (50–79 per minut), <b>VQ</b> mycket snabbt (80–159 per minut).</li><li><b>Mo(A)</b> morsebokstav.</li><li><b>Al</b> alternerande: växlar färg, t.ex. <code>Al WR</code>.</li></ul>
<p>Färgen anges med W (vit), R (röd), G (grön), Y (gul). Ingen färg angiven betyder vitt. Perioden är tiden för en hel cykel, från början av en grupp till början av nästa.</p>
<p class="key"><b>Kom ihåg:</b> När du identifierar en fyr, räkna blixtarna och ta tid på perioden minst två gånger. Jämför med sjökortet.</p>`,
 c:[{q:'Ljuset är tänt 3 s och släckt 1 s. Vilken karaktär är det?',o:['Oc','Fl','Iso','LFl'],a:0,e:'Mer ljus än mörker = ockulterande.'},
    {q:'Vad betyder <code>Al WR</code>?',o:['Ljuset växlar mellan vitt och rött','Vitt och rött i olika sektorer','Vit blixt följd av mörker','Rött fast ljus'],a:0,e:'Alternerande ljus byter färg i samma riktning.'},
    {q:'Vad är perioden för <code>Fl(2) 6s</code>?',o:['6 sekunder för hela cykeln med två blixtar','2 sekunder mellan blixtarna','6 sekunder mörker efter varje blixt','12 sekunder'],a:0,e:'Perioden räknas från början av en grupp till början av nästa.'}]},
 {id:'k-3-3',t:'Sektorfyrar, ledfyrar och ensfyrar',sim:'sim-nattpraktik',b:`
<div class="fig">${sectorFig()}</div>
<p>En <b>sektorfyr</b> visar olika färger i olika riktningar. Den vita sektorn leder normalt genom farleden, och röd och grön sektor varnar för grundare vatten på sidorna. I sjökortet står t.ex. <code>Oc WRG 6s 12m 9-6M</code>.</p>
<p>Sektorgränserna i fyrlistor anges som <b>bäringar från sjön mot fyren</b>, alltså hur du ser fyren. I sjökortet är sektorerna ritade med tunna linjer och bokstäver.</p>
<p>I gränsen mellan två sektorer finns en smal zon där färgen är osäker och kan växla. Lita inte på gränsen. Håll dig väl inne i den vita sektorn.</p>
<h3>Ledfyr och ensfyrar</h3><ul><li><b>Ledfyr:</b> visar en smal ledsektor genom en passage.</li><li><b>Ensfyrar:</b> två fyrar där den bakre står högre. När de står rakt över varandra ligger du i enslinjen. Hamnar det övre ljuset till höger om det nedre ska du styra åt höger, och tvärtom.</li></ul>`,
 c:[{q:'Hur anges sektorgränser i fyrlistor?',o:['Som bäringar från sjön mot fyren','Som bäringar från fyren ut mot sjön','I sjömil','Som klockslag'],a:0,e:'De beskriver hur du ser fyren från båten.'},
    {q:'Det bakre (övre) ensljuset syns till vänster om det främre. Åt vilket håll ska du styra för att komma in i enslinjen?',o:['Åt vänster','Åt höger','Rakt fram','Backa'],a:0,e:'Styr mot det övre ljuset tills de står i linje.'}]},
 {id:'k-3-4',t:'Lysvidd och avstånd till fyren',b:`
<ul><li><b>Nominell lysvidd</b> är hur långt ljuset syns vid normal sikt (ca 10 M). Det är den siffran som står i sjökortet, t.ex. 9M.</li><li><b>Geografisk lysvidd</b> begränsas av jordens krökning: hur högt ljuset sitter och hur högt ditt öga är.</li></ul>
<p>Avståndet då fyren precis syns över horisonten (<b>kimmar</b>) är ungefär:</p>
<p class="key"><b>d ≈ 2,08 × (√H + √h)</b> nautiska mil, där H är fyrens höjd och h din ögonhöjd i meter.</p>
<h3>Exempel</h3><p>Fyrhöjd 25 m, ögonhöjd 4 m: 2,08 × (5 + 2) ≈ 14,6 M. Ser du fyren kimma vet du att du är ungefär 14,6 M från den, och tillsammans med en bäring får du en position.</p>
<p>Är nominella lysvidden mindre än den geografiska syns fyren inte vid kimningen: den är för svag. Då gäller den kortare sträckan.</p>`,
 c:[{q:'Fyrhöjd 49 m, ögonhöjd 1 m. Ungefär när kimmar fyren?',o:['Cirka 16,6 M','Cirka 8 M','Cirka 50 M','Cirka 14,6 M'],a:0,e:'2,08 × (7 + 1) = 16,64.'},
    {q:'Vilken lysvidd står i sjökortet?',o:['Nominell lysvidd','Geografisk lysvidd','Avståndet till närmaste hamn','Fyrens höjd'],a:0,e:'Den nominella gäller vid normal sikt.'}]}
]},
{t:'Sjökortsarbete',ls:[
 {id:'k-4-1',t:'Deviationstabell och deviation från enslinje',b:`
<p>Deviationen ändras med kursen. I deviationstabellen står den för t.ex. var 15:e eller 30:e grad. Ligger kursen mellan två värden får du interpolera.</p>
<h3>Exempel på interpolering</h3><p>Tabellen visar 2° O på 090° och 4° O på 120°. På 105° (mitt emellan) är deviationen ungefär 3° O.</p>
<h3>Bestäm deviationen med en enslinje</h3><ol><li>Läs av enslinjens rättvisande riktning i sjökortet (RB).</li><li>Styr eller pejla i enslinjen och läs av kompassen (KB).</li><li>Dra av missvisningen: MB = RB − miss (ost).</li><li>Deviationen = MB − KB.</li></ol>
<p>Enslinjen 160°, missvisning 6° O ger MB 154°. Kompassen visar 157°. Deviationen = 154 − 157 = −3, alltså 3° väst.</p>`,
 c:[{q:'Tabellen: 3° V på 180° och 1° V på 210°. Ungefärlig deviation på 195°?',o:['2° V','3° V','1° V','2° O'],a:0,e:'Mitt emellan 3 och 1.'},
    {q:'Enslinje 080° rättvisande, missvisning 5° O, kompassen visar 073°. Vad är deviationen?',o:['2° O','2° V','7° O','5° V'],a:0,e:'MB = 080 − 5 = 075. Dev = 075 − 073 = +2 = 2° ost.'}]},
 {id:'k-4-2',t:'Avdrift och ström',b:`
<p><b>Avdrift</b> beror på vinden och sätter båten åt läsidan. Vinden från babord ger avdrift åt styrbord. Kursen genom vattnet = stävad kurs + avdrift (styrbord plus, babord minus).</p>
<p>Vill du gå 090° genom vattnet och har 5° avdrift åt styrbord, stävar du 085°.</p>
<div class="fig">${figStrom()}</div>
<h3>Strömtriangel: vilken kurs ska jag styra?</h3><ol><li>Rita önskad kurs över grund från A mot målet.</li><li>Rita strömmens riktning och fart för en timme från A.</li><li>Från strömmens slutpunkt: slå en cirkel med radien = din fart genom vattnet på en timme. Där den skär kurslinjen över grund har du skärningspunkten.</li><li>Linjen från strömmens slutpunkt till skärningspunkten ger den kurs du ska styra.</li><li>Avståndet från A till skärningspunkten ger farten över grund.</li></ol>
<p class="key"><b>Kom ihåg:</b> Ström anges ofta med riktningen den sätter <b>mot</b>, till skillnad från vind som anges varifrån den kommer.</p>`,
 c:[{q:'Vinden kommer från styrbord och ger 4° avdrift. Du vill gå 200° genom vattnet. Vad stävar du?',o:['204°','196°','200°','208°'],a:0,e:'Avdriften sätter mot babord (−4). Stäva upp mot vinden: 200 + 4 = 204.'},
    {q:'Strömmen anges som "sätter 090°". Vart flyttar den båten?',o:['Österut','Västerut','Norrut','Söderut'],a:0,e:'Ström anges med den riktning den sätter mot.'}]},
 {id:'k-4-3',t:'Positionsbestämning med ortlinjer',sim:'sim-sjokort',b:`
<p>En <b>ortlinje</b> är en linje som du vet att du befinner dig på: en bäring, en enslinje, ett avstånd (cirkel) eller en djupkurva. Två ortlinjer som korsar varandra ger en position.</p>
<h3>Två pejlingar och utseglad distans</h3><p>Har du bara ett föremål: pejla det, gå en känd distans, pejla igen. Flytta den första bäringslinjen parallellt med kurs och distans du gått. Där den flyttade linjen skär den nya bäringen är du.</p>
<div class="fig">${fig4590()}</div>
<h3>45°–90°-pejling</h3><p>Notera loggen när föremålet är 45° om bogen, och igen när det är tvärs (90°). Den utseglade distansen är lika med avståndet till föremålet vid tvärs. Det fungerar eftersom triangeln är likbent.</p>
<h3>Andra sätt</h3><ul><li>Bäring och kimningsavstånd till en fyr.</li><li>Bäring och djupkurva (lita försiktigt på djupet).</li><li>Radaravstånd till två punkter (radarintyget).</li></ul>`,
 c:[{q:'Föremålet är 45° om bogen kl 10.00 och tvärs kl 10.20. Du går 9 knop. Hur långt från föremålet är du vid tvärs?',o:['3 M','9 M','1,5 M','4,5 M'],a:0,e:'20 minuter i 9 knop = 3 M = avståndet vid tvärs.'},
    {q:'Vad är en ortlinje?',o:['En linje du vet att du befinner dig på','En farledslinje','Kurslinjen i plottern','En djupkurva alltid'],a:0,e:'Två ortlinjer ger en position.'}]},
 {id:'k-4-4',t:'Planering med tid och distans',sim:'sim-sjokort',b:`
<p>Kustskepparprovet har uppgifter i flera steg. Arbeta systematiskt:</p><ol><li>Skriv ner vad du vet: kurs, fart, tid, ström, avdrift, missvisning och deviation.</li><li>Rita i sjökortet först, räkna sedan.</li><li>Kontrollera varje steg baklänges.</li></ol>
<h3>Exempel: när är vi framme?</h3><p>Du lämnar hamnen kl 14.20 och har 17,5 M kvar i 7 knop. Tid = 17,5 ÷ 7 = 2,5 h. Beräknad ankomst (ETA) = 16.50.</p>
<h3>Exempel: vilken fart behövs?</h3><p>En bro öppnar 18.00 och du är 11 M därifrån kl 16.30. Fart = 11 ÷ 1,5 = 7,3 knop. Lägg till marginal.</p>`,
 c:[{q:'Avgång 09.40, distans 13 M, fart 6 knop. När är du framme?',o:['11.50','11.10','12.00','11.40'],a:0,e:'13 ÷ 6 = 2,17 h ≈ 2 h 10 min.'}]}
]},
{t:'Mörker och nedsatt sikt',sim:'sim-nattpraktik',ls:[
 {id:'k-5-1',t:'Styrmärke, tvärsmärke, girmärke och girpunkt',b:`
<ul><li><b>Styrmärke:</b> något rakt förut som du styr mot. I mörker ofta en fyr eller ett blinkande märke.</li><li><b>Tvärsmärke:</b> något som hamnar tvärs när du är på en viss plats. Bekräftar var du är längs sträckan.</li><li><b>Girmärke:</b> något som visar när det är dags att gira, t.ex. när en fyr hamnar i en viss bäring, när ett märke kommer tvärs eller när en sektor byter färg.</li><li><b>Girpunkt:</b> platsen där du ska gira. Planera girpunkten i sjökortet och bestäm vilket girmärke som visar den.</li></ul>
<h3>Planera en mörkerpassage</h3><ol><li>Rita rutten och markera girpunkterna.</li><li>Skriv upp varje sträckas kurs, distans och tid.</li><li>Skriv upp alla fyrar och märken längs vägen med karaktär och färg, i den ordning de dyker upp.</li><li>Bestäm styrmärke och girmärke för varje sträcka.</li><li>Ha plan B: vad gör du om du inte hittar ett märke?</li></ol>`,
 c:[{q:'Vad är ett girmärke?',o:['Något som visar när det är dags att gira','Något du styr rakt mot','Ett märke som markerar grund','Ett märke för fartbegränsning'],a:0,e:'T.ex. när en fyr hamnar i en viss bäring eller en sektor byter färg.'},
    {q:'Vad bör du skriva upp när du planerar en mörkerpassage?',o:['Fyrar och märken med karaktär i den ordning de dyker upp','Bara slutmålet','Bara bränsleförbrukningen','Ingenting, plottern räcker'],a:0,e:'En lista gör det lättare att identifiera ljusen i rätt ordning.'}]},
 {id:'k-5-2',t:'Att navigera i mörker',sim:'sim-nattpraktik',b:`
<ul><li><b>Mörkerseende:</b> det tar 20–30 minuter för ögat att anpassa sig. Ha rött, dämpat ljus ombord och nattläge på plottern.</li><li><b>Avstånd är svåra att bedöma:</b> ett starkt ljus långt bort kan se ut som ett svagt ljus nära. Använd sjökortet och karaktären, inte intrycket.</li><li><b>Bakgrundsljus</b> från bebyggelse och vägar kan dölja sjömärken. Fasta, gula ljus är oftast inte sjömärken.</li><li><b>Okända föremål</b> utan ljus (stenar, bojar, flytande timmer) syns inte. Anpassa farten.</li><li><b>Utkik:</b> en person bör bara titta ut, utan att blända sig med skärmar.</li></ul>
<h3>Hög fart i mörker och nedsatt sikt</h3><p>Reaktionstiden räcker inte. I 20 knop går du 10 meter i sekunden. Ett märke som syns på 100 m har du passerat på 10 sekunder. Sänk farten.</p>`,
 c:[{q:'Varför är fasta gula ljus på en ö oftast inte sjömärken?',o:['Sjömärkens ljus har en karaktär och är oftast röda, gröna eller vita','Gula ljus är förbjudna till sjöss','Sjömärken lyser aldrig fast','Sjömärken lyser bara blått'],a:0,e:'Fasta, varmgula ljus är ofta från hus.'},
    {q:'Hur långt går du på 10 sekunder i 20 knop?',o:['Cirka 100 m','Cirka 10 m','Cirka 500 m','Cirka 1 M'],a:0,e:'20 knop ≈ 10 m/s.'}]},
 {id:'k-5-3',t:'Nedsatt sikt',b:`
<ol><li>Sänk farten till säker fart. Motor redo.</li><li>Tänd lanternorna och börja ge ljudsignaler.</li><li>Sätt en utkik i fören som också lyssnar.</li><li>Fastställ position och lägg ut den i sjökortet.</li><li>Använd radar och AIS om du har det. Sätt upp en radarreflektor så att andra ser dig.</li><li>Undvik farleder med stora fartyg. Gå hellre nära stranden, utanför farleden, där det är djupt nog.</li><li>Ankra om det behövs.</li></ol>
<p>Kom ihåg regel 19: hör du en signal förut om tvärs ska du minska till lägsta styrfart. Upptäcker du ett fartyg förut om tvärs på radarn: undvik gir åt babord.</p>`,
 c:[{q:'Var är det oftast säkrast att vara i dimma med en liten båt?',o:['Utanför de stora farlederna där det är tillräckligt djupt','Mitt i huvudfarleden','I trafiksepareringen','Nära stora fartyg'],a:0,e:'Stora fartyg kan inte väja i trånga leder.'}]}
]},
{t:'Elektronik och radio',ls:[
 {id:'k-6-1',t:'Navigationsutrustning',b:`
<ul><li><b>GNSS:</b> felkällor är bl.a. få synliga satelliter, signalstörningar (jamming), fel geodetiskt datum och att sjökortet i sig är fel. Använd flera källor.</li><li><b>Radar:</b> ser i mörker och dimma. Visar land, båtar och märken med radarreflektor. Små plastbåtar och låga föremål syns dåligt. <b>Radaroverlay</b> lägger radarbilden över sjökortet.</li><li><b>Radarreflektor:</b> gör din båt synlig på andras radar. Högt upp och rätt monterad.</li><li><b>AIS:</b> visar fartyg som sänder AIS, med namn, kurs och fart. Alla fartyg har inte AIS.</li><li><b>Sammankoppling:</b> instrument kopplas ihop via t.ex. NMEA 2000. Ett fel i en givare kan då sprida fel data till flera skärmar.</li><li><b>Optiska pejlinstrument:</b> handpejlkompass eller pejlskiva.</li></ul>
<p>Befälhavaren ansvarar för att utrustningen fungerar och att den som använder den kan hantera den.</p>`,
 c:[{q:'Vad gör radaroverlay?',o:['Lägger radarbilden över sjökortet i plottern','Visar AIS-mål','Förstärker radarekot','Ersätter radarreflektorn'],a:0,e:'Det gör det lättare att skilja land från båtar.'}]},
 {id:'k-6-2',t:'Radio och nödkommunikation',b:`
<ul><li><b>VHF:</b> kanal 16 för nöd, il, säkerhet och anrop. Kanal 70 för DSC. VTS-områden har egna kanaler som står i Ufs och i sjökortet.</li><li><b>Mobiltelefon:</b> 112 fungerar för sjöräddning men täckningen är osäker till sjöss, och andra båtar i närheten hör inte samtalet.</li><li><b>VHF-DSC:</b> ett nödlarm skickar MMSI och position automatiskt till alla stationer i närheten.</li><li><b>EPIRB:</b> nödsändare via satellit. <b>SART:</b> syns på radar eller AIS nära räddningsenheter. <b>NAVTEX:</b> tar emot navigations- och vädervarningar. <b>Inmarsat:</b> satellitkommunikation. <b>GMDSS:</b> det globala systemet för nöd och säkerhet.</li></ul>
<p>För att använda VHF krävs SRC-certifikat.</p>`,
 c:[{q:'Varför är VHF bättre än mobiltelefon vid nöd till sjöss?',o:['Alla i närheten hör anropet och kan hjälpa','Mobilen fungerar aldrig till sjöss','VHF är gratis','Mobilen kan inte ringa 112'],a:0,e:'Närmaste båt kan vara snabbare än räddningstjänsten.'}]}
]},
{t:'Väder',ls:[
 {id:'k-7-1',t:'Väderinformation och vindskalor',b:`
<ul><li><b>Barometer:</b> följ trycket över tid. Fall med mer än 1–2 hPa per timme varslar om hård vind.</li><li><b>Väderrapporter:</b> SMHI, sjörapporter via radio och VHF, NAVTEX och väderappar. Appar visar ofta modelldata som kan missa lokala effekter.</li><li><b>Frontpassager:</b> vid en kallfront vrider vinden ofta medurs (t.ex. från sydväst till nordväst), ökar i byar och följs av klarare luft.</li></ul>
<h3>Vindskalor</h3><p>1 m/s ≈ 2 knop. Beaufortskalan: 4 Beaufort (måttlig vind) är ca 6–8 m/s, 6 Beaufort (hård vind) ca 11–14 m/s, 8 Beaufort (storm i dagligt tal, kuling enligt skalan) ca 17–21 m/s.</p>`,
 c:[{q:'Ungefär hur många knop är 10 m/s?',o:['20 knop','10 knop','5 knop','36 knop'],a:0,e:'1 m/s ≈ 2 knop.'},
    {q:'Barometern faller 3 hPa på en timme. Vad tyder det på?',o:['Snabbt ökande vind','Lugnt väder','Dimma','Högtryck'],a:0,e:'Snabba tryckfall varslar om hård vind.'}]}
]},
{t:'Säkerhet, sjöräddning och första hjälpen',ls:[
 {id:'k-8-1',t:'Sjöräddning och larm',b:`
<p>JRCC i Göteborg leder sjö- och flygräddning. Larma via VHF kanal 16, DSC eller 112. Ange: vem ni är, var ni är, vad som hänt, hur många ni är och vilken hjälp ni behöver.</p>
<h3>Onödiga larm</h3><ul><li>Har en EPIRB eller DSC löst ut av misstag: stäng av den och <b>meddela JRCC direkt</b>.</li><li>Ett oavsiktligt DSC-nödlarm avbryts enligt radions instruktion och följs av ett talmeddelande på kanal 16 om att larmet var falskt.</li><li>Nödraketer får inte användas för fest eller test.</li></ul>
<h3>Utrustning och brand</h3><p>Ha rätt utrustning för farvattnet: flytvästar, livboj med lina, nödsignaler, brandsläckare och brandfilt, ankare, länspump, verktyg och reservdelar. Lär alla ombord var allt finns. Förebygg brand: inga bränsleläckor, ventilerat motorrum, gasolslang hel och gasolkran stängd när den inte används.</p>`,
 c:[{q:'Din EPIRB har löst ut av misstag. Vad gör du?',o:['Stänger av den och meddelar JRCC direkt','Låter den vara på','Kastar den i sjön','Ringer kustbevakningen nästa dag'],a:0,e:'Annars startar en räddningsinsats i onödan.'}]},
 {id:'k-8-2',t:'Enklare motorfel',b:`
<ul><li><b>Motorn stannar:</b> kontrollera bränsle, bränslekran, tankventilation och bränslefilter (vatten i filtret). På diesel kan luft i systemet behöva luftas ut.</li><li><b>Överhettning:</b> kontrollera sjövattenintaget (plast eller tång), impellern och kilremmen.</li><li><b>Startar inte:</b> batteri, huvudströmbrytare, säkerhetsbrytare, att växeln står i neutralläge.</li></ul>
<p>Ha reservimpeller, filter, kilrem och verktyg ombord, och lär dig byta dem i hamnen innan du behöver det till sjöss.</p>`,
 c:[{q:'Motorn överhettas och kylvattenstrålen har slutat. Vad kontrollerar du först?',o:['Sjövattenintaget och impellern','Oljenivån','Batteriet','Tändstiften'],a:0,e:'Ett igensatt intag eller en trasig impeller stoppar kylvattnet.'}]},
 {id:'k-8-3',t:'Första hjälpen ombord',b:`
<ul><li><b>Andningsstopp:</b> larma, starta hjärt-lungräddning med 30 kompressioner och 2 inblåsningar. Vid drunkning: börja med inblåsningar.</li><li><b>Kraftig blödning:</b> tryck direkt på såret, lägg tryckförband, höj kroppsdelen.</li><li><b>Cirkulationssvikt (chock):</b> blek, kallsvettig, snabb puls. Lägg personen ner, håll den varm, höj benen om det inte finns skador som hindrar.</li><li><b>Stukning:</b> kyl, komprimera, högläge.</li><li><b>Benbrott:</b> stabilisera i det läge du hittar det, t.ex. med spjäla, och undvik onödiga rörelser.</li><li><b>Nedkylning och brännskador:</b> som i förarintyget.</li></ul>
<p>Ha förbandslåda och de läkemedel ni behöver för resan. Bedöm om båt och besättning klarar farvattnet och vädret, och vänd hellre i tid.</p>`,
 c:[{q:'Hur börjar du hjärt-lungräddning på en drunknad person?',o:['Med inblåsningar','Med 30 kompressioner','Med att ge vatten','Med att lägga i stabilt sidoläge'],a:0,e:'Vid drunkning är syrebrist orsaken.'},
    {q:'Hur behandlar du en kraftig blödning?',o:['Tryck direkt på såret och lägg tryckförband','Tvätta såret med saltvatten','Låt det blöda ut','Lägg is direkt'],a:0,e:'Höj dessutom kroppsdelen.'}]}
]},
{t:'Sjömanskap',sim:'sim-dagpraktik',ls:[
 {id:'k-9-1',t:'Manöveregenskaper och man överbord',b:`
<p>Känn din båts <b>stoppsträcka</b> (hur långt den går när du backar för fullt) och <b>girdiameter</b>. Testa dem i lugnt väder.</p>
<h3>Man överbord med större båt</h3><ul><li>Larma, kasta flytande, utkik pekar, tryck MOB.</li><li><b>Williamsongir</b> (ofta för större fartyg i dålig sikt): gira 60° åt den sida personen föll, rodret sedan över åt andra hållet tills du ligger på motsatt kurs. Då kommer du tillbaka längs samma spår.</li><li>Närma dig mot vinden och lägg i friläge i god tid.</li><li>Ombordtagning: livlina, nät, badstege eller räddningsslinga. Är personen nedkyld: ta upp vågrätt.</li></ul>`,
 c:[{q:'Varför används Williamsongir?',o:['Den för båten tillbaka i samma spår, även när man tappat sikten på personen','Den är snabbast','Den gör att man inte behöver vända','Den fungerar bara med segelbåt'],a:0,e:'Användbar i mörker och dålig sikt.'}]},
 {id:'k-9-2',t:'Hårt väder, vakter och långfärd',b:`
<ul><li><b>Sjöklargöring:</b> surra löst gods, stäng luckor och ventiler, ta fram flytvästar och livlinor.</li><li><b>Hårt väder:</b> minska farten, ta sjön snett framifrån, undvik att surfa ner i vågor. Sök lä i tid.</li><li><b>Vaktfördelning:</b> vid långa färder behöver alla sömn. Ett vaktschema med 3–4 timmars pass är vanligt.</li><li><b>Kost:</b> lättlagad, energirik mat och tillräckligt med vatten. Trötthet ökar risken för misstag och sjösjuka.</li></ul>`,
 c:[{q:'Varför behövs vaktschema på långa färder?',o:['Trötthet ökar risken för misstag','Det krävs i lag för alla båtar','För att spara bränsle','För att hålla radion bemannad på natten bara'],a:0,e:'Alla ombord behöver vila.'}]},
 {id:'k-9-3',t:'Ankring och tilläggning i svår vind',b:`
<ul><li><b>Ankarutrustning:</b> ankare som passar botten, kätting närmast ankaret och lina. Kätting ger vikt och en flack dragvinkel.</li><li><b>Svajankring:</b> båten svänger runt ankaret. Räkna med svajradien till andra båtar och land.</li><li><b>Akterankare och förtöjning i land:</b> vanligt i skärgården. Släpp ankaret i god tid, gå in mot berget och förtöj fören i bergkil eller träd.</li><li><b>Tilläggning med vind från land:</b> kom in brantare och få fast fören först. Vind mot land: lägg dig parallellt en bit ut och låt vinden trycka in båten.</li><li><b>Roder- och propellerverkan:</b> utnyttja propellereffekten vid backning och korta stötar för att svänga aktern.</li></ul>
<h3>Knopar för kustskepparintyget</h3><p>Dubbelt halvslag, dubbelt halvslag om egen part, skotstek, pålstek, <b>åttaknop</b> (stoppknop i linändar) och <b>råbandsknop</b> (knyter ihop två ändar av samma lina, t.ex. vid revning). Öva tills du kan dem utan att tänka.</p>`,
 c:[{q:'Vilken knop används som stoppknop i en linända?',o:['Åttaknop','Råbandsknop','Pålstek','Skotstek'],a:0,e:'Åttaknopen hindrar linan från att glida ur ett block eller en kipa.'},
    {q:'Varför har man kätting närmast ankaret?',o:['Den ger vikt och flack dragvinkel så att ankaret håller bättre','För att den syns bättre','För att linan inte ska flyta','Det är bara en tradition'],a:0,e:'En flack vinkel drar ankaret längs botten i stället för uppåt.'}]},
 {id:'k-9-4',t:'Stabilitet, svall och bogsering',b:`
<div class="fig">${figGBM()}</div>
<p>När båten krängar flyttar sig flytkraftens centrum (B) åt den nedtryckta sidan. Om tyngdpunkten (G) ligger under metacentrum (M) rätar båten upp sig. Tung last högt upp eller vatten som skvalpar i botten (<b>fri vätskeyta</b>) gör båten mindre stabil.</p>
<ul><li><b>Svall:</b> ta stora svall snett framifrån och sänk farten. Ditt eget svall ansvarar du för.</li><li><b>Bogsering och undsättning:</b> använd en lång, kraftig lina fäst i starka punkter (inte i en knap som kan slitas loss). Kör mycket sakta, och var redo att kapa linan. Bogsera gärna längs sidan i hamn.</li></ul>`,
 c:[{q:'Vad händer med stabiliteten när mycket vatten skvalpar i båtens botten?',o:['Den försämras','Den förbättras','Ingenting','Båten blir snabbare'],a:0,e:'Fri vätskeyta flyttar vikten åt den nedtryckta sidan.'},
    {q:'Vad är viktigt när du bogserar en annan båt?',o:['Lång, kraftig lina fäst i starka punkter, låg fart och beredskap att kapa','Kort lina och hög fart','Fästa linan i en relingsstötta','Att den bogserade båten kör motor fullt'],a:0,e:'Linan och fästena tar stora krafter.'}]}
]},
{t:'Miljö',ls:[
 {id:'k-10-1',t:'Lagar om miljö och hänsyn',b:`
<ul><li><b>Lag om åtgärder mot förorening från fartyg:</b> förbud mot utsläpp av olja, kemikalier och toalettavfall.</li><li><b>Miljöbalken:</b> förbud mot nedskräpning. Skyddade områden, naturreservat och djurskydd.</li><li><b>Allemansrätten:</b> gäller även på sjön, under ansvar.</li><li><b>Miljöfarligt avfall</b> (oljefilter, batterier, färgrester) lämnas i hamnens miljöstation.</li><li>Svall, buller, avgaser och ecodriving: som i förarintyget.</li></ul>`,
 c:[{q:'Var lämnar du gamla oljefilter och batterier?',o:['I hamnens miljöstation','I vanliga soptunnan','I sjön','Du behåller dem ombord'],a:0,e:'De är miljöfarligt avfall.'}]}
]}
];

LESSONS.radar=[
{t:'Sjövägsregler vid radarnavigering',ls:[
 {id:'r-1-1',t:'Regel 2, 5–8 och 19 när du inte ser',b:`
<p>Radarintyget handlar om att navigera säkert när du <b>inte</b> har visuell kontakt. Reglerna är desamma, men radarn ändrar hur du uppfyller dem.</p>
<ul><li><b>Regel 5, utkik:</b> radar är en del av utkiken, men ersätter inte syn och hörsel. Kör radarn när sikten är nedsatt eller kan bli det.</li>
<li><b>Regel 6, säker fart:</b> ta hänsyn till radarns begränsningar: valt avståndsområde, sjö- och regnklotter, små båtar och föremål som inte syns, och antalet ekon.</li>
<li><b>Regel 7, risk för kollision:</b> använd radarn systematiskt, med långa avståndsområden för tidig upptäckt och plottning. Dra inga slutsatser av knapphändig information, t.ex. ett enda radarsvep.</li>
<li><b>Regel 8, åtgärder:</b> stora, tydliga ändringar som syns på andras radar. Flera små ändringar syns inte.</li>
<li><b>Regel 19, nedsatt sikt:</b> om radarn visar ett fartyg som närmar sig, avgör om det är risk för kollision. Undvik gir åt babord för ett fartyg förut om tvärs (utom när du kör om det), och undvik gir mot ett fartyg tvärs eller akter om tvärs.</li></ul>
<p class="key"><b>Kom ihåg:</b> Regel 2 gäller alltid. Radarn gör dig inte till kursfasthållande i dimma. Regel 11–18 gäller bara när fartygen ser varandra.</p>`,
 c:[{q:'Gäller väjningsreglerna 13–17 när två fartyg bara ser varandra på radar?',o:['Nej, då gäller regel 19','Ja, alltid','Bara regel 15','Bara dagtid'],a:0,e:'Regel 11–18 kräver att fartygen är i sikte av varandra.'},
    {q:'Ett eko närmar sig från tvärs om styrbord i dimma. Vilken gir ska du undvika?',o:['Gir mot fartyget, alltså åt styrbord','Gir åt babord','All fartminskning','Ingen gir behöver undvikas'],a:0,e:'Regel 19 d ii: undvik gir mot ett fartyg tvärs eller akter om tvärs.'}]}
]},
{t:'Hur radarn fungerar',ls:[
 {id:'r-2-1',t:'Pulser, ekon och band',b:`
<p>Radarn sänder korta radiopulser från en roterande antenn. När en puls träffar något studsar en del tillbaka. <b>Tiden</b> tills ekot kommer tillbaka ger avståndet, och <b>antennens riktning</b> ger bäringen.</p>
<ul><li><b>X-band (3 cm, ca 9 GHz):</b> skarp bild och små antenner. Vanligast på fritidsbåtar.</li><li><b>S-band (10 cm, ca 3 GHz):</b> tränger bättre genom regn och sjöklotter. Används på större fartyg som komplement.</li></ul>
<p>Radiovågorna böjs lite mot jordytan, så <b>radarhorisonten</b> är något längre än den optiska: ungefär <b>2,2 × √antennhöjd</b> nautiska mil. Med antennen på 4 m ser radarn ca 4,4 M mot en platt yta. Höga föremål syns längre bort.</p>`,
 c:[{q:'Vad ger radarn avståndet till ett eko?',o:['Tiden det tar för pulsen att komma tillbaka','Ekots storlek','Antennens rotationshastighet','Färgen på ekot'],a:0,e:'Radiovågor går med ljusets hastighet.'},
    {q:'Ungefär hur långt är radarhorisonten med antennen 9 m upp?',o:['6,6 M','9 M','3 M','20 M'],a:0,e:'2,2 × √9 = 6,6.'}]},
 {id:'r-2-2',t:'Vad påverkar radarns prestanda',b:`
<ul><li><b>Pulslängd:</b> kort puls ger bättre <b>avståndsdiskriminering</b> (två ekon efter varandra hålls isär) och används på korta avståndsområden. Lång puls ger mer energi och längre räckvidd.</li>
<li><b>Pulsintervall (pulsrepetition):</b> pulsen måste hinna tillbaka innan nästa skickas. Glesa pulser behövs för långa avstånd.</li>
<li><b>Lobbredd (horisontell):</b> smal lob, alltså lång antenn, ger bättre <b>bäringsdiskriminering</b>. Två bojar bredvid varandra smälter annars ihop till ett eko.</li>
<li><b>Rotationshastighet:</b> snabbare rotation ger tätare uppdatering, viktigt i hög fart.</li><li><b>Effekt:</b> mer effekt ger längre räckvidd mot små mål.</li><li><b>Antennhöjd:</b> högre antenn ger längre räckvidd men mer sjöklotter.</li></ul>`,
 c:[{q:'Två bojar ligger bredvid varandra på samma avstånd men smälter ihop på radarn. Vad begränsar?',o:['Lobbredden (bäringsdiskrimineringen)','Pulslängden','Rotationshastigheten','Effekten'],a:0,e:'En längre antenn ger smalare lob.'},
    {q:'Varför används kort puls på korta avståndsområden?',o:['Det ger bättre avståndsdiskriminering','Det ger längre räckvidd','Det minskar strålningen','Det tar bort regnklotter'],a:0,e:'Två ekon nära varandra i avstånd hålls isär.'}]},
 {id:'r-2-3',t:'Puls-, bredbands- och HD-radar, och AIS',b:`
<ul><li><b>Pulsradar (magnetron):</b> lång räckvidd och bra i dåligt väder. Behöver uppvärmning och har en blind zon närmast båten.</li>
<li><b>Bredbandsradar (FMCW):</b> sänder kontinuerligt med varierande frekvens. Mycket bra upplösning på nära håll, ingen uppvärmning, låg strålning. Kortare räckvidd och sämre i kraftigt regn.</li>
<li><b>HD- och solid state-radar:</b> modern teknik med digital signalbehandling. Kan visa dopplerfärger för ekon som närmar sig.</li></ul>
<h3>AIS</h3><p>AIS sänder fartygets identitet, position, kurs och fart på VHF. Plottern kan visa CPA och TCPA för AIS-mål. Men bara fartyg med fungerande AIS syns, och positionen kommer från motfartygets GNSS. Använd AIS som komplement till radarn, aldrig som ersättning.</p>`,
 c:[{q:'Vad är en fördel med pulsradar?',o:['Lång räckvidd och bra i dåligt väder','Ingen blind zon','Ingen uppvärmning','Lägst strålning'],a:0,e:'Bredbandsradar är bättre nära båten.'}]}
]},
{t:'Ställa in och tolka bilden',ls:[
 {id:'r-3-1',t:'Reglage och presentation',b:`
<ul><li><b>Gain (förstärkning):</b> ställ så att ett svagt brus precis syns. För lite gain gör att små ekon försvinner.</li><li><b>Sea (sjöklotterdämpning, STC):</b> dämpar ekon nära båten från vågor. För mycket tar bort bojar och småbåtar.</li><li><b>Rain (regnklotterdämpning, FTC):</b> minskar regnets utsmetade ekon.</li><li><b>Tune:</b> finjusterar mottagaren. Sköts ofta automatiskt.</li><li><b>Range:</b> växla mellan kort avstånd för detaljer och långt för tidig upptäckt.</li></ul>
<h3>Presentation</h3><ul><li><b>Head up:</b> fören uppåt. Bilden roterar när du girar.</li><li><b>North up och course up:</b> kräver kurssensor. Stabil bild.</li><li><b>Relativ rörelse (RM):</b> egen båt står still i centrum, allt annat rör sig relativt dig.</li><li><b>Sann rörelse (TM):</b> egen båt rör sig över bilden, fasta föremål står still.</li><li><b>Efterlysning (trails):</b> visar ekonas spår bakåt i tiden.</li></ul>`,
 c:[{q:'Vad händer om du drar upp sjöklotterdämpningen för mycket?',o:['Små ekon som bojar och båtar kan försvinna','Bilden blir skarpare','Räckvidden ökar','Regnet försvinner'],a:0,e:'Dämpa precis så mycket att klottret blir genomskinligt.'},
    {q:'I vilket läge står egen båt still i bildens centrum?',o:['Relativ rörelse','Sann rörelse','North up','Course up'],a:0,e:'I sann rörelse flyttar sig egen båt över skärmen.'}]},
 {id:'r-3-2',t:'Känna igen ekon och felekon',sim:'sim-radar',b:`
<ul><li><b>Land:</b> stora, fasta ekon. Branta stränder syns bra, låga sandstränder dåligt. Bakom höga öar är det <b>radarskugga</b>.</li><li><b>Sjömärken:</b> små ekon. Bojar med radarreflektor syns bättre.</li><li><b>Racon:</b> ett svar i form av en morsebokstav som börjar strax bakom racon-positionen.</li><li><b>SART:</b> 12 prickar i linje utåt från SART:en. På nära håll blir prickarna bågar och cirklar.</li><li><b>Regn och snö:</b> utsmetade fläckar med mjuka kanter.</li><li><b>Interferens:</b> andra radar ger prickiga spiralmönster.</li></ul>
<h3>Falska ekon</h3><ul><li><b>Dubbelekon:</b> på samma bäring men dubbla avståndet, när signalen studsar mellan dig och ett stort föremål.</li><li><b>Multipla ekon:</b> flera ekon på samma bäring med lika avstånd.</li><li><b>Sidlobsekon:</b> en båge av ekon på samma avstånd som ett starkt eko nära båten.</li><li><b>Indirekta ekon:</b> signalen studsar via en del av den egna båten, t.ex. masten, och ekot visas på fel bäring.</li></ul>`,
 c:[{q:'Hur ser en racon ut på radarn?',o:['En morsebokstav som börjar strax bakom racon-positionen','12 prickar i linje','En ring runt båten','Ett utsmetat moln'],a:0,e:'12 prickar är en SART.'},
    {q:'Ett svagt eko syns på samma bäring som ett stort fartyg men på dubbla avståndet. Vad är det troligen?',o:['Ett dubbelekon','En SART','En racon','Regn'],a:0,e:'Signalen har studsat fram och tillbaka.'}]},
 {id:'r-3-3',t:'Rörliga eller fasta ekon',sim:'sim-radar',b:`
<p>I relativ rörelse rör sig även fasta föremål på skärmen. Ett fast föremål rör sig <b>parallellt med din kurslinje, bakåt, med din egen fart</b>. Allt som rör sig på något annat sätt är ett rörligt mål.</p>
<p>Använd efterlysning eller notera ekots läge med några minuters mellanrum. Jämför med en känd fast punkt i närheten.</p>
<h3>Radaroverlay</h3><p>Radarbilden kan läggas över sjökortet i plottern. Det gör det lättare att se vad som är land och vad som är fartyg. Men om kurssensorn är fel vriden hamnar ekona fel, så kontrollera alltid att landekona ligger rätt över kortets land.</p>`,
 c:[{q:'Du går 090° i 12 knop med relativ visning. Ett eko rör sig rakt mot 270° i 12 knop på skärmen. Vad är det?',o:['Troligen ett fast föremål','Ett fartyg på kollisionskurs','Ett fartyg som kör om dig','Ett falskt eko'],a:0,e:'Fasta föremål rör sig motsatt din kurs med din fart.'}]}
]},
{t:'Positionsbestämning med radar',ls:[
 {id:'r-4-1',t:'Avstånd, bäring och parallellindex',b:`
<ul><li><b>Två avstånd:</b> mät avståndet till två kända punkter med VRM. Rita två cirklar i sjökortet. Där de skär varandra är du. Avstånd är radarns noggrannaste mätning.</li>
<li><b>Bäring och avstånd:</b> en känd punkt räcker. Bäringen är mindre exakt, särskilt mot breda föremål.</li><li>Välj tydliga punkter som uddar, fyrar och små öar, och kontrollera att det är rätt föremål.</li></ul>
<div class="fig">${figPI()}</div>
<h3>Parallellindex</h3><p>Rita en linje parallell med kursen på det avstånd en udde ska passeras. Under gång ska uddens eko glida längs linjen. Glider det in mot din kurslinje driver du mot udden, och då ser du det direkt.</p>`,
 c:[{q:'Vilken radarmätning är normalt noggrannast?',o:['Avstånd','Bäring','Båda lika','Ingen'],a:0,e:'Därför ger två avstånd ofta bäst position.'},
    {q:'I parallellindex glider uddens eko närmare din kurslinje än indexlinjen. Vad betyder det?',o:['Du sätter mot udden','Du har gått för långt','Radarn är fel inställd','Udden rör sig'],a:0,e:'Korrigera kursen bort från udden.'}]}
]},
{t:'Plottning och väjning',sim:'sim-radar',ls:[
 {id:'r-5-1',t:'Manuell plottning: CPA, TCPA och motfartygets kurs',sim:'sim-radar',b:`
<div class="fig">${figPlot()}</div>
<ol><li>Markera ekot (<b>O</b>) och notera tiden.</li><li>Markera ekot igen efter 6 minuter (<b>A</b>).</li><li>Dra linjen O–A och förläng den. Det är ekots <b>relativa rörelse</b>.</li><li>Närmaste avståndet från centrum till den förlängda linjen är <b>CPA</b>. Tiden dit (<b>TCPA</b>) får du från hur fort ekot rör sig längs linjen.</li><li>Rita egen kurs och fart under 6 minuter <b>bakåt</b> från O. Den punkten heter <b>W</b>.</li><li>Linjen <b>W–A</b> visar motfartygets verkliga kurs och fart.</li></ol>
<p>Exempel: ekot går 1 M på 6 minuter längs O–A, alltså 10 knop relativt. Är det 3 M kvar till CPA-punkten blir TCPA 18 minuter.</p>
<p class="key"><b>Kom ihåg:</b> Plottning gäller bara om du håller kurs och fart under tiden. Ändrar du kurs måste du börja om.</p>`,
 c:[{q:'Ekot rör sig 0,8 M på 6 minuter längs relativlinjen. Vilken relativ fart är det?',o:['8 knop','0,8 knop','4,8 knop','16 knop'],a:0,e:'6 minuter är en tiondels timme: 0,8 × 10.'},
    {q:'Vad visar linjen W–A?',o:['Motfartygets verkliga kurs och fart','Egen kurs','CPA','Relativ rörelse'],a:0,e:'O–A är relativ, W–O är egen, W–A är motfartygets sanna rörelse.'}]},
 {id:'r-5-2',t:'Väja med radar',sim:'sim-vajning',b:`
<ul><li>Bestäm CPA och TCPA för alla mål som närmar sig.</li><li>Är CPA för litet: gör en stor kursändring tidigt, gärna 30° eller mer, eller sänk farten kraftigt.</li><li>Följ regel 19: undvik babordsgir för fartyg förut om tvärs och gir mot fartyg tvärs eller akter om tvärs.</li><li>Kontrollera efter manövern att ekots bäring ändras och att CPA ökar.</li><li>Fortsätt plotta tills fartyget är förbi och klart.</li></ul>
<p>Moderna radar har ARPA eller MARPA som räknar ut CPA och TCPA automatiskt. Det kräver bra kurs- och fartdata och ett par minuters spårning innan värdena är pålitliga.</p>`,
 c:[{q:'Hur stor bör en kursändring vara för att synas på andras radar?',o:['Stor, gärna 30° eller mer','2–3°','Exakt 10°','Den ska helst inte märkas'],a:0,e:'Regel 8: tydliga ändringar.'}]},
 {id:'r-5-3',t:'Arbetsfördelning, kommunikation och strålning',b:`
<p>I nedsatt sikt är det svårt att samtidigt styra, hålla utkik och tolka radarn. Dela upp arbetet:</p><ul><li><b>Rorsman</b> styr och håller utkik med ögon och öron.</li><li><b>Radarnavigatör</b> tolkar radarn, plottar och ger order.</li><li>Kommunicera tydligt och upprepa order: "Styr 045." – "Styr 045."</li><li>Ge löpande information: "Eko 30 grader om styrbord, 1,5 M, närmar sig."</li></ul>
<p><b>Strålning:</b> stå inte nära en sändande radarantenn och titta inte in i den på nära håll. Montera antennen ovanför huvudhöjd.</p>`,
 c:[{q:'Varför ska rorsman upprepa en order?',o:['Så att radarnavigatören vet att ordern uppfattats rätt','Det är tradition','För att öva','Det behövs inte'],a:0,e:'Det fångar missförstånd innan de blir fel manöver.'}]}
]},
{t:'Satellitnavigering',ls:[
 {id:'r-6-1',t:'GNSS: principer och risker',b:`
<ul><li><b>GNSS</b> är samlingsnamnet för satellitsystem: amerikanska GPS, ryska GLONASS, europeiska Galileo och kinesiska BeiDou. Mottagaren räknar ut positionen från tiden signalerna tar från minst fyra satelliter.</li>
<li><b>DGPS och EGNOS</b> sänder korrektioner som förbättrar noggrannheten.</li><li><b>Kurs och fart</b> räknas fram från förändringen i position, alltså kurs och fart över grund. Vid låg fart blir värdena osäkra.</li>
<li><b>Störning (jamming) och falska signaler (spoofing)</b> förekommer, särskilt i delar av Östersjön. Var misstänksam om positionen hoppar eller inte stämmer med det du ser.</li>
<li><b>Skala:</b> för liten skala i plottern döljer grund. För stor skala (överzoom) ger falsk detaljrikedom.</li></ul>
<p>Planera rutter i plottern med brytpunkter som har marginal till grund, och kontrollera hela rutten i störst möjlig skala.</p>`,
 c:[{q:'Varför ska du vara misstänksam om GNSS-positionen plötsligt hoppar?',o:['Det kan vara störning eller falska signaler','Det betyder att du är i ström','Det betyder att du har bättre noggrannhet','Det är normalt och ofarligt'],a:0,e:'Jämför med radar, ekolod och det du ser.'},
    {q:'Vad gör EGNOS?',o:['Sänder korrektioner som förbättrar GNSS-noggrannheten','Ersätter GPS','Är ett AIS-system','Är en radar'],a:0,e:'Europeiskt korrektionssystem via satellit.'}]}
]}
];

LESSONS.src=[
{t:'Radiosystemet',ls:[
 {id:'s-1-1',t:'GMDSS och havsområden',b:`
<p><b>GMDSS</b> (Global Maritime Distress and Safety System) är det världsomspännande systemet för nöd- och säkerhetskommunikation till sjöss. Tanken är att ett nödlarm ska nå räddningstjänst och fartyg i närheten snabbt och automatiskt.</p>
<ul><li><b>A1:</b> inom räckvidd för en kuststation med VHF-DSC, ofta 20–30 M.</li><li><b>A2:</b> inom räckvidd för MF-DSC.</li><li><b>A3:</b> inom täckning för geostationära satelliter.</li><li><b>A4:</b> övriga områden, främst polarområdena.</li></ul>
<p>Svenska kustvatten ligger i A1. Med SRC får du använda VHF. För MF och HF krävs LRC.</p>`,
 c:[{q:'I vilket havsområde ligger svenska kustvatten?',o:['A1','A2','A3','A4'],a:0,e:'Täckt av VHF-DSC från land.'}]},
 {id:'s-1-2',t:'VHF: kanaler, räckvidd och regler',b:`
<ul><li><b>Kanal 16:</b> nöd, il, säkerhet och anrop. Passa (lyssna på) kanal 16 när radion är på.</li><li><b>Kanal 70:</b> enbart DSC, aldrig tal.</li><li><b>Kanal 13:</b> navigationssäkerhet mellan fartyg (bryggan till bryggan).</li><li><b>Arbetskanaler mellan fritidsbåtar:</b> t.ex. 72 och 77. Byt dit från 16 efter anropet.</li><li><b>Simplex</b> = sänder och tar emot på samma frekvens, en i taget. <b>Duplex</b> = två frekvenser, båda kan prata samtidigt (används mot kuststationer).</li></ul>
<p><b>Räckvidd:</b> VHF går i siktlinje. Antennhöjden avgör. Mellan två fritidsbåtar kanske 5–15 M, till en kuststation med hög mast mycket längre.</p>
<p><b>Effekt:</b> 1 W för nära kontakt, 25 W för längre avstånd och nöd.</p>
<p><b>Radiohemlighet:</b> det du hör som inte är avsett för dig får du inte föra vidare. Onödig trafik, svordomar och falska nödanrop är förbjudna.</p>`,
 c:[{q:'Vilken kanal används för navigationssäkerhet mellan fartyg?',o:['Kanal 13','Kanal 70','Kanal 72','Kanal 6'],a:0,e:'Kanal 13 = bryggan till bryggan.'},
    {q:'Vad betyder simplex?',o:['Man sänder och tar emot på samma frekvens, en i taget','Båda kan prata samtidigt','Radion sänder bara digitalt','Kanalen är krypterad'],a:0,e:'Duplex använder två frekvenser.'}]}
]},
{t:'DSC',ls:[
 {id:'s-2-1',t:'DSC och MMSI',b:`
<p><b>DSC</b> (Digital Selective Calling) skickar digitala anrop på kanal 70. Varje radio har ett <b>MMSI</b>, ett nummer med nio siffror som identifierar fartyget. De tre första siffrorna (MID) visar land, för Sverige 265 eller 266.</p>
<h3>Typer av DSC-anrop</h3><ul><li><b>Distress (nöd):</b> skickas med den röda knappen. Innehåller MMSI, position, tid och typ av nöd.</li><li><b>All ships (alla fartyg):</b> med prioritet Urgency (il) eller Safety (säkerhet).</li><li><b>Individual (individuellt):</b> till ett visst MMSI, t.ex. en vän eller kuststation.</li><li><b>Group (grupp):</b> till en grupp fartyg.</li></ul>
<p>Koppla radion till GPS så att positionen följer med automatiskt.</p>`,
 c:[{q:'Vilken information skickas automatiskt i ett DSC-nödlarm?',o:['MMSI, position, tid och typ av nöd','Bara fartygets namn','Röstmeddelande','Väderinformation'],a:0,e:'Därför ska MMSI vara inlagt och GPS ansluten.'}]},
 {id:'s-2-2',t:'Skicka, kvittera och avbryta nödlarm',b:`
<ol><li>Lyft locket på den röda knappen. Välj typ av nöd om det hinns med.</li><li>Håll knappen intryckt tills larmet skickas (några sekunder).</li><li>Radion upprepar larmet automatiskt tills en kuststation kvitterar.</li><li>Radion byter till kanal 16. Sänd nödmeddelandet med tal.</li></ol>
<h3>Kvittens</h3><p>Normalt är det kuststationen som kvitterar ett DSC-nödlarm. Ett fartyg som tar emot larmet ska lyssna på kanal 16 och vara redo att hjälpa, men inte kvittera DSC-larmet om det inte finns särskilda skäl.</p>
<h3>Falskt larm</h3><p>Har du skickat ett nödlarm av misstag: avbryt det enligt radions instruktion, och sänd sedan på kanal 16: "All stations, all stations, all stations, this is (namn, anropssignal, MMSI). Cancel my distress alert of (tid)."</p>`,
 c:[{q:'Du har skickat ett DSC-nödlarm av misstag. Vad gör du?',o:['Avbryter enligt radions instruktion och meddelar på kanal 16 att larmet är falskt','Stänger av radion och säger inget','Skickar ett nytt nödlarm','Ringer en vän'],a:0,e:'Annars startar en räddningsinsats.'},
    {q:'Vem kvitterar normalt ett DSC-nödlarm?',o:['Kuststationen','Närmaste fritidsbåt','Den som skickade det','Ingen'],a:0,e:'Fartyg lyssnar på kanal 16 och är redo att hjälpa.'}]}
]},
{t:'Nöd, il och säkerhet',ls:[
 {id:'s-3-1',t:'Nödtrafik: MAYDAY',b:`
<p>MAYDAY används vid <b>omedelbar fara för liv eller fartyg</b>. Efter DSC-larmet, på kanal 16:</p>
<p class="key">MAYDAY MAYDAY MAYDAY<br>THIS IS (namn ×3), (anropssignal), (MMSI)<br>MAYDAY (namn), (anropssignal), (MMSI)<br>MY POSITION IS ...<br>I AM (typ av nöd, t.ex. SINKING / ON FIRE)<br>I REQUIRE IMMEDIATE ASSISTANCE<br>(antal personer ombord, övrig information)<br>OVER</p>
<h3>MAYDAY RELAY</h3><p>Används när du vidarebefordrar någon annans nödmeddelande, t.ex. om du hört ett anrop som ingen besvarat eller ser nödsignaler.</p>
<h3>Under nödtrafiken</h3><ul><li><b>SEELONCE MAYDAY:</b> tystnad, sänd inte på kanalen.</li><li><b>SEELONCE PRUDENCE:</b> begränsad trafik tillåten.</li><li><b>SEELONCE FEENEE:</b> nödtrafiken är avslutad.</li></ul>`,
 c:[{q:'Vad säger du direkt efter MAYDAY MAYDAY MAYDAY?',o:['THIS IS och fartygets namn tre gånger','Positionen','Antal personer','OVER'],a:0,e:'Först vem, sedan var, sedan vad.'},
    {q:'Du ser röda nödraketer men hör inget anrop. Vad gör du?',o:['Sänder MAYDAY RELAY','Sänder MAYDAY för egen del','Väntar','Sänder SÉCURITÉ'],a:0,e:'Du vidarebefordrar nöden.'}]},
 {id:'s-3-2',t:'Il- och säkerhetsmeddelanden',b:`
<ul><li><b>PAN PAN</b> (il): brådskande men inte omedelbar fara. T.ex. motorhaveri som driver mot grund på avstånd, eller en person som behöver medicinsk rådgivning.</li><li><b>SÉCURITÉ</b> (säkerhet): navigations- eller vädervarning, t.ex. drivande container eller släckt fyr.</li></ul>
<p>Båda kan föregås av ett DSC-anrop till alla fartyg med rätt prioritet. Själva meddelandet sänds sedan på kanal 16 eller, för säkerhetsmeddelanden, på en arbetskanal som anges i anropet.</p>
<p>Formatet är samma som för MAYDAY: signalordet tre gånger, ALL STATIONS tre gånger, THIS IS, vem, var, vad och vilken hjälp som behövs.</p>`,
 c:[{q:'Motorn har stannat och du driver långsamt, men det finns ingen omedelbar fara. Vilket signalord?',o:['PAN PAN','MAYDAY','SÉCURITÉ','Inget'],a:0,e:'Il, inte nöd.'}]}
]},
{t:'Rutintrafik och maritim engelska',ls:[
 {id:'s-4-1',t:'Anrop, procedurord och fonetiskt alfabet',b:`
<p><b>Rutinanrop på kanal 16:</b> "(Mottagarens namn) ×2, THIS IS (ditt namn) ×2, OVER." När du får svar: byt till en arbetskanal. Håll anropen korta.</p>
<h3>Procedurord</h3><ul><li><b>OVER:</b> jag väntar på svar.</li><li><b>OUT:</b> samtalet är slut.</li><li><b>SAY AGAIN:</b> upprepa.</li><li><b>CORRECTION:</b> jag rättar mig.</li><li><b>ROGER / RECEIVED:</b> mottaget.</li><li><b>STAND BY:</b> vänta.</li></ul>
<h3>Fonetiska alfabetet</h3><p>Alfa, Bravo, Charlie, Delta, Echo, Foxtrot, Golf, Hotel, India, Juliett, Kilo, Lima, Mike, November, Oscar, Papa, Quebec, Romeo, Sierra, Tango, Uniform, Victor, Whiskey, X-ray, Yankee, Zulu.</p>
<p>Siffror sägs en i taget: 1-6 = "one six". Nio uttalas "niner".</p>`,
 c:[{q:'Hur stavar du "SKUTA" fonetiskt?',o:['Sierra Kilo Uniform Tango Alfa','Sugar King Uncle Tom Able','Sierra Kilo Unicorn Tango Alpha','Samuel Karl Urban Teodor Adam'],a:0,e:'Det internationella alfabetet.'},
    {q:'Vad betyder STAND BY?',o:['Vänta','Samtalet är slut','Upprepa','Jag rättar mig'],a:0,e:'Används när du behöver en stund innan du svarar.'}]},
 {id:'s-4-2',t:'Maritim engelska',b:`
<p>IMO:s standardfraser (SMCP) gör att alla förstår varandra. Några vanliga:</p>
<ul><li>"I am on fire." – Det brinner ombord.</li><li>"I am taking water." – Vi tar in vatten.</li><li>"I am aground." – Vi har gått på grund.</li><li>"Man overboard." – Man överbord.</li><li>"I require medical assistance." – Vi behöver medicinsk hjälp.</li><li>"My position is ... degrees ... minutes north, ... degrees ... minutes east."</li><li>"What are your intentions?" – Vad har du för avsikter?</li><li>"I will pass astern of you." – Jag går akter om dig.</li></ul>
<p>Prata långsamt och tydligt och använd korta meningar.</p>`,
 c:[{q:'Hur säger du "vi tar in vatten" på maritim engelska?',o:['I am taking water','I have water','Water is coming','We are wet'],a:0,e:'Standardfras i SMCP.'}]}
]},
{t:'Nödutrustning och säkerhetsinformation',ls:[
 {id:'s-5-1',t:'EPIRB, SART, AIS-SART och NAVTEX',b:`
<ul><li><b>EPIRB:</b> nödsändare på 406 MHz som larmar via satellitsystemet COSPAS-SARSAT. Ska registreras på fartyget. Testa enligt instruktionen, aldrig med riktigt larm.</li><li><b>PLB:</b> personlig nödsändare, samma system, registrerad på en person.</li><li><b>Radar-SART:</b> syns som 12 prickar på radarn hos räddningsenheter i närheten.</li><li><b>AIS-SART:</b> syns som ett särskilt AIS-mål i plottern.</li><li><b>NAVTEX:</b> tar emot navigations- och vädervarningar som text, internationellt på 518 kHz.</li></ul>`,
 c:[{q:'Hur larmar en EPIRB?',o:['Via satellit på 406 MHz','Via VHF kanal 16','Via mobilnätet','Via radar'],a:0,e:'COSPAS-SARSAT.'}]}
]}
];

LESSONS.lrc=[
{t:'MF och HF',ls:[
 {id:'l-1-1',t:'Vågutbredning',b:`
<ul><li><b>MF (300 kHz–3 MHz, i praktiken runt 2 MHz):</b> går som <b>markvåg</b> längs jordytan, ofta 100–200 M. På natten kan rymdvågen reflekteras i jonosfären och nå längre, men det ger också mer störningar.</li>
<li><b>HF (3–30 MHz, kortvåg):</b> reflekteras mot <b>jonosfären</b> och kan nå tusentals sjömil. Vilket band som fungerar beror på avstånd, tid på dygnet, årstid och solaktivitet.</li></ul>
<p><b>Tumregel:</b> långt avstånd och dagsljus kräver högre frekvens (t.ex. 12 eller 16 MHz). Kortare avstånd och natt kräver lägre (4 eller 6 MHz). Det finns ofta en <b>tyst zon</b> mellan markvågens slut och där rymdvågen kommer ner.</p>`,
 c:[{q:'Hur når MF-signaler sina mottagare dagtid?',o:['Som markvåg längs jordytan','Via satellit','Bara i siktlinje','Via jonosfären mitt på dagen'],a:0,e:'Dagtid dämpas MF kraftigt i jonosfären.'},
    {q:'Du ska nå en station 2 000 M bort mitt på dagen. Vilket band väljer du?',o:['Ett högt HF-band, t.ex. 12–16 MHz','MF 2 MHz','VHF','Det lägsta HF-bandet'],a:0,e:'Långt och dag = högt.'}]},
 {id:'l-1-2',t:'Havsområden och kuststationer',b:`
<ul><li><b>A1:</b> VHF-DSC-täckning.</li><li><b>A2:</b> MF-DSC-täckning, ofta drygt 100 M från kuststationen.</li><li><b>A3:</b> geostationär satellittäckning, ungefär 70°N–70°S.</li><li><b>A4:</b> polarområden.</li></ul>
<p>Vilka områden som finns i ett farvatten framgår av ITU:s publikationer och nationella listor. Kuststationer har passning på DSC-frekvenserna och sänder sjösäkerhetsinformation. En långfärdsseglare behöver MF/HF eller satellitutrustning i A2–A4.</p>`,
 c:[{q:'Vad krävs för nödkommunikation i havsområde A3 utöver VHF?',o:['MF/HF och/eller satellitkommunikation','Bara mobiltelefon','Bara VHF','Inget'],a:0,e:'A3 ligger utanför räckvidd för landbaserad VHF och MF.'}]}
]},
{t:'DSC och nödtrafik på MF/HF',ls:[
 {id:'l-2-1',t:'Frekvenser för nöd',b:`
<p>För varje band finns en DSC-frekvens och en tillhörande talfrekvens för nödtrafik:</p>
<ul><li>MF: DSC <b>2187,5 kHz</b>, tal <b>2182 kHz</b></li><li>4 MHz: DSC 4207,5 kHz, tal 4125 kHz</li><li>6 MHz: DSC 6312 kHz, tal 6215 kHz</li><li>8 MHz: DSC 8414,5 kHz, tal 8291 kHz</li><li>12 MHz: DSC 12577 kHz, tal 12290 kHz</li><li>16 MHz: DSC 16804,5 kHz, tal 16420 kHz</li></ul>
<p>Lär dig MF-paret och att HF-banden finns. Radion väljer ofta frekvens automatiskt vid nödlarm.</p>`,
 c:[{q:'Efter ett DSC-nödlarm på 2187,5 kHz, var sänds nödmeddelandet med tal?',o:['2182 kHz','2187,5 kHz','Kanal 16','518 kHz'],a:0,e:'Det tillhörande MF-talfrekvensen.'}]},
 {id:'l-2-2',t:'Procedurer på MF och HF',b:`
<ul><li>Ett DSC-nödlarm på MF/HF kan skickas på ett band eller i en sekvens över flera band.</li><li>Kuststationen kvitterar med DSC och tar sedan emot talmeddelandet på motsvarande talfrekvens.</li><li>Ett fartyg som tar emot ett nödlarm på HF långt bort ska normalt inte kvittera, men lyssna och vid behov vidarebefordra till närmaste kuststation.</li><li>Falskt larm avbryts som på VHF, och meddelas på talfrekvensen för det band larmet gick på.</li></ul>
<p>Rutintrafik med kuststationer sker ofta i duplex på särskilda arbetsfrekvenser, som du hittar i ITU:s lista över kuststationer.</p>`,
 c:[{q:'Du tar emot ett HF-nödlarm från ett fartyg på andra sidan Atlanten. Vad gör du normalt?',o:['Lyssnar och är beredd att vidarebefordra, men kvitterar inte','Kvitterar direkt','Ignorerar det','Skickar eget nödlarm'],a:0,e:'Kuststationerna kvitterar.'}]}
]},
{t:'Satellit och säkerhetsinformation',ls:[
 {id:'l-3-1',t:'Satellitsystem',b:`
<ul><li><b>Inmarsat:</b> geostationära satelliter för tal, data och nödlarm. Inmarsat C används för textmeddelanden och tar emot sjösäkerhetsinformation.</li><li><b>Iridium:</b> satelliter i låg bana med täckning även vid polerna. Erkänt inom GMDSS.</li><li><b>COSPAS-SARSAT:</b> satellitsystemet som tar emot EPIRB- och PLB-larm på 406 MHz.</li></ul>`,
 c:[{q:'Vilket satellitsystem tar emot EPIRB-larm?',o:['COSPAS-SARSAT','Inmarsat C','Galileo','NAVTEX'],a:0,e:'406 MHz.'}]},
 {id:'l-3-2',t:'Sjösäkerhetsinformation: NAVTEX och SafetyNET',b:`
<ul><li><b>NAVTEX:</b> text på 518 kHz (internationellt, engelska) och 490 kHz (nationellt). Räckvidd ca 200–400 M. Du väljer vilka stationer och typer av meddelanden du vill ta emot.</li><li><b>SafetyNET:</b> sjösäkerhetsinformation via Inmarsat för områden utanför NAVTEX-täckning.</li><li><b>HF-NBDP:</b> textsändningar på HF i vissa områden.</li></ul>`,
 c:[{q:'På vilken frekvens sänds nationell NAVTEX på eget språk?',o:['490 kHz','518 kHz','2182 kHz','8414,5 kHz'],a:0,e:'518 kHz är internationell på engelska.'}]}
]},
{t:'Utrustning',ls:[
 {id:'l-4-1',t:'Antenn, jord och strömförsörjning',b:`
<ul><li><b>Antenn:</b> MF/HF behöver en lång antenn, t.ex. en isolerad akterstag på en segelbåt eller en piskantenn.</li><li><b>Antennavstämmare (tuner):</b> anpassar antennen till frekvensen.</li><li><b>Jordplan:</b> en god jordförbindelse med havet, t.ex. en jordplatta eller kopparband, är avgörande för räckvidden.</li><li><b>Strömförsörjning:</b> HF drar mycket ström när den sänder. Ha god batterikapacitet och gärna en reservkälla.</li><li><b>Test:</b> testa utrustningen regelbundet, t.ex. med DSC-testanrop till en kuststation, aldrig med nödlarm.</li></ul>`,
 c:[{q:'Vad gör antennavstämmaren?',o:['Anpassar antennen till den frekvens du sänder på','Förstärker mottagningen av NAVTEX','Ersätter jordplanet','Skickar DSC'],a:0,e:'En dåligt anpassad antenn ger kort räckvidd.'}]}
]}
];

LESSONS.icc=[
{t:'Vad ICC är',ls:[
 {id:'i-1-1',t:'ICC och hur du får det i Sverige',b:`
<p><b>ICC</b> (International Certificate of Competence) är ett intyg enligt FN:s resolution 40 som visar att du har kompetens att föra fritidsbåt. Många länder, framför allt i Medelhavet och på kontinentens kanaler, och de flesta charterbolag kräver det eller något motsvarande.</p>
<h3>Underlag i Sverige</h3><ul><li>Förarintyg eller kustskepparintyg</li><li>SRC (VHF)</li><li>Båtpraktik</li><li>För inre vattenvägar dessutom kanalintyg</li></ul>
<h3>Gränser</h3><ul><li>Med förarintyg som grund: motorbåt upp till 10 m.</li><li>Med kustskepparintyg: motorbåt upp till 24 m.</li><li>Intyget anger om det gäller kust, inre vattenvägar eller båda, och motor, segel eller båda.</li></ul>
<p>ICC gäller inte som behörighet i Sverige. Här är det de svenska intygen som gäller.</p>`,
 c:[{q:'Vilket svenskt underlag krävs för ICC för motorbåt upp till 24 m?',o:['Kustskepparintyg, SRC och båtpraktik','Förarintyg och SRC','Bara SRC','Bara båtpraktik'],a:0,e:'Med förarintyg som grund gäller ICC motorbåt upp till 10 m.'}]}
]},
{t:'Praktisk båthantering',sim:'sim-dagpraktik',ls:[
 {id:'i-2-1',t:'Medelhavsförtöjning och charter utomlands',b:`
<h3>Medelhavsförtöjning</h3><ol><li>Släpp ankaret en bit ut, ungefär 3–4 båtlängder från kajen.</li><li>Backa sakta mot kajen medan ankarlinan eller kättingen ges ut.</li><li>Lägg två aktertampar i land, ofta i kors.</li><li>Sträck ankaret så att aktern hålls fri från kajen.</li></ol>
<p>Ofta finns i stället en <b>muring</b> (fast förtöjningslina till en tyngd på botten) som tas upp från kajen och fästs i fören.</p>
<h3>Inför charter</h3><ul><li>Gå igenom båten med uthyraren: motor, säkerhetsutrustning, VHF, gasol och ankarspel.</li><li>Kontrollera vilka papper som ska finnas ombord.</li><li>Läs lokala regler: hastighetsbegränsningar nära land, ankringsförbud, skyddade områden.</li><li>I Atlanten och Engelska kanalen finns stort <b>tidvatten</b>, med strömmar och vattenstånd som ändras på några timmar. Läs tidvattentabeller.</li></ul>`,
 c:[{q:'Hur förtöjer man oftast i Medelhavet?',o:['Med aktern mot kajen och ankare eller muring i fören','Långsides med springar','Med fören mot kajen och akterankare','Svajankrat ute i hamnbassängen'],a:0,e:'Medelhavsförtöjning.'}]}
]},
{t:'Inre vattenvägar och CEVNI',ls:[
 {id:'i-3-1',t:'CEVNI: regler för kanaler och floder',b:`
<p><b>CEVNI</b> är de europeiska reglerna för inre vattenvägar. De liknar sjövägsreglerna men har egna skyltar, ljus och signaler. Kunskapen visas i Sverige genom kanalintyget.</p>
<h3>Skyltarnas grupper</h3><ul><li><b>Förbud:</b> röd kant eller röd botten, t.ex. förbud att passera, förbud att ankra, förbud att förtöja.</li><li><b>Påbud:</b> röd kant med symbol, t.ex. att du måste följa en viss riktning eller lyssna på VHF.</li><li><b>Begränsningar:</b> t.ex. begränsat djup eller höjd.</li><li><b>Upplysningar och rekommendationer:</b> ofta blå, t.ex. tillåten förtöjning eller VHF-kanal.</li></ul>
<h3>Slussning</h3><ul><li>Följ ljussignalerna: rött = vänta, grönt = kör in.</li><li>Ha fendrar och långa tampar redo på båda sidor.</li><li>Förtöj löst och följ med båten när vattnet stiger eller sjunker. Gör aldrig fast hårt.</li><li>Stäng av motorn om slussvakten säger det, och håll avstånd till kommersiella fartyg.</li></ul>
<p>På floder har ofta fartyg som går med strömmen företräde, eftersom de har sämre manöverförmåga.</p>`,
 c:[{q:'Varför får du inte göra fast hårt i en sluss?',o:['Båten måste kunna följa med när vattennivån ändras','Det är förbjudet att röra slussväggen','Tampen kan bli smutsig','Det går långsammare'],a:0,e:'En hårt fastgjord båt kan hänga i tamparna eller dras under.'},
    {q:'Vad betyder en blå skylt i CEVNI oftast?',o:['Upplysning eller rekommendation','Förbud','Fara','Slut på vattenvägen'],a:0,e:'Förbud har röd kant eller botten.'}]}
]}
];

LESSONS.fb8=[
{t:'Behörigheten',ls:[
 {id:'b-1-1',t:'Vad klass VIII ger dig',b:`
<p>Fartygsbefäl klass VIII är en yrkesbehörighet som Transportstyrelsen utfärdar. Den gäller fartyg i yrkesmässig trafik, t.ex. taxibåtar, mindre passagerarbåtar och arbetsbåtar.</p>
<h3>Fartområden</h3><p>Transportstyrelsen delar in farvattnen i <b>inre fart</b>, <b>närfart</b>, <b>Europafart</b> och <b>oceanfart</b>, i den ordningen allt större områden. Klass VIII gäller i första hand inre fart.</p>
<h3>Behörigheten i inre fart</h3><ul><li><b>Befälhavare</b> på fartyg under 20 och 20–70 i dräktighet.</li><li><b>Styrman</b> på fartyg 71–500 i dräktighet.</li><li>Dessutom befälhavare på <b>fiskefartyg 12–24 m</b> i högst närfart.</li></ul>
<p><b>Dräktighet</b> (bruttodräktighet) är ett mått på fartygets volym, inte vikt.</p>`,
 c:[{q:'Vad mäter dräktighet?',o:['Fartygets volym','Fartygets vikt','Motorns effekt','Antal passagerare'],a:0,e:'Bruttodräktighet räknas från fartygets inneslutna volym.'},
    {q:'Får du vara befälhavare på ett fartyg om 120 i dräktighet i inre fart med klass VIII?',o:['Nej, bara styrman','Ja','Ja, med under 12 passagerare','Bara dagtid'],a:0,e:'Befälhavare upp till 70.'}]},
 {id:'b-1-2',t:'Krav, sjötjänst och förnyelse',b:`
<ul><li><b>Examen:</b> godkänd fartygsbefälsexamen klass VIII, högst 5 år gammal när du ansöker.</li><li><b>Sjötjänst:</b> t.ex. 36 månader i däckstjänst varav minst 12 på handelsfartyg, eller 24 månader med minst 12 i yrkesmässig inre fart. Tjänsten ska vara på fartyg om minst 20 i dräktighet. Det finns också ett alternativ med praktiskt prov inför Transportstyrelsens inspektör.</li><li><b>Läkarintyg för sjöfolk:</b> högst två år gammalt, som visar att kraven på syn och hörsel är uppfyllda.</li><li><b>Giltighet:</b> 5 år.</li><li><b>Förnyelse:</b> 12 månaders tjänst som fartygsbefäl under giltighetstiden, eller godkänd omtentamen.</li></ul>
<p>Ansökan görs via Mina sidor för sjömän hos Transportstyrelsen.</p>`,
 c:[{q:'Hur länge gäller ett läkarintyg för sjöfolk som underlag?',o:['Högst två år','Ett år','Fem år','Livet ut'],a:0,e:'Det ska vara utfärdat enligt STCW.'}]}
]},
{t:'Befälhavarens ansvar',ls:[
 {id:'b-2-1',t:'Sjövärdighet, bemanning och passagerare',b:`
<ul><li><b>Sjövärdighet:</b> fartyget ska vara i gott skick, rätt utrustat och lastat. Befälhavaren ska se till att det är sjövärdigt före varje resa.</li><li><b>Bemanning:</b> Transportstyrelsen beslutar om säkerhetsbesättning. Fartyget får inte gå med färre än beslutet anger.</li><li><b>Passagerare:</b> fler än 12 passagerare gör fartyget till passagerarfartyg med särskilda krav. Ge alltid passagerarna säkerhetsinformation: var flytvästarna finns, hur de tas på och vad som gäller vid nödsituation.</li><li><b>Alkohol:</b> sjölagens promillegränser gäller. Den som tjänstgör ombord får inte vara påverkad.</li><li><b>Vila:</b> trötthet orsakar många olyckor. Följ reglerna om arbetstid och vila.</li><li><b>Rapportering:</b> olyckor och tillbud ska rapporteras till Transportstyrelsen.</li></ul>`,
 c:[{q:'Vad ska passagerare alltid få före avgång?',o:['Säkerhetsinformation om flytvästar och nödsituationer','Väderprognos','Fartygets dräktighet','Befälhavarens behörighet'],a:0,e:'Det är befälhavarens ansvar.'}]}
]},
{t:'Navigation och bryggarbete',sim:'sim-vajning',ls:[
 {id:'b-3-1',t:'Bryggrutiner, VTS och trafikseparering',b:`
<ul><li><b>Resplanering:</b> rutt, djup, faror, väder, nödhamnar och tidsplan, före varje resa.</li><li><b>Utkik och vakt:</b> utkik ska alltid hållas. Den som har vakten får inte göra annat som tar uppmärksamheten.</li><li><b>VTS:</b> i VTS-områden ska fartyg rapportera in och lyssna på angiven VHF-kanal. VTS ger information men tar inte över befälhavarens ansvar.</li><li><b>Trafikseparering (regel 10):</b> följ trafikfilerna, korsa vinkelrätt. Fartyg under 20 m får inte hindra maskindrivna fartyg i trafikfilen.</li><li><b>Dagbok:</b> för anteckningar om resan, händelser och övningar enligt reglerna för fartyget.</li></ul>
<p>Repetera sjövägsreglerna och mörkernavigeringen i kustskepparkursen. De är samma för yrkessjöfart.</p>`,
 c:[{q:'Tar VTS över befälhavarens ansvar för navigeringen?',o:['Nej','Ja','Ja, i hamnar','Bara på natten'],a:0,e:'VTS informerar och övervakar.'}]}
]},
{t:'Stabilitet',ls:[
 {id:'b-4-1',t:'G, B, M och GM',b:`
<div class="fig">${figGBM()}</div>
<ul><li><b>G</b>, tyngdpunkten: där fartygets samlade vikt verkar.</li><li><b>B</b>, flytkraftens centrum: tyngdpunkten för den undanträngda vattenvolymen.</li><li><b>M</b>, metacentrum: där flytkraftens linje skär mittlinjen vid liten krängning.</li><li><b>GM</b>, metacenterhöjden: om M ligger över G rätar fartyget upp sig. Större GM ger styvare fartyg.</li></ul>
<h3>Det som försämrar stabiliteten</h3><ul><li>Vikt högt upp, t.ex. last på däck eller passagerare som samlas uppe.</li><li><b>Fri vätskeyta</b> i delvis fyllda tankar eller vatten på däck.</li><li><b>Is</b> på däck och överbyggnad.</li><li>Öppningar som låter vatten komma in.</li></ul>
<p>Följ fartygets stabilitetshandlingar och lastbegränsningar.</p>`,
 c:[{q:'Vad gör is på överbyggnaden med stabiliteten?',o:['Höjer tyngdpunkten och minskar GM','Ökar GM','Påverkar inte','Sänker tyngdpunkten'],a:0,e:'Vikt högt upp försämrar stabiliteten.'}]}
]},
{t:'Brand och livräddning',ls:[
 {id:'b-5-1',t:'Brand',b:`
<p>Brand kräver <b>bränsle, syre och värme</b>. Ta bort en av dem så slocknar branden.</p>
<h3>Brandklasser och släckmedel</h3><ul><li><b>A:</b> fasta material (trä, textil). Vatten, skum, pulver.</li><li><b>B:</b> brännbara vätskor (bensin, olja). Skum, pulver, koldioxid. Inte vatten.</li><li><b>C:</b> gaser (gasol). Stäng gasen, pulver.</li><li><b>D:</b> metaller. Specialpulver.</li><li><b>F:</b> matoljor. Brandfilt eller specialsläckare. Aldrig vatten.</li><li><b>Elektrisk utrustning:</b> bryt strömmen, koldioxid eller pulver.</li></ul>
<h3>Vid brand</h3><ol><li>Larma alla ombord och ge MAYDAY eller PAN PAN beroende på läget.</li><li>Stäng luckor och ventilation för att strypa syret.</li><li>Släck om det kan ske säkert.</li><li>Förbered evakuering.</li></ol>`,
 c:[{q:'Vilket släckmedel ska du aldrig använda på brinnande matolja?',o:['Vatten','Brandfilt','Specialsläckare för klass F','Lock'],a:0,e:'Vatten förångas explosionsartat.'}]},
 {id:'b-5-2',t:'Livräddning och evakuering',b:`
<ul><li><b>Mönstringslista:</b> visar vad var och en ska göra vid nödsituation.</li><li><b>Övningar:</b> brand- och evakueringsövningar regelbundet.</li><li><b>Livflotte:</b> har en <b>hydrostatisk utlösare</b> som frigör den om fartyget sjunker. Flotten blåses upp när linan rycks ut. Gå torrskodd från fartyget till flotten om det går.</li><li><b>Överlevnadsdräkt och flytvästar:</b> rätt storlek, lätt åtkomliga.</li><li><b>Helikopterräddning:</b> följ besättningens instruktioner, rör inte vinschlinan innan den jordats mot vattnet eller däcket.</li></ul>`,
 c:[{q:'Vad gör den hydrostatiska utlösaren på en livflotte?',o:['Frigör flotten automatiskt om fartyget sjunker','Blåser upp flotten på däck','Larmar räddningstjänsten','Tömmer flotten på vatten'],a:0,e:'Den löser ut vid ett visst vattentryck.'}]}
]}
];

LESSONS.morker=[
{t:'Förbered dig för mörker',ls:[
 {id:'m-1-1',t:'Båtpraktik mörker',b:`
<p>Båtpraktik mörker är en handledd övning med någon som har minst kustskepparintyg. Den rekommenderas för dig som har kustskepparintyget och ska börja köra i mörker. Teorin finns i kustskepparkursen, och den här kursen samlar det du behöver för mörker.</p>
<h3>Före avfärd</h3><ul><li>Kontrollera att alla lanternor fungerar.</li><li>Ha rött ljus för sjökort och instrument, och ställ plottern i nattläge.</li><li>Ha pannlampa, ficklampa och sökarljus.</li><li>Planera rutten med alla fyrar och märken i ordning (se lektionen om styr-, tvärs- och girmärken).</li><li>Låt ögonen vänja sig i 20–30 minuter innan du lägger ut.</li></ul>`,
 c:[{q:'Vem ska vara med som handledare vid båtpraktik mörker?',o:['Någon med minst kustskepparintyg','Vem som helst över 18 år','En polis','Ingen handledare behövs'],a:0,e:'Det ska gå att visa vid provet.'}]},
 {id:'m-1-2',t:'Identifiera ljus systematiskt',sim:'sim-nattpraktik',b:`
<ol><li><b>Färg:</b> vitt, rött, grönt eller gult?</li><li><b>Rytm:</b> fast, blixtar, ockulterande eller isofas?</li><li><b>Antal:</b> räkna blixtarna i en grupp.</li><li><b>Period:</b> ta tid från början av en grupp till början av nästa, gärna två gånger.</li><li><b>Riktning:</b> ta en bäring och jämför med sjökortet.</li><li><b>Styrka:</b> ett starkt ljus kan vara en fyr långt bort, ett svagt kan vara en boj nära. Lita inte på intrycket av avståndet.</li></ol>
<p>Fasta, gulaktiga ljus är oftast hus, vägar eller bryggor. Rörliga ljus som ändrar bäring är oftast båtar: titta efter lanternor.</p>`,
 c:[{q:'Du ser ett starkt vitt ljus som blinkar tre gånger var 10:e sekund. Vad gör du först?',o:['Tar bäring och letar i sjökortet efter en fyr med Fl(3) 10s','Styr rakt mot det','Antar att det är en båt','Struntar i det'],a:0,e:'Karaktär och bäring tillsammans identifierar fyren.'}]}
]},

function findLesson(cid,lid){
  const mods=LESSONS[cid]||[];for(let mi=0;mi<mods.length;mi++){const ls=mods[mi].ls;for(let li=0;li<ls.length;li++)if(ls[li].id===lid)return {cid,mi,li,m:mods[mi],l:ls[li]}}
  return null;
}
function flatLessons(cid){return (LESSONS[cid]||[]).flatMap(m=>m.ls)}
function nextLessonId(cid){const all=flatLessons(cid);const n=all.find(l=>!prog[l.id]);return n?n.id:null}
function courseProgress(cid){const all=flatLessons(cid);return {done:all.filter(l=>prog[l.id]).length,total:all.length}}
function simCard(sid){const s=SIMS.find(x=>x.id===sid);return `<button class="course" data-sim="${sid}">${ICON[s.icon]}<span><b>${s.name}</b><small>${s.sub}</small><span class="best">${best[sid]||'Inte övad än'}</span></span></button>`}
