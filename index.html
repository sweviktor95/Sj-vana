<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sjövana</title>
<meta name="description" content="Sjövana – lär dig och öva båt- och fartygsintyg: förarintyg, kustskeppare, radar, mörkernavigering, SRC, LRC, ICC och fartygsbefäl klass VIII.">
<meta name="theme-color" content="#0b2236">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sjövana">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;font-family:system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: chart-legend course list and simulator list, then a single-column quiz or sim card like a pilot's notebook page */
:root{
  --bg:#e9f0f3; --surface:#f8fbfc; --ink:#0f2433; --muted:#4f6676; --line:#c3d3dc;
  --sea:#1f5f8b; --sea-soft:#d6e6f0; --good:#1d7a4a; --good-soft:#dcefe3; --bad:#b3261e; --bad-soft:#f6dedb; --warn:#a86400;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1820; --surface:#11232e; --ink:#e3eef3; --muted:#93aab8; --line:#24404f;
  --sea:#6fb3e0; --sea-soft:#163447; --good:#5fcf8f; --good-soft:#123425; --bad:#f08a80; --bad-soft:#3a1a18; --warn:#f0b35a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1820; --surface:#11232e; --ink:#e3eef3; --muted:#93aab8; --line:#24404f;
  --sea:#6fb3e0; --sea-soft:#163447; --good:#5fcf8f; --good-soft:#123425; --bad:#f08a80; --bad-soft:#3a1a18; --warn:#f0b35a; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:2.6rem;text-transform:uppercase}
h2{font-size:1.6rem}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
header{display:flex;flex-direction:column;gap:6px;border-bottom:2px solid var(--ink);padding-bottom:14px}
header p{margin:0;color:var(--muted);max-width:52ch}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{all:unset;cursor:pointer;font-family:var(--display);font-size:1.2rem;font-weight:600;padding:6px 14px;border-bottom:3px solid transparent;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--sea)}
.tab:focus-visible{outline:3px solid var(--sea)}
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.course{all:unset;cursor:pointer;display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;
  background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;transition:border-color .15s,transform .15s}
.course:hover{border-color:var(--sea);transform:translateY(-1px)}
.course:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.course svg{width:44px;height:44px}
.course b{font-family:var(--display);font-size:1.35rem;font-weight:600;display:block;line-height:1.15}
.course small{color:var(--muted);font-size:.85rem;display:block}
.best{font-family:var(--mono);font-size:.75rem;color:var(--sea);margin-top:6px;display:block}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls label{font-size:.9rem;color:var(--muted)}
select,button.btn{font:inherit;font-size:.95rem;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px}
button.btn{cursor:pointer;min-height:40px}
button.btn:disabled{opacity:.45;cursor:default}
button.primary{background:var(--sea);color:var(--surface);border-color:var(--sea);font-weight:700}
button.btn:focus-visible,select:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.track{height:6px;background:var(--sea-soft);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:var(--sea);transition:width .3s}
.q{font-size:1.15rem;font-weight:700;margin:0}
code{font-family:var(--mono);font-size:.9em;background:var(--sea-soft);padding:1px 5px;border-radius:3px}
.fig{display:flex;justify-content:center;padding:8px;background:var(--sea-soft);border-radius:4px}
.fig svg{max-width:100%;height:auto}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{all:unset;cursor:pointer;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.opt:hover:not([disabled]){border-color:var(--sea)}
.opt:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.opt .k{font-family:var(--mono);font-size:.8rem;color:var(--muted);padding-top:2px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.ex{border-left:3px solid var(--sea);padding:4px 0 4px 12px;margin:0}
.ex strong{display:block;font-family:var(--display);font-size:1.15rem}
.ex.good{border-color:var(--good)} .ex.bad{border-color:var(--bad)}
.score{font-family:var(--display);font-size:4rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.review{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.review li{border-top:1px solid var(--line);padding-top:10px;font-size:.92rem}
.tag{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
.tag.ok{color:var(--good)}.tag.no{color:var(--bad)}
.foot{font-size:.8rem;color:var(--muted)}
canvas{display:block;width:100%;max-width:100%;border-radius:4px;touch-action:manipulation}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.readout div{background:var(--sea-soft);border-radius:4px;padding:8px 10px}
.readout span{display:block;font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout b{font-family:var(--mono);font-size:1.15rem;font-variant-numeric:tabular-nums}
.readout .alert b{color:var(--bad)}
.helm{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.helm .btn{padding:10px 4px}
.slider{display:grid;grid-template-columns:70px 1fr 64px;gap:10px;align-items:center;font-size:.9rem}
.slider output{font-family:var(--mono);text-align:right}
input[type=range]{width:100%;accent-color:var(--sea)}
.brief{margin:0;color:var(--ink)}
.stopwatch{font-family:var(--mono);font-size:2rem;font-variant-numeric:tabular-nums;text-align:center}
@media (max-width:420px){.helm{grid-template-columns:repeat(2,1fr)}}
.lesson h2{font-size:2rem}
.lbody{max-width:65ch}
.lbody h3{font-family:var(--display);font-size:1.3rem;margin:18px 0 6px}
.lbody p{margin:0 0 10px}
.lbody ul,.lbody ol{margin:0 0 10px;padding-left:22px}
.lbody li{margin:3px 0}
.lbody .fig{margin:0 0 12px}
.key{background:var(--sea-soft);border-left:3px solid var(--sea);padding:10px 12px;border-radius:0 4px 4px 0}
.figrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;background:var(--sea-soft);padding:8px;border-radius:4px;margin:0 0 12px}
.figrow svg{max-width:100%;height:auto}
.checks{display:flex;flex-direction:column;gap:16px;border-top:2px solid var(--ink);padding-top:14px}
.check{display:flex;flex-direction:column;gap:8px}
.mods{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.mods>li{border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.modhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--display);font-size:1.25rem}
.lessons{list-style:none;margin:6px 0 0;padding:0}
.lrow{all:unset;cursor:pointer;display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:center;padding:6px 4px;width:100%;box-sizing:border-box;border-radius:4px}
.lrow:hover{background:var(--sea-soft)}
.lrow:focus-visible{outline:3px solid var(--sea)}
.chk{width:20px;height:20px;border:1.5px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:.7rem;color:var(--surface)}
.chk.on{background:var(--good);border-color:var(--good)}
.chk.sim{border-color:var(--sea);color:var(--sea)}
.simtip{display:flex;flex-direction:column;gap:8px}
.rosew{display:flex;flex-direction:column;gap:10px;margin:0 0 12px}
.rosew .slider{grid-template-columns:50px 1fr 60px}
.rosew .slider label{font-size:.9rem}
.lbody h4{font-family:var(--display);font-size:1.15rem;margin:14px 0 4px}
.rose-q .btn{padding:4px 10px;min-height:32px;font-family:var(--mono);font-size:.85rem}
.chartui{display:flex;flex-direction:column;gap:8px;min-width:0}
.chartbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chartbar .btn{padding:6px 10px;min-height:36px}
.tool[aria-pressed="true"]{background:var(--sea);color:var(--surface);border-color:var(--sea)}
.grow{flex:1}
.chartwrap{overflow:auto;border:1px solid var(--line);border-radius:4px;max-height:75vh;background:#fbfbf7}
.chart{display:block;width:100%;height:auto;touch-action:manipulation;cursor:crosshair}
.chart .snd{font:italic 12px "Atkinson Hyperlegible",sans-serif;fill:#2b4c62;text-anchor:middle}
.chart .cname{font:italic 16px "Atkinson Hyperlegible",sans-serif;fill:#5a4a1e;text-anchor:middle}
.chart .clab{font:12px "Atkinson Hyperlegible",sans-serif;fill:#1d1d1d}
.chart .mlab{font:10px "JetBrains Mono",monospace;fill:#1d1d1d}
.chart .sc{font:11px "JetBrains Mono",monospace;fill:#1d1d1d}
.chart .plab{font:9px "JetBrains Mono",monospace;fill:#1f5f8b}
.chart .olab{font:13px "JetBrains Mono",monospace;fill:#1f5f8b}
.chart .ttl{font:700 17px "Barlow Condensed",sans-serif;fill:#1d1d1d;letter-spacing:.06em}
.ctask,.dtask{display:flex;flex-direction:column;gap:10px;min-width:0}
.dsvg{width:100%;max-width:420px;display:block;margin:0 auto;touch-action:none;border-radius:4px}
.dsvg .dlab{font:11px "JetBrains Mono",monospace;fill:var(--ink)}
.tablewrap{overflow-x:auto}
.ptable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.92rem}
.ptable th,.ptable td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top}
.devtab td,.devtab th{white-space:nowrap;font-family:var(--mono);font-size:.8rem}
.timer{font-family:var(--mono);font-size:.9rem}
.opt.sel{border-color:var(--sea);background:var(--sea-soft)}
.extra{border:1px dashed var(--line);border-radius:4px;padding:8px 12px;margin:0 0 12px}
.extra summary{cursor:pointer;font-weight:700;color:var(--sea)}
.extra p{margin:8px 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">Övningsbank · 8 kurser · 8 simulatorer</span>
    <h1>Sjövana</h1>
    <p>Lär dig kursen lektion för lektion, öva live i simulatorerna och träna på provfrågor.</p>
  </header>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-kurser" data-go="">Kurser</button>
    <button class="tab" role="tab" id="tab-sim" data-go="simulatorer">Simulatorer</button>
  </nav>
  <main id="app"></main>
  <p class="foot">Övningsmaterial för repetition. Simulatorerna är förenklade. Kontrollera alltid mot aktuell kurslitteratur och gällande regler inför prov.</p>
</div>

<script>
// ================= helpers =================
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const tok=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const deg=r=>r*180/Math.PI, rad=d=>d*Math.PI/180;
const norm360=d=>((d%360)+360)%360, norm180=d=>{d=norm360(d);return d>180?d-360:d};
const fmtDeg=d=>String(Math.round(norm360(d))%360).padStart(3,'0')+'°';
const fmtNm=n=>n.toFixed(1).replace('.',',')+' M';
let stopSim=null;
function setupCanvas(cv,size,h=size){const dpr=window.devicePixelRatio||1;cv.width=size*dpr;cv.height=h*dpr;cv.style.height=h+'px';const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);return c}

// ================= figures =================
const OUT='var(--ink)';
const Y='#f2c200',K='#151515',R='#c8231b',G='#178a3e',WH='#ffffff';
const LW='#fff6dc',LR='#ff4a3d',LG='#3bd16f',LY='#ffc23a';
function base(){return `<rect x="30" y="150" width="40" height="6" fill="${OUT}"/>`}
function pole(bands){const h=90/bands.length;return bands.map((c,i)=>`<rect x="38" y="${60+i*h}" width="24" height="${h}" fill="${c}"/>`).join('')+`<rect x="38" y="60" width="24" height="90" fill="none" stroke="${OUT}" stroke-width="1.5"/>`}
function vpole(cols){const w=24/cols.length;return cols.map((c,i)=>`<rect x="${38+i*w}" y="60" width="${w}" height="90" fill="${c}"/>`).join('')+`<rect x="38" y="60" width="24" height="90" fill="none" stroke="${OUT}" stroke-width="1.5"/>`}
function cone(up,y,fill='#111'){return up?`<polygon points="50,${y} 40,${y+16} 60,${y+16}" fill="${fill}" stroke="${OUT}"/>`:`<polygon points="40,${y} 60,${y} 50,${y+16}" fill="${fill}" stroke="${OUT}"/>`}
const stem=`<line x1="50" y1="40" x2="50" y2="60" stroke="${OUT}" stroke-width="2"/>`;
function cardinal(d){
  const top={N:[1,1],S:[0,0],E:[1,0],W:[0,1]}[d];
  const bands={N:[K,Y],S:[Y,K],E:[K,Y,K],W:[Y,K,Y]}[d];
  return `<svg viewBox="0 0 100 160" width="100" height="160">${stem}${cone(top[0],6)}${cone(top[1],24)}${pole(bands)}${base()}</svg>`;
}
function lateral(side){
  if(side==='bb') return `<svg viewBox="0 0 100 160" width="100" height="160"><rect x="40" y="20" width="20" height="20" fill="${R}" stroke="${OUT}"/>${stem}${pole([R])}${base()}</svg>`;
  return `<svg viewBox="0 0 100 160" width="100" height="160"><polygon points="50,18 39,40 61,40" fill="${G}" stroke="${OUT}"/>${stem}${pole([G])}${base()}</svg>`;
}
function isoDanger(){return `<svg viewBox="0 0 100 160" width="100" height="160"><circle cx="50" cy="14" r="8" fill="#111" stroke="${OUT}"/><circle cx="50" cy="32" r="8" fill="#111" stroke="${OUT}"/>${stem}${pole([K,R,K])}${base()}</svg>`}
function safeWater(){return `<svg viewBox="0 0 100 160" width="100" height="160"><circle cx="50" cy="30" r="10" fill="${R}" stroke="${OUT}"/>${stem}${vpole([R,WH,R,WH])}${base()}</svg>`}
function special(){return `<svg viewBox="0 0 100 160" width="100" height="160"><g stroke="${Y}" stroke-width="6" stroke-linecap="round"><line x1="40" y1="18" x2="60" y2="38"/><line x1="60" y1="18" x2="40" y2="38"/></g>${stem}${pole([Y])}${base()}</svg>`}
function dayShapes(list){ // signal mast with shapes, top->bottom
  let y=18, s='';
  list.forEach(t=>{
    if(t==='ball') s+=`<circle cx="60" cy="${y+12}" r="12" fill="#111"/>`;
    if(t==='diamond') s+=`<polygon points="60,${y} 72,${y+12} 60,${y+24} 48,${y+12}" fill="#111"/>`;
    if(t==='cyl') s+=`<rect x="50" y="${y}" width="20" height="30" fill="#111"/>`;
    if(t==='coneUp') s+=`<polygon points="60,${y} 48,${y+22} 72,${y+22}" fill="#111"/>`;
    if(t==='coneDown') s+=`<polygon points="48,${y} 72,${y} 60,${y+22}" fill="#111"/>`;
    y+= t==='cyl'?38:30;
  });
  return `<svg viewBox="0 0 120 ${y+30}" width="120" height="${y+30}"><line x1="60" y1="6" x2="60" y2="${y+20}" stroke="${OUT}" stroke-width="2"/><line x1="30" y1="10" x2="90" y2="10" stroke="${OUT}" stroke-width="2"/>${s}<path d="M10 ${y+20} L110 ${y+20} L98 ${y+28} L22 ${y+28}Z" fill="${OUT}"/></svg>`;
}
function sectorFig(){
  return `<svg viewBox="0 0 300 200" width="300" height="200">
  <rect width="300" height="200" fill="var(--sea-soft)"/>
  <path d="M150 20 L60 200 L104 200Z" fill="#ff4a3d" opacity=".35"/>
  <path d="M150 20 L104 200 L196 200Z" fill="#ffffff" opacity=".7"/>
  <path d="M150 20 L196 200 L240 200Z" fill="#3bd16f" opacity=".35"/>
  <line x1="150" y1="20" x2="150" y2="200" stroke="${OUT}" stroke-dasharray="4 4"/>
  <circle cx="150" cy="20" r="7" fill="#f5c400" stroke="${OUT}"/>
  <text x="160" y="24" font-family="JetBrains Mono" font-size="11" fill="${OUT}">Fyr</text>
  <g transform="translate(88,150)"><path d="M0 -12 L6 6 L-6 6Z" fill="${OUT}"/></g>
  <text x="70" y="186" font-family="JetBrains Mono" font-size="11" fill="${OUT}">Du</text>
  <text x="62" y="120" font-family="JetBrains Mono" font-size="11" fill="${OUT}">R</text>
  <text x="146" y="150" font-family="JetBrains Mono" font-size="11" fill="${OUT}">W</text>
  <text x="222" y="120" font-family="JetBrains Mono" font-size="11" fill="${OUT}">G</text></svg>`;
}
function cevniA1(){return `<svg viewBox="0 0 160 110" width="160" height="110"><rect x="10" y="10" width="140" height="90" fill="${R}" stroke="${OUT}" stroke-width="2"/><rect x="10" y="44" width="140" height="22" fill="#fff"/></svg>`}
function radarFig(){
  let s=`<svg viewBox="0 0 220 220" width="220" height="220"><circle cx="110" cy="110" r="105" fill="#041a12"/>`;
  [35,70,105].forEach(r=>s+=`<circle cx="110" cy="110" r="${r}" fill="none" stroke="#1d5a3c"/>`);
  s+=`<line x1="110" y1="110" x2="110" y2="5" stroke="#2f8a5a"/>`;
  [[165,40,.25],[158,51,.4],[151,62,.6],[144,73,1]].forEach(([x,y,o])=>s+=`<circle cx="${x}" cy="${y}" r="4" fill="#ffb238" opacity="${o}"/>`);
  [[50,30,.25],[56,46,.4],[62,62,.6],[68,78,1]].forEach(([x,y,o])=>s+=`<circle cx="${x}" cy="${y}" r="4" fill="#ffb238" opacity="${o}"/>`);
  s+=`<text x="150" y="88" font-family="JetBrains Mono" font-size="12" fill="#ffd27a">A</text><text x="74" y="92" font-family="JetBrains Mono" font-size="12" fill="#ffd27a">B</text><circle cx="110" cy="110" r="3" fill="#7dffb0"/></svg>`;
  return s;
}

// ---- night view: lanternor ----
const VESSELS={
 power:{label:'Maskindrivet fartyg under 50 m',mast:1,ar:[],ex:'Topplanterna (vit), sidolanternor och akterlanterna.'},
 power50:{label:'Maskindrivet fartyg över 50 m',mast:2,ar:[],ex:'Två topplanternor: den aktre sitter högre än den förliga. Det avslöjar också åt vilket håll fartyget går.'},
 sail:{label:'Segelfartyg under segel',mast:0,ar:[],ex:'Bara sidolanternor och akterlanterna, ingen topplanterna.'},
 trawl:{label:'Trålare',mast:0,ar:[LG,LW],ex:'Grönt över vitt runtomlysande. Minnesregel: "grönt över vitt, trålar med mitt".'},

function nightView(type,aspect){
  const L=[],T=VESSELS[type];
  const bow=aspect==='port'?-1:aspect==='stbd'?1:0, side=bow!==0;
  if(type==='anchor'){L.push([150,90,LW])}
  else{
    T.ar.forEach((c,i)=>L.push([150,24+i*18,c]));
    if(aspect!=='stern'){
      const mx=side?150+bow*30:150;
      if(T.mast===1) L.push([mx,88,LW]);
      if(T.mast===2){L.push([mx,88,LW]);L.push([side?150-bow*40:153,60,LW])}
      if(T.mast==='tow'){L.push([mx,66,LW]);L.push([mx,88,LW])}
    }
    if(aspect==='head'){L.push([136,114,LG]);L.push([164,114,LR])}
    if(aspect==='port')L.push([150+bow*12,114,LR]);
    if(aspect==='stbd')L.push([150+bow*12,114,LG]);
    if(aspect==='stern'){L.push([150,120,LW]);if(type==='tow')L.push([150,104,LY])}
  }
  return `<svg viewBox="0 0 300 160" width="300" height="160"><defs><linearGradient id="nsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030a10"/><stop offset="1" stop-color="#0b1c28"/></linearGradient></defs><rect width="300" height="160" fill="url(#nsky)"/><rect y="138" width="300" height="22" fill="#040d14"/><line x1="0" y1="138" x2="300" y2="138" stroke="#1a3446"/>${L.map(([x,y,c])=>`<circle cx="${x}" cy="${y}" r="14" fill="${c}" opacity=".18"/><circle cx="${x}" cy="${y}" r="4.5" fill="${c}"/>`).join('')}</svg>`;
}
function validCombos(){
  const out=[];
  Object.keys(VESSELS).forEach(t=>{
    if(t==='anchor'){out.push([t,'anchor']);return}
    Object.keys(ASPECTS).forEach(a=>{
      if(a==='stern'&&['power','power50','sail'].includes(t))return;
      out.push([t,a]);
    });
  });
  return out;
}

// ================= routing =================
function route(){
  if(stopSim){stopSim();stopSim=null}
  const h=location.hash.slice(1);
  const simTab=h.startsWith('sim');
  $('#tab-kurser').setAttribute('aria-selected',String(!simTab));
  $('#tab-sim').setAttribute('aria-selected',String(simTab));
  if(h==='simulatorer') return simHome();
  if(h==='sim-vajning') return simVajning();
  if(h==='sim-radar') return simRadar();
  if(h==='sim-lanternor') return simLanternor();
  if(h==='sim-fyr') return simFyr();
  if(h==='sim-dagpraktik') return simPraktik(false);
  if(h==='sim-nattpraktik') return simPraktik(true);
  if(h.startsWith('kurs-')) return courseView(h.slice(5));
  if(h.startsWith('prov-')) return examIntro(h.slice(5));
  if(h==='sim-sjokort') return simSjokort();
  if(h==='sim-ritvajning') return simRitvajning();
  if(h.startsWith('lek-')){const r=h.slice(4),cid=r.split('-')[0];return lessonView(cid,r.slice(cid.length+1))}
  home();
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{location.hash=t.dataset.go; if(!t.dataset.go) route()});
window.addEventListener('hashchange',route);
const go=h=>{if(location.hash.slice(1)===h)route();else location.hash=h};

// ================= quiz =================
let S=null;
function home(){
  S=null;
  app.innerHTML=`<div class="wrap" style="gap:14px">
  <div class="courses">${COURSES.map(c=>{const b=best[c.id];return `<button class="course" data-id="${c.id}">${ICON[c.id]}<span><b>${c.name}</b><small>${c.sub}</small>${LESSONS[c.id]?`<span class="best">Kurs: ${courseProgress(c.id).done} av ${courseProgress(c.id).total} lektioner</span>`:''}<span class="best">${b!=null?`Bästa: ${b} %`:'Inte övad än'}</span></span></button>`}).join('')}</div></div>`;
  app.querySelectorAll('.course').forEach(el=>el.onclick=()=>go('kurs-'+el.dataset.id));
}
function start(id,n){
  const c=COURSES.find(x=>x.id===id);
  const qs=shuffle(c.qs).slice(0,n).map(q=>({...q,order:shuffle(q.o.map((_,i)=>i))}));
  S={c,qs,i:0,answers:[]}; render(); window.scrollTo({top:0});
}
function render(){
  const {c,qs,i}=S, q=qs[i], done=S.answers.length>i, pick=S.answers[i];
  app.innerHTML=`<section class="card">
   <div class="topbar"><span class="eyebrow">${c.name} · fråga ${i+1} av ${qs.length}</span><button class="btn" id="quit">Avsluta</button></div>
   <div class="track"><i style="width:${(i/qs.length)*100}%"></i></div>
   <p class="q">${q.q}</p>
   ${q.fig?`<div class="fig">${q.fig()}</div>`:''}
   <div class="opts">${q.order.map((oi,k)=>{let cls='';if(done){if(oi===q.a)cls='right';else if(oi===pick)cls='wrong'}
     return `<button class="opt ${cls}" data-oi="${oi}" ${done?'disabled':''}><span class="k">${'ABCD'[k]}</span><span>${q.o[oi]}</span></button>`}).join('')}</div>
   ${done?`<p class="ex ${pick===q.a?'good':'bad'}"><strong>${pick===q.a?'Rätt':'Fel'}</strong>${q.e}</p>
   <div class="controls"><button class="btn primary" id="next">${i+1<qs.length?'Nästa fråga':'Se resultat'}</button></div>`:''}
  </section>`;
  $('#quit').onclick=()=>courseView(c.id);
  if(!done) app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{S.answers[i]=+b.dataset.oi;render();$('#next')?.focus()});
  else $('#next').onclick=()=>{S.i++; S.i<qs.length?render():result()};
}
function result(){
  const {c,qs,answers}=S; const right=qs.filter((q,i)=>answers[i]===q.a).length; const pct=Math.round(right/qs.length*100);
  if(best[c.id]==null||pct>best[c.id]){best[c.id]=pct;saveBest()}
  app.innerHTML=`<section class="card">
   <span class="eyebrow">${c.name} · resultat</span>
   <div><span class="score">${right}/${qs.length}</span></div>
   <p style="margin:0">${pct>=80?'Godkänd nivå. Kör igen för att se frågorna i ny ordning.':pct>=60?'Nära. Läs förklaringarna nedan och kör ett pass till.':'Gå igenom förklaringarna och försök igen.'}</p>
   <div class="controls"><button class="btn primary" id="again">Kör igen</button><button class="btn" id="back">Till kursen</button></div>
   <ul class="review">${qs.map((q,i)=>`<li><span class="tag ${answers[i]===q.a?'ok':'no'}">${answers[i]===q.a?'Rätt':'Fel'}</span><br>${q.q}<br><b>${q.o[q.a]}</b></li>`).join('')}</ul>
  </section>`;
  $('#again').onclick=()=>start(c.id,qs.length);
  $('#back').onclick=()=>courseView(c.id);
}

function bumpBest(id,val){ // val string "x/y" compare numeric ratio

    c.beginPath();c.moveTo(0,0);c.lineTo(W,0);c.lineTo(W,10);c.lineTo(0,10);c.fill();
    c.beginPath();c.moveTo(0,0);c.lineTo(22,0);c.lineTo(8,SH);c.lineTo(0,SH);c.fill();
    c.beginPath();c.moveTo(W,0);c.lineTo(W-22,0);c.lineTo(W-8,SH);c.lineTo(W,SH);c.fill();
    c.lineWidth=1;
    drawPanel(c,W,SH,H-SH,own,'RADAR 4 M',(c,x3,iy,colW,ih)=>{
      const rr=Math.min(colW,ih)/2-2,rcx=x3+colW/2,rcy=iy+ih/2,RR=4;
      c.fillStyle='#03140d';c.beginPath();c.arc(rcx,rcy,rr,0,7);c.fill();
      c.strokeStyle='#1b5236';[1,2,3,4].forEach(k=>{c.beginPath();c.arc(rcx,rcy,rr*k/RR,0,7);c.stroke()});
      c.strokeStyle='#7dffb0';c.beginPath();c.moveTo(rcx,rcy);c.lineTo(rcx,rcy-rr);c.stroke();
      const toR=(x,y)=>{const dx=x-own.x,dy=y-own.y,bb=rad(norm360(deg(Math.atan2(dx,dy))-own.h)),dd=Math.hypot(dx,dy);return dd>RR?null:[rcx+Math.sin(bb)*dd/RR*rr,rcy-Math.cos(bb)*dd/RR*rr]};
      trails.r.forEach(([x,y],i)=>{const p=toR(x+own.x,y+own.y);if(!p)return;c.globalAlpha=.25+.5*i/Math.max(1,trails.r.length);c.fillStyle='#ffb238';c.beginPath();c.arc(p[0],p[1],1.8,0,7);c.fill()});c.globalAlpha=1;
      const tp=toR(tgt.x,tgt.y);if(tp){c.fillStyle='#ffc760';c.beginPath();c.arc(tp[0],tp[1],3.2,0,7);c.fill()}
    });
  }
  function drawTop(){
    const c=ctx,W=size,cx=W/2,cy=W/2,R=4.5,s=(W/2)/R;
    const P=(x,y)=>[cx+(x-own.x)*s,cy-(y-own.y)*s];
    c.fillStyle=tok('--sea-soft');c.fillRect(0,0,W,W);
    c.strokeStyle=tok('--line');c.lineWidth=1;
    for(let r=1;r<=4;r++){c.beginPath();c.arc(cx,cy,r*s,0,Math.PI*2);c.stroke()}
    c.fillStyle=tok('--muted');c.font='11px "JetBrains Mono", monospace';
    for(let r=1;r<=4;r++)c.fillText(r+' M',cx+4,cy-r*s+12);
    c.fillText('N ↑',W-36,16);
    c.fillStyle=tok('--sea');trails.o.forEach(([x,y])=>{const[a,b]=P(x,y);c.beginPath();c.arc(a,b,2,0,7);c.fill()});
    c.fillStyle=tok('--ink');trails.t.forEach(([x,y])=>{const[a,b]=P(x,y);c.beginPath();c.arc(a,b,2,0,7);c.fill()});
    // heading line own
    c.strokeStyle=tok('--sea');c.setLineDash([4,4]);c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+Math.sin(rad(own.h))*W,cy-Math.cos(rad(own.h))*W);c.stroke();c.setLineDash([]);
    const [tx,ty]=P(tgt.x,tgt.y);
    shipPath(c,tx,ty,tgt.h,12,tok('--ink'));
    shipPath(c,cx,cy,own.h,12,tok('--sea'));
    c.fillStyle=tok('--ink');c.fillText('Fartyg',tx+12,ty-8);
    c.fillStyle=tok('--sea');c.fillText('Du',cx+12,cy+14);
  }
  function loop(ts){
    if(run){const dt=Math.min(0.1,(ts-last)/1000)*scale;last=ts;
      // substeps for stability
      const n=Math.ceil(dt/1);for(let i=0;i<n&&run;i++)step(dt/n);
      wave+=Math.min(0.1,dt/scale)*own.v/12;draw();readout();}
    else last=ts;
    raf=requestAnimationFrame(loop);
  }
  $('#go').onclick=()=>{if(done)return;run=!run;$('#go').textContent=run?'Pausa':'Fortsätt';last=performance.now()};
  $('#new').onclick=newScen;
  $('#h-port').onclick=()=>act(-10,0);$('#h-stbd').onclick=()=>act(10,0);
  $('#h-slow').onclick=()=>act(0,-2);$('#h-fast').onclick=()=>act(0,2);
  const key=e=>{if(e.key==='ArrowLeft'){act(-10,0);e.preventDefault()}if(e.key==='ArrowRight'){act(10,0);e.preventDefault()}if(e.key==='ArrowDown'){act(0,-2);e.preventDefault()}if(e.key==='ArrowUp'){act(0,2);e.preventDefault()}};
  window.addEventListener('keydown',key);
  const rs=()=>{ctx=fit();draw()};window.addEventListener('resize',rs);
  newScen();setView('bridge');raf=requestAnimationFrame(loop);
  stopSim=()=>{cancelAnimationFrame(raf);window.removeEventListener('keydown',key);window.removeEventListener('resize',rs)};
}

// ================= SIM: Radar =================
function simRadar(){
  const RANGE=6, VO=12, SCALE=15;
  let echoes,t,run,last,raf,size,sweep=0,phase,clutter=[],sea=0.5,ebl=0,vrm=3,ans={};
  simShell('Radarplott',`
   <p class="brief">Egen båt går 12 knop, kurs 000°. Radarn visar <b>relativ rörelse, north up</b>, 6 M räckvidd med ringar varje M. Följ ekona i 6 minuter och bedöm sedan.</p>
   <canvas id="cv" aria-label="Radarbild"></canvas>
   <div class="slider"><label for="ebl">EBL</label><input type="range" id="ebl" min="0" max="359" value="0"><output id="o-ebl">000°</output></div>
   <div class="slider"><label for="vrm">VRM</label><input type="range" id="vrm" min="0.2" max="6" step="0.1" value="3"><output id="o-vrm">3,0 M</output></div>
   <div class="slider"><label for="sea">Sea</label><input type="range" id="sea" min="0" max="1" step="0.05" value="0.5"><output id="o-sea">50 %</output></div>
   <div class="controls"><button class="btn primary" id="go">Starta plottning</button><button class="btn" id="new">Ny situation</button><span class="foot" id="clock">0:00 av 6:00</span></div>
   <div id="out"></div>`);
  const cv=$('#cv');
  function fit(){size=Math.min(cv.parentElement.clientWidth-40,500);return setupCanvas(cv,size)}
  let ctx=fit();
  function mkEcho(label,kind){
    let p,v;
    if(kind==='collision'||kind==='near'||kind==='pass'){
      const b=rad(pickOne([rnd(20,80),rnd(280,340),rnd(100,150)])), r=rnd(4.6,5.6);
      p={x:r*Math.sin(b),y:r*Math.cos(b)};
      const sp=rnd(10,20); const dir={x:-p.x/r,y:-p.y/r};
      const off= kind==='collision'?rnd(-0.08,0.08): kind==='near'?pickOne([-1,1])*rnd(0.9,1.3):pickOne([-1,1])*rnd(1.6,2.6);
      // aim at a point offset perpendicular
      const perp={x:-dir.y,y:dir.x}; const aim={x:perp.x*off,y:perp.y*off};
      const L=Math.hypot(aim.x-p.x,aim.y-p.y); v={x:(aim.x-p.x)/L*sp,y:(aim.y-p.y)/L*sp};
    } else { // fixed object
      p={x:pickOne([-1,1])*rnd(0.9,2.2),y:rnd(3.5,5.2)}; v={x:0,y:-VO};
    }
    return {label,kind,p0:{...p},p,v,hist:[]};
  }
  function cpaOf(e){const vv=e.v.x**2+e.v.y**2;const tc=-(e.p0.x*e.v.x+e.p0.y*e.v.y)/vv;const x=e.p0.x+e.v.x*tc,y=e.p0.y+e.v.y*tc;return {cpa:Math.hypot(x,y),tcpa:tc}}
  function newSit(){
    const noRisk=Math.random()<0.25;
    const kinds=shuffle([noRisk?'near':'collision','pass','fixed']);
    echoes=kinds.map((k,i)=>mkEcho('ABC'[i],k));
    t=0;run=false;phase='idle';ans={};
    $('#out').innerHTML='';$('#go').disabled=false;$('#go').textContent='Starta plottning';$('#clock').textContent='0:00 av 6:00';
    draw();
  }
  function step(dt){
    t+=dt;const h=dt/3600;
    echoes.forEach(e=>{e.p={x:e.p.x+e.v.x*h,y:e.p.y+e.v.y*h};if(Math.floor(t/30)!==Math.floor((t-dt)/30)){e.hist.push({...e.p});if(e.hist.length>12)e.hist.shift()}});
    const m=Math.floor(t/60),s=Math.floor(t%60);$('#clock').textContent=`${m}:${String(s).padStart(2,'0')} av 6:00`;
    if(t>=360){run=false;phase='q1';ask()}
  }
  function ask(){
    $('#go').disabled=true;
    const q1=`<p class="q">Vilket eko innebär kollisionsrisk (CPA under 0,5 M)?</p><div class="opts" id="q1">${['A','B','C','Inget'].map(l=>`<button class="opt" data-v="${l}"><span class="k">${l==='Inget'?'–':l}</span><span>${l==='Inget'?'Inget eko':'Eko '+l}</span></button>`).join('')}</div>`;
    $('#out').innerHTML=q1;
    $('#q1').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ans.q1=b.dataset.v;ask2()});
  }
  function ask2(){
    $('#out').innerHTML=`<p class="q">Vilket eko är troligen ett fast föremål, till exempel en ö eller ett sjömärke?</p><div class="opts" id="q2">${['A','B','C'].map(l=>`<button class="opt" data-v="${l}"><span class="k">${l}</span><span>Eko ${l}</span></button>`).join('')}</div>`;
    $('#q2').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ans.q2=b.dataset.v;reveal()});
  }
  function reveal(){
    phase='reveal';
    const coll=echoes.find(e=>e.kind==='collision'), fixed=echoes.find(e=>e.kind==='fixed');
    const c1=coll?coll.label:'Inget', ok1=ans.q1===c1, ok2=ans.q2===fixed.label;
    const rows=echoes.map(e=>{const r=cpaOf(e);return `Eko ${e.label}: CPA ${fmtNm(r.cpa)}${r.tcpa>0?`, om ${Math.round(r.tcpa*60-6)} min`:''}`}).join('<br>');
    const score=(ok1?1:0)+(ok2?1:0);
    const rec=best['sim-radar-tally']||{ok:0,n:0};rec.n+=2;rec.ok+=score;best['sim-radar-tally']=rec;best['sim-radar']=`${rec.ok}/${rec.n} rätt`;saveBest();
    $('#out').innerHTML=`<p class="ex ${ok1?'good':'bad'}"><strong>Kollisionsrisk: ${ok1?'rätt':'fel'}</strong>${coll?`Eko ${coll.label} hade konstant bäring och minskande avstånd. Dess relativa spår pekar rakt mot centrum.`:'Inget eko hade relativt spår genom centrum. Det närmaste passerade med mer än 0,5 M.'} Lägg EBL på ekot: står det kvar på linjen när avståndet minskar, föreligger kollisionsrisk.</p>
     <p class="ex ${ok2?'good':'bad'}"><strong>Fast föremål: ${ok2?'rätt':'fel'}</strong>Eko ${fixed.label} rörde sig rakt nedåt (180°) med 12 knop, alltså motsatt din egen kurs och fart. Så ser ett stillastående föremål ut i relativ visning.</p>
     <p class="ex">${rows}<br>De streckade linjerna i bilden visar varje ekos förlängda relativa spår.</p>
     <div class="controls"><button class="btn primary" id="again">Ny situation</button><span class="foot">${best['sim-radar']}</span></div>`;
    $('#again').onclick=newSit;
    draw();
  }
  function draw(){
    const c=ctx,W=size,cx=W/2,cy=W/2,Rp=W/2-14,s=Rp/RANGE;
    c.fillStyle=tok('--surface');c.fillRect(0,0,W,W);
    c.fillStyle='#03140d';c.beginPath();c.arc(cx,cy,Rp+10,0,7);c.fill();
    c.strokeStyle='#1b5236';c.lineWidth=1;
    for(let r=1;r<=RANGE;r++){c.beginPath();c.arc(cx,cy,r*s,0,7);c.stroke()}
    // bearing ticks
    c.strokeStyle='#2e7a52';for(let b=0;b<360;b+=10){const a=rad(b);c.beginPath();c.moveTo(cx+Math.sin(a)*(Rp+(b%30?3:7)),cy-Math.cos(a)*(Rp+(b%30?3:7)));c.lineTo(cx+Math.sin(a)*(Rp+10),cy-Math.cos(a)*(Rp+10));c.stroke()}
    // heading marker
    c.strokeStyle='#7dffb0';c.beginPath();c.moveTo(cx,cy);c.lineTo(cx,cy-Rp);c.stroke();
    // clutter
    c.fillStyle='#ffb238';clutter.forEach(([x,y,o])=>{c.globalAlpha=o;c.fillRect(cx+x*s,cy-y*s,2,2)});c.globalAlpha=1;
    // echoes
    echoes.forEach(e=>{
      e.hist.forEach((p,i)=>{c.globalAlpha=0.15+0.5*i/e.hist.length;c.fillStyle='#ffb238';c.beginPath();c.arc(cx+p.x*s,cy-p.y*s,2.5,0,7);c.fill()});
      c.globalAlpha=1;
      const ex=cx+e.p.x*s,ey=cy-e.p.y*s;
      let ang=norm360(deg(Math.atan2(e.p.x,e.p.y)));let since=norm360(sweep-ang);const bright=Math.max(0.35,1-since/360);
      c.fillStyle=`rgba(255,190,70,${bright})`;c.beginPath();c.arc(ex,ey,5,0,7);c.fill();
      c.fillStyle='#ffd27a';c.font='bold 13px "JetBrains Mono", monospace';c.fillText(e.label,ex+8,ey-6);
      if(phase==='reveal'){
        c.strokeStyle='#ffd27a';c.setLineDash([5,4]);c.beginPath();c.moveTo(cx+e.p0.x*s,cy-e.p0.y*s);const far=1.6;c.lineTo(cx+(e.p0.x+e.v.x*far)*s,cy-(e.p0.y+e.v.y*far)*s);c.stroke();c.setLineDash([]);
      }
    });
    // EBL & VRM
    c.strokeStyle='#9ad7ff';c.setLineDash([8,5]);c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+Math.sin(rad(ebl))*Rp,cy-Math.cos(rad(ebl))*Rp);c.stroke();
    c.beginPath();c.arc(cx,cy,vrm*s,0,7);c.stroke();c.setLineDash([]);
    // sweep
    const a=rad(sweep);const g=c.createLinearGradient(cx,cy,cx+Math.sin(a)*Rp,cy-Math.cos(a)*Rp);
    c.strokeStyle='rgba(125,255,176,.7)';c.lineWidth=2;c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+Math.sin(a)*Rp,cy-Math.cos(a)*Rp);c.stroke();c.lineWidth=1;
    c.fillStyle='#7dffb0';c.beginPath();c.arc(cx,cy,3,0,7);c.fill();
    c.fillStyle='#5fbf8a';c.font='11px "JetBrains Mono", monospace';c.fillText('6 M · RM · N UP',10,W-8);
  }
  function regenClutter(){clutter=[];const n=Math.round((1-sea)*90);for(let i=0;i<n;i++){const r=Math.pow(Math.random(),1.6)*1.4,b=Math.random()*Math.PI*2;clutter.push([r*Math.sin(b),r*Math.cos(b),rnd(.3,.9)])}}
  function loop(ts){
    const rdt=Math.min(0.1,(ts-last)/1000);last=ts;
    const prev=sweep;sweep=norm360(sweep+rdt*144);if(sweep<prev)regenClutter();
    if(run){const dt=rdt*SCALE;const n=Math.ceil(dt/1);for(let i=0;i<n&&run;i++)step(dt/n)}
    draw();raf=requestAnimationFrame(loop);
  }
  $('#ebl').oninput=e=>{ebl=+e.target.value;$('#o-ebl').textContent=fmtDeg(ebl)};
  $('#vrm').oninput=e=>{vrm=+e.target.value;$('#o-vrm').textContent=fmtNm(vrm)};
  $('#sea').oninput=e=>{sea=+e.target.value;$('#o-sea').textContent=Math.round(sea*100)+' %';regenClutter()};
  $('#go').onclick=()=>{if(phase!=='idle'&&phase!=='run')return;phase='run';run=!run;$('#go').textContent=run?'Pausa':'Fortsätt'};
  $('#new').onclick=newSit;
  const rs=()=>{ctx=fit();draw()};window.addEventListener('resize',rs);
  regenClutter();newSit();last=performance.now();raf=requestAnimationFrame(loop);
  stopSim=()=>{cancelAnimationFrame(raf);window.removeEventListener('resize',rs)};
}

// ================= SIM: Lanternor =================
function simLanternor(){
  const all=validCombos(), ROUND=10; let cur,opts,n=0,ok=0,answered,hist=[];
  simShell('Lanternor i mörker',`
   <p class="brief">Ett fartyg syns i mörkret. Avgör vad det är och från vilket håll du ser det. Varje runda slumpas.</p>
   <div class="fig" id="night" style="background:#06121a"></div>
   <div class="opts" id="opts"></div><div id="out"></div>
   <div class="controls"><button class="btn primary" id="next">Nästa fartyg</button><span class="foot" id="tally"></span></div>`);
  function round(){
    cur=pickOne(all);answered=false;$('#next').textContent='Nästa fartyg';
    const same=all.filter(c=>c!==cur&&c[0]===cur[0]), other=all.filter(c=>c[0]!==cur[0]&&(c[1]===cur[1]||cur[0]==='anchor'));
    const d=shuffle(same).slice(0,1).concat(shuffle(other)).filter((c,i,a)=>a.findIndex(x=>comboLabel(x)===comboLabel(c))===i&&comboLabel(c)!==comboLabel(cur)).slice(0,3);
    while(d.length<3){const c=pickOne(all);if(comboLabel(c)!==comboLabel(cur)&&!d.some(x=>comboLabel(x)===comboLabel(c)))d.push(c)}
    opts=shuffle([cur,...d]);
    $('#night').innerHTML=nightView(cur[0],cur[1]==='anchor'?'head':cur[1]);
    $('#opts').innerHTML=opts.map((c,k)=>`<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${comboLabel(c)}</span></button>`).join('');
    $('#out').innerHTML='';$('#next').hidden=true;
    $('#opts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
    tally();
  }
  function answer(k){
    if(answered)return;answered=true;n++;const right=opts[k]===cur;if(right)ok++;hist.push({cur,pick:opts[k],right});
    $('#opts').querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(opts[i]===cur)b.classList.add('right');else if(i===k)b.classList.add('wrong')});
    const T=VESSELS[cur[0]];$('#next').textContent=n>=ROUND?'Se resultat':'Nästa fartyg';
    $('#out').innerHTML=`<p class="ex ${right?'good':'bad'}"><strong>${right?'Rätt':'Fel'}</strong>${T.ex} ${cur[0]!=='anchor'?ASPECT_EX[cur[1]]:''}</p>`;
    $('#next').hidden=false;$('#next').focus();
    best['sim-lanternor']=`${ok}/${n} rätt`;saveBest();tally();
  }
  const tally=()=>$('#tally').textContent=`Fartyg ${Math.min(n+(answered?0:1),ROUND)} av ${ROUND}`;
  function summary(){
    const wrong=hist.filter(h=>!h.right);
    $('#night').innerHTML='';$('#opts').innerHTML='';$('#next').hidden=true;
    $('#out').innerHTML=`<div class="card" style="padding:16px;gap:10px"><span class="eyebrow">Omgången är klar</span><div class="score">${ok}/${ROUND}</div>
     ${wrong.length?`<div><b>Det här blev fel, och varför</b><ul style="margin:6px 0 0;padding-left:20px">${wrong.map(h=>`<li>Du svarade "${comboLabel(h.pick)}" men det var <b>${comboLabel(h.cur)}</b>. ${VESSELS[h.cur[0]].ex} ${h.cur[0]!=='anchor'?ASPECT_EX[h.cur[1]]:''}</li>`).join('')}</ul></div>`:'<p class="ex good"><strong>Alla rätt</strong>Du känner igen lanternorna säkert.</p>'}
     <div class="controls"><button class="btn primary" id="again">Ny omgång</button></div></div>`;
    $('#again').onclick=()=>{n=0;ok=0;hist=[];round()};
  }
  $('#next').onclick=()=>n>=ROUND?summary():round();round();
}

   'LFl':()=>'En lång blixt var tionde sekund betyder <b>mittledsmärke</b>: säkert vatten runt märket. Det står ofta där en farled börjar ute till havs (angöring) eller mitt i farleden.',
   'Oc':c=>c==='W'?'Ockulterande vitt ljus är vanligt på <b>sektorfyrar och ledfyrar</b> i Sverige. Ljuset är tänt det mesta av tiden, så det är lätt att hålla ögonen på och styra efter. Byter det färg till rött eller grönt har du kommit ut ur den vita ledsektorn.':`${c==='R'?'Röd':'Grön'} ockulterande ljus ser du ofta när du är i en ${c==='R'?'röd':'grön'} sektor på en sektorfyr. Det betyder att du har kommit ur den vita ledsektorn, mot grundare vatten. Styr tillbaka in i det vita.`,
   'Oc(2)':()=>'Ockulterande i grupp används på större fyrar och sektorfyrar, ofta vid inlopp. Mörkerperioderna gör fyren lätt att känna igen.',
   'Iso':c=>c==='W'?'Isofas vitt ljus används ofta på <b>ensfyrar och ledfyrar</b>, och på mittledsmärken. Lika långt ljus och mörker gör det lätt att se om två ensfyrar står i linje.':`${c==='R'?'Rött':'Grönt'} isofasljus kan vara en sektor på en ledfyr eller ett ${c==='R'?'babordsmärke':'styrbordsmärke'}. Kontrollera i sjökortet.`,
   'Q':c=>c==='W'?'Vitt ljus som blinkar snabbt hela tiden är en <b>nordprick</b>. Grundet ligger söder om ljuset, passera norr om det.':`${c==='R'?'Rött':'Grönt'} snabbt blinkande ljus är ett ${c==='R'?'babordsmärke':'styrbordsmärke'} som ska märkas extra, till exempel vid en skarp krök eller där farleden delar sig.`,
   'VQ':()=>'Mycket snabbt vitt blinkande hela tiden är också en <b>nordprick</b>. Snabb och mycket snabb variant används för att skilja två närliggande kardinalmärken åt.',
   'Q(3)':()=>'Tre snabba vita blixtar är en <b>ostprick</b> (som klockan 3). Grundet ligger väster om ljuset, passera öster om det.',
   'Q(9)':()=>'Nio snabba vita blixtar är en <b>västprick</b> (som klockan 9). Grundet ligger öster om ljuset, passera väster om det.',
   'Q(6)+LFl':()=>'Sex snabba vita blixtar och en lång är en <b>sydprick</b> (som klockan 6). Grundet ligger norr om ljuset, passera söder om det. Den långa blixten finns för att du inte ska blanda ihop den med 3 eller 9.',
   'Mo(A)':()=>'Morse A (kort-lång) i vitt betyder <b>mittledsmärke</b>: säkert vatten runt märket, ofta vid angöringen till en farled.'};
  const LAMP={W:'vitt',R:'rött',G:'grönt'};
  const lab=(ch,col)=>`<code>${ch.c} ${col}${ch.cont?'':' '+ch.p+'s'}</code>`;
  const NOTE={'Q':'Oavbrutet snabbt blixtrande (ca 60/min) används t.ex. på nordprick.','VQ':'Mycket snabbt blixtrande, ca 120/min.','Q(3)':'Tre snabba blixtar = ostprick (klockan 3).','Q(9)':'Nio snabba blixtar = västprick (klockan 9).','Q(6)+LFl':'Sex snabba blixtar plus en lång = sydprick.','Mo(A)':'Morse A (· —) visas ofta av mittledsmärken.','Iso':'Isofas: lika långt ljus som mörker.','Oc':'Ockulterande: mer ljus än mörker.','Oc(2)':'Två mörkerperioder i grupp.','LFl':'Lång blixt, minst 2 s.','Fl(2)':'Två blixtar i grupp, t.ex. enstaka grund.','Fl(3)':'Tre blixtar i grupp.','Fl':'En blixt per period.'};
  const ROUND=8;let cur,col,opts,t0,raf,n=0,ok=0,answered,sw0=null,hist=[];
  simShell('Fyrkaraktärer live',`
   <p class="brief">Fyren blinkar i verklig hastighet. Ta tid på perioden med stoppuret och välj rätt karaktär.</p>
   <div class="fig" style="background:#06121a"><svg viewBox="0 0 300 200" width="300" height="200"><rect width="300" height="200" fill="#06121a"/><rect y="170" width="300" height="30" fill="#030a10"/><path d="M138 170 L142 80 H158 L162 170Z" fill="#1a2c38"/><rect x="138" y="62" width="24" height="18" fill="#22394a"/><path d="M134 62 L150 50 L166 62Z" fill="#1a2c38"/><circle id="glow" cx="150" cy="71" r="40" opacity="0"/><circle id="lamp" cx="150" cy="71" r="7" fill="#222"/></svg></div>
   <div class="stopwatch" id="sw">0,0 s</div>
   <div class="controls" style="justify-content:center"><button class="btn" id="sw-go">Starta stoppur</button><button class="btn" id="sw-reset">Nollställ</button></div>
   <div class="opts" id="opts"></div><div id="out"></div>
   <div class="controls"><button class="btn primary" id="next">Nästa fyr</button><span class="foot" id="tally"></span></div>`);
  function onAt(ch,tt){
    let x=tt%ch.p, on=true;
    for(const d of ch.seq){if(x<d)return on;x-=d;on=!on}
    return false;
  }
  function round(){
    cur=pickOne(CH);col=pickOne(cur.cols);answered=false;$('#next').textContent='Nästa fyr';
    const others=shuffle(CH.filter(c=>c!==cur&&c.cols.includes(col))).slice(0,3);
    opts=shuffle([cur,...others]);t0=performance.now();
    $('#opts').innerHTML=opts.map((c,k)=>`<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${lab(c,col)}</span></button>`).join('');
    $('#out').innerHTML='';$('#next').hidden=true;
    $('#opts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
    $('#glow').setAttribute('fill',COL[col]);
    tally();
  }
  function answer(k){
    if(answered)return;answered=true;n++;const right=opts[k]===cur;if(right)ok++;hist.push({cur,col,pick:opts[k],right});
    $('#opts').querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(opts[i]===cur)b.classList.add('right');else if(i===k)b.classList.add('wrong')});
    $('#next').textContent=n>=ROUND?'Se resultat':'Nästa fyr';
    $('#out').innerHTML=`<p class="ex ${right?'good':'bad'}"><strong>${right?'Rätt':'Fel'}: ${lab(cur,col)}</strong>${NOTE[cur.c]} ${cur.cont?'':`Perioden, från början av en grupp till början av nästa, är ${cur.p} sekunder.`}</p><p class="ex"><strong>Vad det betyder när du ser det</strong>${USE[cur.c](col)}</p>`;
    $('#next').hidden=false;best['sim-fyr']=`${ok}/${n} rätt`;saveBest();tally();
  }
  const tally=()=>$('#tally').textContent=`Fyr ${Math.min(n+(answered?0:1),ROUND)} av ${ROUND}`;
  function summary(){
    const wrong=hist.filter(h=>!h.right);$('#opts').innerHTML='';$('#next').hidden=true;
    $('#out').innerHTML=`<div class="card" style="padding:16px;gap:10px"><span class="eyebrow">Omgången är klar</span><div class="score">${ok}/${ROUND}</div>
     ${wrong.length?`<div><b>Det här blev fel, och varför</b><ul style="margin:6px 0 0;padding-left:20px">${wrong.map(h=>`<li>Du valde ${lab(h.pick,h.col)} men fyren var <b>${lab(h.cur,h.col)}</b>. ${NOTE[h.cur.c]} ${USE[h.cur.c](h.col)}</li>`).join('')}</ul></div>`:'<p class="ex good"><strong>Alla rätt</strong>Bra öga och bra tidtagning.</p>'}
     <div class="controls"><button class="btn primary" id="again">Ny omgång</button></div></div>`;
    $('#again').onclick=()=>{n=0;ok=0;hist=[];round()};
  }
  function loop(ts){
    const on=onAt(cur,(ts-t0)/1000);
    $('#lamp').setAttribute('fill',on?COL[col]:'#222');$('#glow').setAttribute('opacity',on?'.35':'0');
    if(sw0!=null)$('#sw').textContent=((ts-sw0)/1000).toFixed(1).replace('.',',')+' s';
    raf=requestAnimationFrame(loop);
  }
  $('#sw-go').onclick=()=>{if(sw0==null){sw0=performance.now();$('#sw-go').textContent='Stoppa'}else{sw0=null;$('#sw-go').textContent='Starta stoppur'}};
  $('#sw-reset').onclick=()=>{sw0=null;$('#sw').textContent='0,0 s';$('#sw-go').textContent='Starta stoppur'};
  $('#next').onclick=()=>n>=ROUND?summary():round();round();raf=requestAnimationFrame(loop);
  stopSim=()=>cancelAnimationFrame(raf);
}

// ================= shared bridge instruments =================
function drawPanel(c,W,PY,PH,own,thirdLabel,drawThird){
  c.fillStyle='#0c171e';c.fillRect(0,PY,W,PH);
  c.fillStyle='#1a2a33';c.fillRect(0,PY,W,3);
  const pad=10,colW=(W-pad*4)/3,iy=PY+pad,ih=PH-pad*2;
  // compass tape
  const x1=pad;c.fillStyle='#050c10';c.fillRect(x1,iy,colW,ih);
  c.save();c.beginPath();c.rect(x1,iy,colW,ih);c.clip();
  const pxDeg=colW/60,tapeY=iy+ih*0.62,step=pxDeg*10>30?10:pxDeg*20>30?20:30;
  c.textAlign='center';c.font='11px "JetBrains Mono", monospace';
  for(let dd=-35;dd<=35;dd++){const v=Math.round(own.h)+dd,x=x1+colW/2+(v-own.h)*pxDeg,vv=norm360(v);
    if(vv%5===0){c.strokeStyle='#9fd3b8';c.beginPath();c.moveTo(x,tapeY);c.lineTo(x,tapeY-(vv%10===0?10:5));c.stroke()}
    if(vv%step===0){c.fillStyle='#d8f5e6';const nm={0:'N',90:'E',180:'S',270:'W'}[vv];c.fillText(nm||String(vv).padStart(3,'0'),x,tapeY+14)}}
  c.restore();
  c.strokeStyle='#ffb238';c.lineWidth=2;c.beginPath();c.moveTo(x1+colW/2,iy+ih*0.45);c.lineTo(x1+colW/2,tapeY);c.stroke();c.lineWidth=1;
  c.textAlign='center';c.fillStyle='#ffb238';c.font='bold 15px "JetBrains Mono", monospace';c.fillText(fmtDeg(own.h),x1+colW/2,iy+ih*0.38);
  c.textAlign='left';c.fillStyle='#6f8e9e';c.font='9px "JetBrains Mono", monospace';c.fillText('KOMPASS',x1+5,iy+11);
  // log + rudder
  const x2=pad*2+colW;c.fillStyle='#050c10';c.fillRect(x2,iy,colW,ih);
  c.fillStyle='#6f8e9e';c.fillText('LOGG',x2+5,iy+11);
  c.textAlign='center';c.fillStyle='#d8f5e6';c.font=`bold ${Math.max(15,Math.min(30,colW/5))}px "JetBrains Mono", monospace`;
  c.fillText(own.v.toFixed(1).replace('.',',')+' kn',x2+colW/2,iy+ih*0.5);
  c.font='10px "JetBrains Mono", monospace';c.fillStyle='#9fb6c2';c.fillText('Order '+fmtDeg(own.ho)+' · '+own.vo+' kn',x2+colW/2,iy+ih*0.72);
  const rud=Math.max(-1,Math.min(1,norm180(own.ho-own.h)/30)),ry=iy+ih*0.88;
  c.strokeStyle='#33505f';c.beginPath();c.moveTo(x2+12,ry);c.lineTo(x2+colW-12,ry);c.stroke();
  c.fillStyle=rud<0?LR:LG;c.fillRect(x2+colW/2,ry-3,rud*(colW/2-12),6);c.textAlign='left';
  // third instrument
  const x3=pad*3+colW*2;
  c.save();drawThird(c,x3,iy,colW,ih);c.restore();
  c.textAlign='left';c.fillStyle='#5fbf8a';c.font='9px "JetBrains Mono", monospace';c.fillText(thirdLabel,x3+4,iy+11);
}


// ================= realistic night lights =================
function litLevel(seq,tt){const p=seq.reduce((a,b)=>a+b,0);let x=((tt%p)+p)%p,on=true;
  for(const d of seq){if(x<d){if(!on)return 0;const ramp=Math.min(d*0.3,0.08);return Math.max(0,Math.min(1,x/ramp,(d-x)/ramp))}x-=d;on=!on}return 0}
function drawLight(c,x,y,col,d,R,shape,lv,waterY,tt,seed,maxY){
  if(d>R*1.25||lv<=0)return;
  const I=(R*R)/Math.max(d*d,0.0004);
  let L=Math.max(0.04,Math.min(1,(Math.log10(I)+0.3)/2.3));
  if(d>R)L*=Math.max(0,1-(d-R)/(R*0.25));
  if(L<0.3)L*=0.78+0.22*Math.sin(tt*11+seed*7.3);
  L*=lv; if(L<=0.01)return;
  const r=0.7+L*2.8;
  c.save();c.globalCompositeOperation='lighter';
  // reflection on the water: broken shimmering streak below the waterline
  const n=Math.round(4+L*22);
  for(let i=0;i<n;i++){const yy=waterY+2+i*2.6;if(yy>maxY)break;
    const sh=0.5+0.5*Math.sin(tt*5.5+i*1.9+seed*3.1);const w=r*(1.2+i*0.12)*(0.4+sh);
    c.globalAlpha=L*0.32*(1-i/n)*(0.35+0.65*sh);c.fillStyle=col;c.fillRect(x-w/2+Math.sin(tt*3+i)*r*0.4,yy,w,1.4)}
  if(shape==='lantern'){
    const w=r*2.3,h=r*2.0;
    c.globalAlpha=0.4+L*0.55;c.shadowColor=col;c.shadowBlur=8+L*30;c.fillStyle=col;
    c.beginPath();c.ellipse(x,y,w/2,h/2,0,0,7);c.fill();
    c.shadowBlur=0;{const gr=w*(2.5+L*3),g=c.createRadialGradient(x,y,0,x,y,gr);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');c.globalAlpha=L*0.3;c.fillStyle=g;c.beginPath();c.arc(x,y,gr,0,7);c.fill()}c.fillStyle=col;
    c.globalAlpha=L*0.55;c.fillStyle='#ffffff';c.beginPath();c.arc(x,y,h*0.28,0,7);c.fill();
  } else {
    const gr=r*(3+L*6);const g=c.createRadialGradient(x,y,0,x,y,gr);
    g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');
    c.globalAlpha=0.1+L*0.4;c.fillStyle=g;c.beginPath();c.arc(x,y,gr,0,7);c.fill();
    c.globalAlpha=Math.min(1,0.35+L);c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,7);c.fill();
    if(L>0.35){c.globalAlpha=(L-0.35)*0.8;c.fillStyle='#ffffff';c.beginPath();c.arc(x,y,r*0.45,0,7);c.fill()}
  }
  c.restore();
}

// ================= SIM: Dag- och nattpraktik (farledsnavigering) =================
function simPraktik(night){
  const ID=night?'sim-nattpraktik':'sim-dagpraktik', SCALE=20, FOV=45, EX=8, EYE=2.5;
  const WP=[[0,0],[0,1.0],[0.7,1.9],[0.7,2.9],[-0.2,3.9],[-0.2,4.9]];
  const segs=[];let tot=0;
  for(let i=0;i<WP.length-1;i++){const[ax,ay]=WP[i],[bx,by]=WP[i+1],dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy);segs.push({ax,ay,dx,dy,L,s0:tot});tot+=L}
  function track(x,y){let best=null;
    segs.forEach(g=>{let t=((x-g.ax)*g.dx+(y-g.ay)*g.dy)/(g.L*g.L);t=Math.max(0,Math.min(1,t));const qx=g.ax+g.dx*t,qy=g.ay+g.dy*t,d=Math.hypot(x-qx,y-qy);
      if(!best||d<best.d){const cr=g.dx*(y-g.ay)-g.dy*(x-g.ax);best={d,s:g.s0+t*g.L,off:-cr/g.L}}});
    return best}
  function at(s,off){const g=segs.find(g=>s<=g.s0+g.L)||segs[segs.length-1];const t=(s-g.s0)/g.L;return [g.ax+g.dx*t+off*g.dy/g.L,g.ay+g.dy*t-off*g.dx/g.L]}
  const W_OFF=0.09, GROUND=0.17;
  const ST=[[0.4,'R'],[0.4,'G'],[0.85,'G'],[1.15,'R'],[1.55,'G'],[1.95,'R'],[2.3,'R'],[2.3,'G'],[2.7,'W'],[3.05,'G'],[3.35,'R'],[3.75,'G'],[4.15,'R'],[4.5,'R'],[4.5,'G'],[4.9,'G'],[5.2,'R']];
  let seed=7;const rr=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  const marks=ST.map(([s,k],i)=>{const off=k==='R'?-W_OFF:W_OFF;const[x,y]=at(s,off);return {s,k,x,y,ph:rr()*3,done:false}});
  const islands=[];
  for(let s=0.2;s<tot;s+=0.45){[-1,1].forEach(side=>{if(rr()<0.25)return;const off=side*(0.32+rr()*0.3);const[x,y]=at(s,off);islands.push({x,y,r:0.07+rr()*0.15,h:6+rr()*14})})}
  const SECT={x:0.7,y:3.7,h:14,range:9}; islands.push({x:SECT.x,y:SECT.y,r:0.06,h:5});
  const HOUSES=[];islands.forEach(o=>{if(o.r<0.1||rr()>0.45)return;const n=1+Math.floor(rr()*2);for(let i=0;i<n;i++)HOUSES.push({x:o.x+(rr()-0.5)*o.r,y:o.y+(rr()-0.5)*o.r,ph:rr()*9,col:rr()<0.7?'#ffcf8a':'#fff0d8'})});
  const end=at(tot,0), ENS=[{x:end[0],y:end[1]+0.5,h:8},{x:end[0],y:end[1]+0.8,h:16}];
  const CHAR={R:{seq:[.5,2.5],col:LR,txt:'Fl R 3s',range:2},G:{seq:[.5,2.5],col:LG,txt:'Fl G 3s',range:2},W:{seq:[.3,.7,.3,.7,.3,.7,.3,.7,.3,.7,.3,.7,.3,.7,.3,.7,.3,6.7],col:LW,txt:'Q(9) 15s',range:3}};
  const lit=(seq,tt)=>{const p=seq.reduce((a,b)=>a+b,0);let x=((tt%p)+p)%p,on=true;for(const d of seq){if(x<d)return on;x-=d;on=!on}return false};
  let own,t,run,last,raf,size,H,plotter=true,done,passed,startT,wall=0;
  simShell(night?'Nattpraktik':'Dagpraktik',`
   <p class="brief"><b>Uppgift:</b> Följ den utprickade farleden norrut till ${night?'enslinjen med två fyrar längst in':'enslinjen med två ensmärken längst in'}. Passera alla sjömärken på rätt sida. Utanför märkena är det grunt.${night?' Sektorfyren mitt på sträckan visar vitt i leden. Ljus nära dig syns starkare än de långt bort, och på öarna finns fasta gula husljus som inte är sjömärken.':''}</p>
   <div class="controls"><button class="btn primary" id="v-plot">Plotter: på</button><span class="foot">${night?'Märkena: <code>Fl R 3s</code>, <code>Fl G 3s</code>, västprick <code>Q(9) 15s</code>, sektorfyr <code>Oc WRG 6s</code>, ensfyrar <code>Iso W 4s</code>.':'Röda babordsmärken, gröna styrbordsmärken och en västprick.'}</span></div>
   <canvas id="cv" aria-label="Vy från ratten"></canvas>
   <div class="readout"><div><span>Kurs</span><b id="r-hdg"></b></div><div><span>Fart</span><b id="r-spd"></b></div><div><span>Märken passerade</span><b id="r-mk"></b></div><div><span>Tid</span><b id="r-t"></b></div></div>
   <div class="helm"><button class="btn" id="h-port">◀ 5° babord</button><button class="btn" id="h-stbd">5° styrbord ▶</button><button class="btn" id="h-slow">Fart −1 kn</button><button class="btn" id="h-fast">Fart +1 kn</button></div>
   <div class="controls"><button class="btn primary" id="go">Starta</button><button class="btn" id="new">Börja om</button><span class="foot">Tiden går 20 gånger snabbare. Piltangenterna styr också.</span></div>
   <div id="out"></div>`);
  const cv=$('#cv');
  function fit(){size=Math.min(cv.parentElement.clientWidth-40,640);H=Math.round(size*0.82);return setupCanvas(cv,size,H)}
  let ctx=fit();
  function reset(){own={x:0,y:-0.05,h:0,ho:0,v:0,vo:6};t=0;run=false;done=false;passed=0;marks.forEach(m=>{m.done=false;m.ok=null;m.clear=0});$('#out').innerHTML='';$('#go').disabled=false;$('#go').textContent='Starta';draw();readout()}
  function readout(){$('#r-hdg').textContent=fmtDeg(own.h);$('#r-spd').textContent=own.v.toFixed(1).replace('.',',')+' kn';$('#r-mk').textContent=`${passed} av ${marks.length}`;$('#r-t').textContent=`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`}
  function act(dh,dv){if(done)return;own.ho=norm360(own.ho+dh);own.vo=Math.max(0,Math.min(12,own.vo+dv));if(!run)readout()}
  function finish(ok,msg){done=true;run=false;$('#go').disabled=true;
    if(ok){const rec=best[ID+'-tally']||{ok:0,n:0};rec.n++;rec.ok++;best[ID+'-tally']=rec;best[ID]=`${rec.ok}/${rec.n} genomförda`}
    else{const rec=best[ID+'-tally']||{ok:0,n:0};rec.n++;best[ID+'-tally']=rec;best[ID]=`${rec.ok}/${rec.n} genomförda`}
    saveBest();
    const name={R:'Rött babordsmärke',G:'Grönt styrbordsmärke',W:'Västprick'};
    const rows=marks.filter(m=>m.done).map((m,i)=>`<li>${name[m.k]}: ${m.ok?'rätt sida':'<b>fel sida</b>'}, cirka ${Math.round(m.clear)} m ifrån${m.ok&&m.clear<30?' (nära, håll mer marginal)':''}</li>`).join('');
    const close=marks.filter(m=>m.done&&m.ok&&m.clear<30).length;
    const mm=x=>`${Math.floor(x/60)}:${String(Math.floor(x%60)).padStart(2,'0')}`;
    $('#out').innerHTML=`<div class="card" style="padding:16px;gap:10px"><span class="eyebrow">Passagen är över</span>
      <p class="ex ${ok?'good':'bad'}"><strong>${ok?(close?'Framme, men nära ögat':'Framme, väl genomfört'):'Grundstötning'}</strong>${msg}${ok&&close?` Du passerade ${close} märke${close>1?'n':''} på under 30 m. I verkligheten kan märken ligga en bit från grundets kant åt båda hållen, så håll gärna 50 m.`:''}</p>
      ${ok?'':`<div><b>Varför det blev fel</b><p style="margin:4px 0 0">Sjömärken visar var det djupa vattnet finns. Planera varje märke i förväg: vilken färg, vilken sida och vad som kommer efter. I mörker hjälper det att räkna blixtarna och jämföra med sjökortet eller plottern innan du går förbi.</p></div>`}
      <div><b>Märken längs vägen</b><ul style="margin:4px 0 0;padding-left:20px">${rows||'<li>Inga märken passerade.</li>'}</ul></div>
      <p class="foot" style="margin:0">Tid: ${mm(t)}. ${passed} av ${marks.length} märken passerade.</p>
      <div class="controls"><button class="btn primary" id="again">Kör igen</button><span class="foot">${best[ID]}</span></div></div>`;
    $('#again').onclick=reset;draw()}
  function step(dt){
    t+=dt;const prev=track(own.x,own.y);
    const dh=norm180(own.ho-own.h),rate=4*dt;own.h=norm360(own.h+Math.max(-rate,Math.min(rate,dh)));
    own.v+=Math.max(-dt/4,Math.min(dt/4,own.vo-own.v));
    own.x+=own.v*dt/3600*Math.sin(rad(own.h));own.y+=own.v*dt/3600*Math.cos(rad(own.h));
    const tr=track(own.x,own.y);
    for(const m of marks){if(m.done)continue;if(prev.s<m.s&&tr.s>=m.s){m.done=true;
      const ok=m.k==='R'?tr.off>-W_OFF:tr.off<W_OFF;m.ok=ok;m.clear=Math.abs(tr.off-(m.k==='R'?-W_OFF:W_OFF))*1852;
      if(!ok)return finish(false,`Du passerade ${m.k==='R'?'ett rött babordsmärke':m.k==='G'?'ett grönt styrbordsmärke':'västpricken'} på fel sida. ${m.k==='R'?'Babordsmärken lämnas om babord (till vänster) när du går i farledens riktning.':m.k==='G'?'Styrbordsmärken lämnas om styrbord (till höger) i farledens riktning.':'En västprick passeras väster om märket.'}`);
      passed++}}
    if(Math.abs(tr.off)>GROUND&&tr.s>0.05)return finish(false,`Du kom för långt ut på ${tr.off>0?'höger':'vänster'} sida av farleden, där det är grunt. Håll dig mellan märkena, och girar leden: börja girningen i tid så att du inte går rakt fram ur leden.`);
    if(tr.s>=tot-0.02)return finish(true,`Du följde farleden hela vägen på ${Math.floor(t/60)} minuter och passerade alla ${passed} märken rätt.${night?' Längst in låg ensfyrarna i linje, då är du mitt i leden.':''}`);
  }
  // ----- drawing -----
  function proj(x,y,cx,f){const dx=x-own.x,dy=y-own.y,d=Math.hypot(dx,dy),rb=norm180(deg(Math.atan2(dx,dy))-own.h),z=d*Math.cos(rad(rb));
    if(z<0.01||Math.abs(rb)>FOV+20)return null;return {sx:cx+Math.tan(rad(rb))*f,z,d,rb}}
  function draw(){
    const c=ctx,Wd=size,SH=Math.round(H*0.66),cx=Wd/2,y0=SH*0.42,f=cx/Math.tan(rad(FOV));
    const ppm=z=>f*EX/(z*1852), baseY=z=>Math.min(SH+40,y0+ppm(z)*EYE);
    let g=c.createLinearGradient(0,0,0,y0);g.addColorStop(0,night?'#02060b':'#86bcdc');g.addColorStop(1,night?'#0b1824':'#e4f1f7');c.fillStyle=g;c.fillRect(0,0,Wd,y0);
    g=c.createLinearGradient(0,y0,0,SH);g.addColorStop(0,night?'#06111a':'#4f8ba8');g.addColorStop(1,night?'#020508':'#1d4f6a');c.fillStyle=g;c.fillRect(0,y0,Wd,SH-y0);
    if(night){c.fillStyle='rgba(255,255,255,.55)';for(let i=1;i<=45;i++){const h1=Math.sin(i*12.9898)*43758.5453,h2=Math.sin(i*78.233)*12345.6789;c.fillRect((h1-Math.floor(h1))*Wd,(h2-Math.floor(h2))*(y0-8),1,1)}}
    const tt=wall;
    // collect objects
    const objs=[];
    islands.forEach(o=>{const p=proj(o.x,o.y,cx,f);if(p)objs.push({...p,type:'isl',o})});
    marks.forEach(m=>{const p=proj(m.x,m.y,cx,f);if(p)objs.push({...p,type:'mark',o:m})});
    ENS.forEach((e,i)=>{const p=proj(e.x,e.y,cx,f);if(p)objs.push({...p,type:'ens',o:e,i})});
    {const p=proj(SECT.x,SECT.y,cx,f);if(p)objs.push({...p,type:'sect'})}
    if(night)HOUSES.forEach(o=>{const p=proj(o.x,o.y,cx,f);if(p)objs.push({...p,type:'house',o})});
    objs.sort((a,b)=>b.z-a.z);
    objs.forEach(p=>{
      const by=baseY(p.z),k=ppm(p.z);
      if(p.type==='isl'){const half=Math.atan(p.o.r/p.d),wpx=Math.tan(half)*f*1.0,hpx=Math.max(1.5,k*p.o.h*0.6);
        c.fillStyle=night?'#0a141c':'#5f7f62';c.beginPath();c.moveTo(p.sx-wpx,by);c.bezierCurveTo(p.sx-wpx*0.6,by-hpx,p.sx+wpx*0.4,by-hpx*1.1,p.sx+wpx,by);c.closePath();c.fill();
        if(!night){c.fillStyle='#8a8f86';c.fillRect(p.sx-wpx,by-Math.max(1,hpx*0.12),wpx*2,Math.max(1,hpx*0.12))}}
      if(p.type==='mark'){const m=p.o,ch=CHAR[m.k],hp=Math.max(3,k*4),wp=Math.max(1.2,k*0.9);
        if(!night){const col=m.k==='R'?'#c8231b':m.k==='G'?'#178a3e':null;
          if(col){c.fillStyle=col;c.fillRect(p.sx-wp/2,by-hp,wp,hp);
            if(m.k==='R')c.fillRect(p.sx-wp*0.6,by-hp-wp*1.3,wp*1.2,wp*1.1);else{c.beginPath();c.moveTo(p.sx,by-hp-wp*1.5);c.lineTo(p.sx-wp*0.7,by-hp-wp*0.2);c.lineTo(p.sx+wp*0.7,by-hp-wp*0.2);c.fill()}}
          else{c.fillStyle='#f2c200';c.fillRect(p.sx-wp/2,by-hp,wp,hp);c.fillStyle='#151515';c.fillRect(p.sx-wp/2,by-hp*0.66,wp,hp*0.33);
            c.beginPath();c.moveTo(p.sx-wp*0.6,by-hp-wp*1.6);c.lineTo(p.sx+wp*0.6,by-hp-wp*1.6);c.lineTo(p.sx,by-hp-wp*0.9);c.fill();c.beginPath();c.moveTo(p.sx,by-hp-wp*0.9);c.lineTo(p.sx-wp*0.6,by-hp-wp*0.2);c.lineTo(p.sx+wp*0.6,by-hp-wp*0.2);c.fill()}}
        if(night){const bob=Math.sin(tt*1.5+m.ph*2.1)*Math.min(3,k*0.5);drawLight(c,p.sx+Math.sin(tt*1.1+m.ph)*Math.min(1.5,k*0.2),by-hp+bob,ch.col,p.d,ch.range,'point',litLevel(ch.seq,tt+m.ph),by,tt,m.ph,SH)}}
      if(p.type==='ens'){const hp=Math.max(3,k*p.o.h),wp=Math.max(1.5,k*1.6);
        if(!night){c.fillStyle='#f4f4f0';c.fillRect(p.sx-wp/2,by-hp,wp,hp);c.fillStyle='#d9461f';c.fillRect(p.sx-wp/2,by-hp,wp,Math.max(1,hp*0.18))}
        else drawLight(c,p.sx,by-hp,LW,p.d,7,'lantern',litLevel([2,2],tt),by,tt,p.i+5,SH)}
      if(p.type==='sect'){const hp=Math.max(4,k*SECT.h),wp=Math.max(1.5,k*2.2);
        if(!night){c.fillStyle='#f4f4f0';c.fillRect(p.sx-wp/2,by-hp,wp,hp);c.fillStyle='#c8231b';c.fillRect(p.sx-wp*0.7,by-hp-wp*0.8,wp*1.4,wp*0.8)}
        else{const bFrom=norm360(deg(Math.atan2(own.x-SECT.x,own.y-SECT.y)));const dv=norm180(bFrom-180);
          let col=Math.abs(dv)<=2.5?LW:dv>2.5&&dv<=35?LR:dv<-2.5&&dv>=-35?LG:null;
          if(Math.abs(Math.abs(dv)-2.5)<0.6&&Math.sin(tt*23)>0)col=Math.abs(dv)<=2.5?(dv>0?LR:LG):LW;
          if(col)drawLight(c,p.sx,by-hp,col,p.d,SECT.range,'lantern',litLevel([4.5,1.5],tt),by,tt,3,SH)}}
      if(p.type==='house'){drawLight(c,p.sx,by-Math.max(1,k*4),p.o.col,p.d,2.2,'point',0.55+0.05*Math.sin(tt*0.7+p.o.ph),by,tt,p.o.ph,SH)}
    });
    // own bow and frame
    c.fillStyle=night?'#151e24':'#eef2f3';c.strokeStyle=night?'#2c3a42':'#9aa8b0';c.lineWidth=2;
    c.beginPath();c.moveTo(cx-Wd*0.3,SH);c.quadraticCurveTo(cx-Wd*0.1,SH-SH*0.13,cx,SH-SH*0.22);c.quadraticCurveTo(cx+Wd*0.1,SH-SH*0.13,cx+Wd*0.3,SH);c.closePath();c.fill();c.stroke();
    c.strokeStyle=night?'#38464e':'#c3ccd1';c.beginPath();c.moveTo(cx,SH-SH*0.22);c.lineTo(cx,SH);c.stroke();c.lineWidth=1;
    c.fillStyle=night?'#0b1217':'#26343c';c.fillRect(0,0,Wd,10);
    c.beginPath();c.moveTo(0,0);c.lineTo(22,0);c.lineTo(8,SH);c.lineTo(0,SH);c.fill();
    c.beginPath();c.moveTo(Wd,0);c.lineTo(Wd-22,0);c.lineTo(Wd-8,SH);c.lineTo(Wd,SH);c.fill();
    // instruments
    drawPanel(c,Wd,SH,H-SH,own,plotter?'PLOTTER 0,8 M':'PLOTTER AV',(c,x,y,w,h)=>{
      c.beginPath();c.rect(x,y,w,h);c.clip();
      if(!plotter){c.fillStyle='#050c10';c.fillRect(x,y,w,h);c.fillStyle='#4d6370';c.font='10px "JetBrains Mono", monospace';c.textAlign='center';c.fillText('avstängd',x+w/2,y+h/2+4);return}
      c.fillStyle=night?'#0d2433':'#cfe6f2';c.fillRect(x,y,w,h);
      const R=0.8,s=Math.min(w,h)/2/R,pcx=x+w/2,pcy=y+h/2,P=(px,py)=>[pcx+(px-own.x)*s,pcy-(py-own.y)*s];
      c.fillStyle=night?'#3a3a20':'#e8d9a0';islands.forEach(o=>{const[a,b]=P(o.x,o.y);c.beginPath();c.arc(a,b,o.r*s,0,7);c.fill()});
      c.strokeStyle=night?'#6c8a9a':'#4a6a7a';c.setLineDash([4,3]);c.beginPath();WP.forEach(([px,py],i)=>{const[a,b]=P(px,py);i?c.lineTo(a,b):c.moveTo(a,b)});c.stroke();c.setLineDash([]);
      marks.forEach(m=>{const[a,b]=P(m.x,m.y);c.fillStyle=m.k==='R'?'#e0342a':m.k==='G'?'#1f9e4a':'#e6b800';c.beginPath();c.arc(a,b,2.6,0,7);c.fill()});
      c.save();c.translate(pcx,pcy);c.rotate(rad(own.h));c.fillStyle=night?'#ffb238':'#1f5f8b';c.beginPath();c.moveTo(0,-7);c.lineTo(4,5);c.lineTo(-4,5);c.closePath();c.fill();c.restore();
    });
  }
  function glow(c,x,y,col,d){const r=Math.max(1.4,3.2-d*0.6);c.globalAlpha=.25;c.fillStyle=col;c.beginPath();c.arc(x,y,r*4,0,7);c.fill();c.globalAlpha=1;c.beginPath();c.arc(x,y,r,0,7);c.fill()}
  function loop(ts){
    const rdt=Math.min(0.1,(ts-last)/1000);last=ts;wall+=rdt;
    if(run){const dt=rdt*SCALE,n=Math.ceil(dt/0.5);for(let i=0;i<n&&run;i++)step(dt/n);readout()}
    draw();raf=requestAnimationFrame(loop);
  }
  $('#v-plot').onclick=()=>{plotter=!plotter;$('#v-plot').textContent='Plotter: '+(plotter?'på':'av');$('#v-plot').className='btn'+(plotter?' primary':'')};
  $('#go').onclick=()=>{if(done)return;run=!run;$('#go').textContent=run?'Pausa':'Fortsätt'};
  $('#new').onclick=reset;
  $('#h-port').onclick=()=>act(-5,0);$('#h-stbd').onclick=()=>act(5,0);$('#h-slow').onclick=()=>act(0,-1);$('#h-fast').onclick=()=>act(0,1);
  const key=e=>{if(e.key==='ArrowLeft'){act(-5,0);e.preventDefault()}if(e.key==='ArrowRight'){act(5,0);e.preventDefault()}if(e.key==='ArrowDown'){act(0,-1);e.preventDefault()}if(e.key==='ArrowUp'){act(0,1);e.preventDefault()}};
  window.addEventListener('keydown',key);
  const rs=()=>{ctx=fit();draw()};window.addEventListener('resize',rs);
  reset();last=performance.now();raf=requestAnimationFrame(loop);
  stopSim=()=>{cancelAnimationFrame(raf);window.removeEventListener('keydown',key);window.removeEventListener('resize',rs)};
}

function figRoseFull(deg=45){

 for(let d=0;d<360;d+=5){const t=d*Math.PI/180,L=d%30===0?16:d%10===0?10:6;s+=`<line x1="${(C+Math.sin(t)*R).toFixed(1)}" y1="${(C-Math.cos(t)*R).toFixed(1)}" x2="${(C+Math.sin(t)*(R-L)).toFixed(1)}" y2="${(C-Math.cos(t)*(R-L)).toFixed(1)}" stroke="var(--ink)" stroke-width="${d%30===0?2:1}"/>`;
  if(d%30===0)s+=`<text x="${(C+Math.sin(t)*(R+14)).toFixed(1)}" y="${(C-Math.cos(t)*(R+14)+4).toFixed(1)}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="var(--muted)">${String(d).padStart(3,'0')}</text>`}
 [['N',0,18],['NO',45,12],['O',90,15],['SO',135,12],['S',180,15],['SV',225,12],['V',270,15],['NV',315,12]].forEach(([n,d,fs])=>{const t=d*Math.PI/180,r=d%90?70:84;s+=`<text x="${(C+Math.sin(t)*r).toFixed(1)}" y="${(C-Math.cos(t)*r+fs*0.35).toFixed(1)}" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-weight="700" font-size="${fs}" fill="${n==='N'?'#c8312b':'var(--ink)'}">${n}</text>`});
 s+=`<path d="M${C} ${C-50} L${C+7} ${C} L${C} ${C+50} L${C-7} ${C}Z" fill="none" stroke="var(--line)"/><path d="M${C-50} ${C} L${C} ${C-7} L${C+50} ${C} L${C} ${C+7}Z" fill="none" stroke="var(--line)"/>`;
 s+=`<g class="rose-arrow" transform="rotate(${deg} ${C} ${C})"><line x1="${C}" y1="${C}" x2="${C}" y2="${C-R+22}" stroke="var(--sea)" stroke-width="4" stroke-linecap="round"/><path d="M${C-9} ${C-R+30} L${C} ${C-R+12} L${C+9} ${C-R+30}Z" fill="var(--sea)"/></g><circle cx="${C}" cy="${C}" r="5" fill="var(--ink)"/></svg>`;
 return s}
const DIRNAME=d=>['nord','nordost','ost','sydost','syd','sydväst','väst','nordväst'][Math.round(((d%360)+360)%360/45)%8];
function roseWidget(){return `<div class="rosew" data-widget="rose"><div class="fig">${figRoseFull(45)}</div><div class="slider"><label>Kurs</label><input type="range" min="0" max="359" value="45" aria-label="Kurs i grader"><output>045°</output></div><div class="controls rose-q">${[0,45,90,135,180,225,270,315].map(d=>`<button class="btn" data-d="${d}">${String(d).padStart(3,'0')}</button>`).join('')}</div><p class="rose-txt" style="margin:0"></p></div>`}
function initWidgets(root){root.querySelectorAll('[data-widget=restid]').forEach(w=>{const [a,b]=w.querySelectorAll('input'),o1=w.querySelector('.o1'),o2=w.querySelector('.o2'),t=w.querySelector('.rt-txt'),D=12;
 const fm=h=>{const m=Math.round(h*60);return m>=60?`${Math.floor(m/60)} h${m%60?` ${m%60} min`:''}`:`${m} min`};
 const up=()=>{const v=+a.value,c=+b.value,sog=v+c;o1.textContent=String(v).replace('.',',')+' kn';o2.textContent=c===0?'ingen':(c>0?'+':'−')+String(Math.abs(c)).replace('.',',')+' kn';
  t.innerHTML=sog<=0?'Strömmen är lika stark som din fart eller starkare. Du kommer inte fram.':`Resan är <b>12 M</b>. Loggen visar ${String(v).replace('.',',')} knop, men <b>SOG blir ${String(sog).replace('.',',')} knop</b>.<br>Räknar du med loggen tror du att resan tar ${fm(D/v)}. Den tar egentligen <b>${fm(D/sog)}</b>.`};
 a.addEventListener('input',up);b.addEventListener('input',up);up()});root.querySelectorAll('[data-widget=rose]').forEach(w=>{const inp=w.querySelector('input'),out=w.querySelector('output'),arr=w.querySelector('.rose-arrow'),txt=w.querySelector('.rose-txt');
 const up=()=>{const d=+inp.value,dd=String(d).padStart(3,'0');arr.setAttribute('transform',`rotate(${d} 150 150)`);out.textContent=dd+'°';txt.innerHTML=`Kurs <b>${dd}°</b> är ${d%45===0?'':'ungefär '}<b>${DIRNAME(d)}</b>. Fören pekar dit pilen pekar.`};
 inp.addEventListener('input',up);w.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{inp.value=b.dataset.d;up()});up()})}

{t:'Välkommen ombord: grunderna',ls:[
 {id:'f-0-1',t:'Båtens delar och sjöns ord',b:`
<p>På sjön används egna ord för riktningar och delar av båten. De finns för att det inte ska bli missförstånd: "vänster" beror på vart du tittar, men "babord" är alltid samma sida av båten.</p>
<div class="fig">${figBoat()}</div>
<ul><li><b>Fören</b> är båtens främre del, <b>aktern</b> den bakre.</li>
<li><b>Babord</b> är vänster sida och <b>styrbord</b> höger sida, när du står i båten och tittar framåt mot fören.</li>
<li><b>Tvärs</b> betyder rakt ut åt sidan, i 90 grader från båten.</li>
<li><b>För om tvärs</b> är framför den linjen, <b>akter om tvärs</b> bakom den.</li>
<li><b>Lovart</b> är sidan vinden kommer ifrån, <b>lä</b> den skyddade sidan.</li></ul>
<h3>Lovart och lä</h3>
<div class="fig">${figLovart()}</div>
<p>Vinden träffar alltid <b>lovartssidan</b> först. Den andra sidan, <b>läsidan</b>, ligger i skydd. Det gäller både båten och allt annat i vattnet.</p>
<ul><li>Bakom en ö är det lugnare vatten på läsidan. "Att gå in i lä" betyder att söka skydd bakom en ö eller udde när det blåser.</li>
<li>En brygga där vinden blåser mot land är en <b>lovartsbrygga</b>. Den är svårare att lägga till vid, eftersom vinden pressar båten mot bryggan.</li>
<li>Kliv i och ur en jolle eller badstege på läsidan, där båten skyddar mot vind och vågor.</li></ul>
<p class="key"><b>Minnesregel:</b> <b>Styrbord = höger.</b> På vikingaskeppen satt styråran på höger sida, därav namnet. Lanternan på babord är röd, som portvin (port betyder babord på engelska).</p>`,
